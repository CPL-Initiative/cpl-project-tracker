# .github/workflows/weekly-reflections-summary.yml  (in cpl-project-tracker)
name: Weekly reflections summary (public-safe)
on:
  schedule:
    - cron: "0 15 * * 1"   # Mondays ~15:00 UTC, mirrors the private digest
  workflow_dispatch:
permissions:
  contents: write          # lets the commit step push (avoids the 403 we hit on CPLBrain)
jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Build public-safe summary
        env:
          # Reuse the SAME secret the tracker's daily curation sync already uses.
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 reflections/build_reflections_summary.py --out reflections/summary.json
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reflections/summary.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Weekly reflections summary (aggregate, public-safe)"
          git push
