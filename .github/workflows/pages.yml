name: Deploy Pages (lean)

# Custom GitHub Pages deploy for this STATIC dashboard. Replaces the default
# "Deploy from a branch" Jekyll build (which ground through the whole ~553MB repo
# on every push). Repo Settings → Pages → Source MUST be set to "GitHub Actions"
# for this to be the active deployer.
#
# What it publishes: only the paths marked "publish" in .github/pages_allowlist.txt
# (Sam on #3104, 2026-11-11: "yes to all recommendations"; the allowlist since S649).
# A new path in a split folder (the root, kb/, kb/status/ ...) stays off the public
# site until it is given a line there, and tests/pages_allowlist.test.js fails until
# it is. A folder line (library, prototype, kb/contacts_harvest ...) publishes
# everything under it, including what is added later. The served-file ASSERTION below
# fails the build loudly if a known browser-served path is ever missing from _site.
#
# Triggers (all three are load-bearing):
#   • push to main      — human merges / PR merges (they use a real token → DO fire)
#   • workflow_run       — runner workflows push with GITHUB_TOKEN, which by design
#                          does NOT fire push workflows; so we also redeploy when a
#                          main-committing workflow completes ("Daily CPL Dashboard",
#                          and since 2026-07-07 "cos-authority-sync" — its monthly
#                          cron commits kb/cos_matches.json, the CER's COS-badge
#                          overlay, which otherwise sat unserved until the next
#                          daily deploy).
#   • workflow_dispatch  — manual.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Daily CPL Dashboard", "cos-authority-sync"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deploys; let an in-progress one finish (don't cancel a live deploy).
#
# Group renamed `pages` -> `pages-deploy` (2026-08-06). Run #581 wedged in
# `waiting` against a "github-pages deployment approval" gate that does not
# exist — the environment has NO required reviewers and NO wait timer, and its
# branch rule allows `main`, which that run was on. GitHub's cancel endpoint
# 502s on it (four attempts, ~2h), so it can be neither approved nor cleared,
# and `cancel-in-progress: false` means it holds the old group forever. Every
# subsequent run — two merges plus the daily cron — queued behind it and the
# site stopped publishing.
#
# Renaming the group puts new runs in a group the wedged run is not a member
# of. Serialization is preserved WITHIN the new group; the only run outside it
# is #581, which can never execute, so there is no deploy it could race.
# If GitHub ever reaps that run, this can be renamed back — the name carries no
# meaning beyond "runs sharing it are serialized".
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assemble lean site
        run: |
          set -euo pipefail
          mkdir -p _site
          # Export only COMMITTED files, and of those only the paths the allowlist marks
          # "publish" (.github/pages_allowlist.txt; Sam on #3104: "yes to all
          # recommendations"). A new path in a split folder (the root, kb/, kb/status/ ...)
          # stays off the public site until someone gives it a line, and
          # tests/pages_allowlist.test.js fails until they do. A folder line publishes
          # everything under it, including what is added later. "publish?" names a path a
          # workflow will create: published once it is in the commit, skipped with a notice
          # until then. Why each withheld path stays internal: docs/pages_lean_deploy_scope.md.
          # git archive omits .git, node_modules and everything gitignored, as before.
          # >>> allowlist export (tests/pages_allowlist.test.js runs this block on a fixture repo)
          allow=.github/pages_allowlist.txt
          have=$(mktemp)
          # Every tracked file and every folder above one. -z keeps git from quoting a name
          # with non-ASCII bytes; tr then splits on newlines again, so a name that itself
          # holds a newline would still break the list (none is tracked).
          git ls-tree -r -z --name-only HEAD | tr '\0' '\n' \
            | awk '{ n = split($0, a, "/"); p = ""; for (i = 1; i <= n; i++) { p = (i == 1 ? a[1] : p "/" a[i]); print p } }' \
            | sort -u > "$have"
          mapfile -t strict < <(awk '$1 == "publish" { print $2 }' "$allow")
          mapfile -t optional < <(awk '$1 == "publish?" { print $2 }' "$allow")
          if [ "${#strict[@]}" -lt 100 ]; then
            echo "::error::$allow names only ${#strict[@]} publish paths (expected hundreds); not deploying."
            exit 1
          fi
          # Fail loudly, naming every one, if a publish line is not in the commit (a rename or
          # a deletion that left its line behind). Dispatching again will not clear this.
          missing=$(printf '%s\n' "${strict[@]}" | grep -vxF -f "$have" || true)
          if [ -n "$missing" ]; then
            while IFS= read -r m; do echo "::error::allowlisted path is not in the commit: $m"; done <<< "$missing"
            echo "Fix $allow (remove or rename the line, or mark it publish?) in a PR; not deploying."
            exit 1
          fi
          publish=("${strict[@]}")
          for p in "${optional[@]}"; do
            if grep -qxF -- "$p" "$have"; then publish+=("$p")
            else echo "::notice::publish? line not in the commit yet, skipped: $p"; fi
          done
          git --literal-pathspecs archive --format=tar HEAD -- "${publish[@]}" | tar -x -C _site
          # <<< allowlist export
          # GitHub Pages must skip Jekyll for a static site (the repo also ships a
          # root .nojekyll; this is belt + braces).
          touch _site/.nojekyll
          echo "Assembled _site: $(du -sh _site | cut -f1) ($(find _site -type f | wc -l) files)"
          # GitHub documents a 1 GB limit for a published Pages site, and a sync near it outlasts
          # deploy-pages' wait (2026-11-10). Fail over 1000 MB; warn over 800 MB, so a growing
          # site is noticed before it fails.
          mb=$(du -sm _site | cut -f1)
          if [ "$mb" -gt 1000 ]; then
            echo "::error::_site is ${mb} MB, over GitHub Pages' 1 GB limit. Withhold what the browser never fetches in .github/pages_allowlist.txt (du -sh _site/* | sort -h)."
            exit 1
          elif [ "$mb" -gt 800 ]; then
            echo "::warning::_site is ${mb} MB, nearing GitHub Pages' 1 GB limit. du -sh _site/* | sort -h names the largest paths."
          fi

      # Cache-bust the published assets. Sam, 2026-08-22: "I fear users may be
      # looking at stale screens." index.html shipped 38 <script> tags with no
      # version query, and COBI lazy-loads 34 more tab modules by name — so a
      # browser could hold a stale college_briefing.js indefinitely.
      #
      # ⚠️ IT RUNS HERE, NOT IN excel_to_dashboard.py. Stamping during the daily
      # data run would hash the files as they were THAT MORNING, so a JS change
      # merged at noon would publish under the morning's stamp — a version query
      # that looks precise and is wrong. This step hashes the exact bytes being
      # uploaded, on every deploy path (push, the cron's workflow_run, dispatch).
      #
      # It exits non-zero if it stamps NOTHING, so a refactor that changes how
      # assets are referenced fails the deploy instead of silently shipping
      # unversioned pages — same posture as the served-path assertion below.
      - name: Stamp asset versions (cache-busting)
        run: python3 scripts/stamp_asset_versions.py _site

      - name: Assert every browser-served path is present
        run: |
          set -euo pipefail
          # If any of these is missing, an exclude was too aggressive — FAIL the
          # deploy rather than ship a site that 404s a lazy-loaded asset.
          must=(
            "_site/index.html"
            "_site/CPL_Dashboard.html"
            "_site/.nojekyll"
            "_site/CPL_Data.js"
            "_site/live_metrics.json"
            "_site/kb/csr_out/latest.json"
            "_site/kb/cer_procedures_out/latest.json"
            "_site/kpi_history.json"
            "_site/project_lifecycle.js"
            "_site/unified_courses_data.js"
            "_site/unified_courses_details.js"
            "_site/unified_courses_standalone.js"
            "_site/unified_courses_members.js"
            "_site/tmc_college_courses.js"
            "_site/statewide_data.js"
            "_site/cpl_funding_data.js"
            # The public college-audience funding page + the consumer it loads.
            # This is a link handed to colleges, so a prune that 404s it must
            # fail the deploy rather than ship a dead URL.
            "_site/cpl_funding_public.html"
            "_site/cpl_funding.js"
            "_site/fact-sheet/index.html"
            "_site/kb-portal/index.html"
            "_site/sierra/index.html"
            # One page per public family the allowlist serves (#3104 follow-up): the Library,
            # the college-facing CPL opportunity page and the veteran map.
            "_site/library/index.html"
            "_site/cpl-opportunity/index.html"
            "_site/veteran-sprint-map/ca_cpl_map_selfcontained.html"
            # Loaded by a served page: the budget curator (comms.js embeds it), the PDF
            # reader the Library uses (library.js), the privacy page, and SkyView.
            "_site/budget-support/web/curator.html"
            "_site/vendor/pdfjs/pdf.min.mjs"
            "_site/vendor/pdfjs/pdf.worker.min.mjs"
            "_site/privacy.html"
            "_site/prototype/skyview.html"
            "_site/kb/liftoff_plan.json"
            "_site/kb/project_lifecycle.json"
            "_site/kb/coci_articulations.json"
            "_site/kb/coci_curation.json"
            "_site/kb/row_audit/latest.json"
            "_site/kb/reference/cid_descriptors.json"
            "_site/kb/reference/ccn_courses.json"
            # SkyView reads both of these live from prototype/skyview.html, by a
            # RELATIVE ../kb/ href. Neither is fatal to the page — the code fails
            # soft — which is exactly why they belong here: a prune that dropped
            # one would leave the subject table quietly answering from a vote
            # again, and the Common SUBJ column blank, with nothing in the log.
            "_site/kb/discipline_canonical_subj4.json"
            "_site/kb/reference/subject_discipline_map.json"
            "_site/credential_reference_data.js"
            "_site/kb/exhibit_audit/latest.json"
            "_site/kb/unified_titles.json"
            "_site/kb/credentials.json"
            "_site/kb/cos_matches.json"
            "_site/kb/unclassified_preseed.json"
            "_site/kb/unclassified_suggestions.json"
            "_site/kb/issuer_preseed.json"
            # The Common CR Reference worklist. The tab is USELESS without it —
            # a prune that drops it renders an empty queue rather than an error,
            # which reads as "nothing left to curate".
            "_site/kb/cr_reference_worklist.json"
            "_site/cr_reference.js"
            # Sierra's built-in rules, GENERATED from cpl-chat/index.ts. Same
            # reason as the worklist above: without it the built-in rules pane
            # renders "could not load" instead of the ten rules governing Sierra.
            "_site/sierra_rule_defaults.js"
            # The Admin tab's surface map. Without it every menu item renders
            # "not mapped" — honest, but the tab has nothing left to say.
            "_site/cobi_admin_surface.js"
            "_site/admin.js"
            # The menu overlay. Absent, every visitor silently loses the
            # curator arrangement and gets the shipped menu instead.
            "_site/nav_overlay.js"
            "_site/prototype/cer_triage_redesign_v1.html"
            # The LIVE funding explainer (2026-08-23). It replaced a published
            # snapshot precisely so the figures could never go stale, and the
            # tab links to it by a RELATIVE href — so a prune that drops it
            # produces a dead link from inside the dashboard, and one handed to
            # the Chancellor's Office. It computes from cpl_funding.js and the
            # shared payload builder, so all three must survive together.
            "_site/funding-model/index.html"
            "_site/funding_model_payload.js"
          )
          missing=0
          for p in "${must[@]}"; do
            if [ ! -e "$p" ]; then echo "::error::served file MISSING from _site: $p"; missing=1; fi
          done
          # Sanity: the root carries dozens of served *.js — a near-empty count
          # means the copy itself broke.
          jscount=$(find _site -maxdepth 1 -name '*.js' | wc -l)
          if [ "$jscount" -lt 30 ]; then echo "::error::only $jscount root *.js in _site (expected 30+)"; missing=1; fi
          # Served subdirs must be non-empty.
          for d in exports reports tmc/source_pdfs cip_fitcheck; do
            if [ -z "$(ls -A _site/$d 2>/dev/null)" ]; then echo "::error::served dir empty/missing: _site/$d"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then echo "Served-path assertion FAILED — not deploying."; exit 1; fi
          echo "Served-path assertion passed ($jscount root *.js)."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        # deploy-pages waits at most 10 minutes (MAX_TIMEOUT 600000 in v4 and v5; COBIx on #3088), so the size
        # check in Assemble lean site is what keeps the sync inside it.
