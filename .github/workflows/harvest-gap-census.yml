name: Harvest gap census

# Every active program without a passing program requirements record, each with one cause and one
# lever, ranked by the programs a change would move (Sam, 2026-11-12: "we need to increase our
# throughput"; kb/_harvest_gap_census.py). Reads the live tables with the public anon key only
# (coci_college_programs, program_requirement_records, program_source_registry, coci_program_courses)
# and the committed per-college files; writes no table. Commits kb/status/harvest_gap_census.json
# and .md, and the heading-agreement snapshot kb/status/harvest_heading_agreement.json and .md, to the
# branch it ran on. Dispatch only: no schedule.
#
# TWO JOBS (S647, #3232). The census job takes no secret and runs on any ref. The Commons data dashboard's live
# counts (kb/_commons_data_live.py, #3215) run in their own job, `live-counts`, in the GitHub environment
# `live-counts` (Sam, 2026-11-13: restricted to main, holding the service key; COBIx's recommendation on #3232), and
# only on main. An environment with a branch policy refuses a whole job on another ref, so the census could not
# share a job with it and still run on a branch. The export job hands the census job one artifact of counts,
# scrubbed for the key before upload; the census job stays the one writer of kb/status/commons_data.json and makes
# the one push. A skipped or failed export leaves no artifact: the builder keeps the previous block, records
# "not read", and the census still commits.

on:
  workflow_dispatch:
    inputs:
      # COBIx, 6857150335 on #3232: the Commons live counts compare a read's Active programs with the last good
      # block, so a real, lasting shift would hold them at "short read". True takes this one run's read whose only
      # fault is its Active count; the block records the override. It never waives the college floor or an empty
      # read. Default false.
      accept_active_shift:
        description: "Commons live counts: accept this run's Active count outside the band (logged in the block)"
        type: boolean
        default: false

concurrency:
  group: harvest-gap-census-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # The Commons data dashboard's live counts (#3215; COBIx's conditions on PR #3222): counts per college only, never
  # a row; the two tables that name a person are read by count alone; never the anon key. Belt and braces: the `if`
  # skips the job cleanly on a branch, and the environment's branch policy refuses it there whatever the file says.
  # The secret's name inside the environment is assumed to be SUPABASE_SERVICE_KEY (an environment secret overrides
  # the repository secret of the same name); if it is named otherwise, change the one `secrets.` reference below.
  live-counts:
    if: github.ref == 'refs/heads/main'
    environment: live-counts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # It writes out/ alone and exits 0 on a failed read, with a failure class and never an exception's text.
      - name: Commons data live counts (service key, counts only; fails soft)
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 kb/_commons_data_live.py --out out/commons_data_live.json
      # The last word before the upload (the review of #3232, finding 1): the file holds no run of the key's secret
      # part. On a hit it names the file (never the key), deletes it and fails, so nothing is uploaded and the census
      # job records "not read".
      - name: No file holds the service key
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if ! python3 kb/_commons_data_live.py --scrub out; then
            rm -rf out
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: commons-data-live-${{ github.run_id }}
          path: out/commons_data_live.json
          retention-days: 3

  census:
    needs: live-counts
    # Runs whatever the export did: skipped on a branch, failed, or read.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Census (anon reads only)
        run: python3 kb/_harvest_gap_census.py --export out/harvest_gap_live.json
      # The heading-agreement snapshot (S645, #3201): each record's own heading against its program,
      # from the committed per-college files alone; no network. It runs after the census and fails soft:
      # a failure here warns and never stops the census's commit. Nothing gates a PR on either snapshot.
      - name: Heading agreement (committed files only; fails soft)
        run: |
          if ! python3 kb/_program_requirements_heading_agreement.py; then
            echo "::warning::the heading-agreement snapshot did not regenerate; the census files without it"
            git checkout -- kb/status/harvest_heading_agreement.json kb/status/harvest_heading_agreement.md 2>/dev/null || true
          fi
      # The live-counts job's one file of counts, when it ran; absent on a branch or after a failed export.
      - name: The live counts, when the live-counts job filed them
        if: needs.live-counts.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: commons-data-live-${{ github.run_id }}
          path: out
      # The Commons data dashboard's figures (#3215, commons_data.js at #commons/data): the committed files, the live
      # counts (key live, its own basis), the data dictionary and the API checklist. With no live file the builder
      # keeps the previous block and records "not read". Fails soft, as the heading agreement does.
      - name: Commons data dashboard (committed files and the live counts; fails soft)
        env:
          ACCEPT_ACTIVE_SHIFT: ${{ inputs.accept_active_shift }}
        run: |
          shift_arg=""
          if [ "$ACCEPT_ACTIVE_SHIFT" = "true" ]; then
            shift_arg="--accept-active-shift"
            echo "::notice::accept_active_shift is set for this run: a read outside the Active band may be taken, and the block will say so"
          fi
          if ! python3 kb/_build_commons_data_status.py --live out/commons_data_live.json $shift_arg; then
            echo "::warning::the Commons data dashboard did not regenerate; the census files without it"
            git checkout -- kb/status/commons_data.json 2>/dev/null || true
            git checkout -- kb/status/commons_data_programs 2>/dev/null || true
            git clean -fdq -- kb/status/commons_data_programs 2>/dev/null || true
          fi
      - name: Commit to the branch that ran it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kb/status/harvest_gap_census.json kb/status/harvest_gap_census.md
          for f in kb/status/harvest_heading_agreement.json kb/status/harvest_heading_agreement.md kb/status/commons_data.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          # Each cause's programs, one file per college (S649); -A files a college's file removed as well as written.
          if [ -d kb/status/commons_data_programs ]; then git add -A kb/status/commons_data_programs; fi
          if git diff --cached --quiet; then echo "nothing to file"; exit 0; fi
          git commit -m "Harvest gap census (run ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5)); git pull --rebase origin "${{ github.ref_name }}"
          done
          exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: harvest-gap-census-${{ github.run_id }}
          path: out
          # out/ carries the live counts again, so it keeps the counts artifact's short retention, never the default 90 days.
          retention-days: 3
