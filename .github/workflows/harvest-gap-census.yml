name: Harvest gap census

# Every active program without a passing program requirements record, each with one cause and one
# lever, ranked by the programs a change would move (Sam, 2026-11-12: "we need to increase our
# throughput"; kb/_harvest_gap_census.py). Reads the live tables with the public anon key only
# (coci_college_programs, program_requirement_records, program_source_registry, coci_program_courses)
# and the committed per-college files; writes no table. Commits kb/status/harvest_gap_census.json
# and .md, and the heading-agreement snapshot kb/status/harvest_heading_agreement.json and .md, to the
# branch it ran on. Dispatch only: no schedule. The census itself takes no secret; one later step, the
# Commons data dashboard's live counts (kb/_commons_data_live.py, #3215), reads with the existing
# SUPABASE_SERVICE_KEY at that step's scope alone, counts per college only (COBIx's conditions, PR #3222).

on:
  workflow_dispatch: {}

concurrency:
  group: harvest-gap-census-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Census (anon reads only)
        run: python3 kb/_harvest_gap_census.py --export out/harvest_gap_live.json
      # The heading-agreement snapshot (S645, #3201): each record's own heading against its program,
      # from the committed per-college files alone; no network. It runs after the census and fails soft:
      # a failure here warns and never stops the census's commit. Nothing gates a PR on either snapshot.
      - name: Heading agreement (committed files only; fails soft)
        run: |
          if ! python3 kb/_program_requirements_heading_agreement.py; then
            echo "::warning::the heading-agreement snapshot did not regenerate; the census files without it"
            git checkout -- kb/status/harvest_heading_agreement.json kb/status/harvest_heading_agreement.md 2>/dev/null || true
          fi
      # The Commons data dashboard's live counts (#3215; COBIx's conditions on PR #3222): counts per college only,
      # never a row; the two tables that name a person are read by count alone. The service key lives at this
      # step's scope only, and the export never falls back to the anon key. It writes out/ alone; the builder below
      # takes it with --live and stays the one writer of kb/status/commons_data.json. Fails soft: a failed read keeps
      # the previous committed block, and the builder records the attempt. From main alone (COBIx's finding 1 on
      # #3232): the workflow dispatches on any ref, and a branch's own copy of the export must never run with the
      # service key, so on a branch this step is skipped and the builder records the block as not read.
      - name: Commons data live counts (service key, counts only; fails soft)
        if: github.ref == 'refs/heads/main'
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if ! python3 kb/_commons_data_live.py --out out/commons_data_live.json; then
            echo "::warning::the Commons live counts did not run; the builder keeps the previous block"
          fi
      # The Commons data dashboard's figures (#3215, commons_data.js at #commons/data): the committed files, the live
      # counts above (key live, its own basis), the data dictionary and the API checklist. Fails soft, as the
      # heading agreement does.
      - name: Commons data dashboard (committed files and the live counts; fails soft)
        run: |
          if ! python3 kb/_build_commons_data_status.py --live out/commons_data_live.json; then
            echo "::warning::the Commons data dashboard did not regenerate; the census files without it"
            git checkout -- kb/status/commons_data.json 2>/dev/null || true
          fi
      # The last word before the commit and the artifact (the review of #3232, finding 1): no file this job wrote
      # holds the service key or a 20-character run of it. On a hit it names the file (never the key), restores the
      # status files, empties out/ and fails, so nothing that holds the key is committed or uploaded.
      - name: No file holds the service key (main only)
        if: github.ref == 'refs/heads/main'
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if ! python3 kb/_commons_data_live.py --scrub out kb/status; then
            git checkout -- kb/status/
            rm -rf out && mkdir -p out
            exit 1
          fi
      - name: Commit to the branch that ran it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kb/status/harvest_gap_census.json kb/status/harvest_gap_census.md
          for f in kb/status/harvest_heading_agreement.json kb/status/harvest_heading_agreement.md kb/status/commons_data.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then echo "nothing to file"; exit 0; fi
          git commit -m "Harvest gap census (run ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5)); git pull --rebase origin "${{ github.ref_name }}"
          done
          exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: harvest-gap-census-${{ github.run_id }}
          path: out
