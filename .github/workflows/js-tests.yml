name: JS tests

# Consumer (jsdom) regression tests for the dashboard's static front-end JS
# (credential_reference.js, …) plus the pure-stdlib python lints. Catches
# regressions like the Session-32 raw_variants:null search/expand crash before
# they ship.
#
# E (Sam's ruling, 2026-08-29: "option 2!") — this check is meant to become
# REQUIRED in branch protection, conditional-fast: the only expensive step is
# `npm test` (~8.5 min), and it alone is skipped when every changed file is
# docs-shaped (see the gate step). Every other step always runs, so the check
# ALWAYS reports. Until Sam flips branch protection (a GitHub setting sessions
# cannot change) it remains non-required: a failing run leaves the PR
# `unstable`, which the auto-merge policy still merges.
# ⚠️ NEVER convert this to `paths-ignore:`/`paths:` on the trigger, or an `if:`
# on the JOB — a skipped required check never reports, which blocks the PR
# FOREVER. The conditional must stay inside an always-run job.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # `playwright` is a RUNTIME dependency of this package, but NOTHING under
    # tests/ requires it -- it is used only by the browser-check scripts in
    # prototype/, scripts/ and fact-sheet/, which are deliberately outside
    # `npm test` (see the SkyView launcher note below). Without this, every CI
    # run downloads Chromium + Firefox + WebKit before running a suite that
    # never launches a browser. Measured 2026-08-28: with the download skipped,
    # `npm install` is ~5s for 41 packages / 45 MB.
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: npm install
      # The E gate (Sam, 2026-08-29: "option 2!"): skip `npm test` alone when
      # the whole diff is docs-shaped. The decision is a SKIP-LIST, not a
      # run-list — measured 2026-08-30, the suite reads .js/.html/.json/.css/
      # .sql/.ts, so "run when JS changes" under-triggers silently; instead
      # anything unrecognized runs the suite (scripts/js_suite_gate.sh holds
      # the rule; tests/js_suite_gate_test.py pins its boundary both ways).
      # On push to main there is no base to diff against and the full suite
      # always runs.
      - name: Decide whether the full JS suite runs
        id: gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            decision=run
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            files=$(git diff --name-only "$BASE_SHA" HEAD)
            decision=$(printf '%s\n' "$files" | scripts/js_suite_gate.sh)
          fi
          echo "JS suite decision: $decision"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
      # `tests/run.js` runs files CONCURRENTLY since 2026-08-28 (each still in
      # its own process). It sizes the pool from measured peak RSS and the
      # runner's RAM — 4 on a 16 GB ubuntu-latest. Measured before: 280 files,
      # 1,245s serial, of which `cpl_funding_*` was 28 files and 967s (78%).
      # If this job ever OOMs, set TEST_CONCURRENCY here rather than reverting.
      - if: steps.gate.outputs.decision == 'run'
        run: npm test
      # The ONE suite input a docs-shaped diff can still change is
      # docs/catalog/** — regenerated beside the docs index on most docs PRs,
      # and read by exactly one test file. Run that file even when the suite
      # is skipped (~2s), so a catalog-reshaping docs PR cannot merge green
      # and then turn main's always-full push run red.
      # tests/js_suite_gate_test.py fails if a future test starts reading
      # another inert path without being added here.
      - name: Docs-reading jsdom tests (run even when the suite is skipped)
        if: steps.gate.outputs.decision == 'skip'
        run: node tests/governance_docs_panel.test.js
      # First Light contrast lint (Session 49) — verifies the live :root in
      # both HTMLs matches the blessed spec (prototype v1.6) and measures AA
      # on worst-case backdrops. Pure-stdlib python; part of this same
      # non-required check.
      - name: Contrast lint (live :root vs First Light spec)
        run: python3 prototype/check_contrast.py --live
      # Supabase grant lint (Session 172) — `revoke ... from anon, authenticated`
      # does NOT remove the PUBLIC grant, so it protects nothing. Six
      # security-definer functions that truncate live tables were reachable with
      # the published anon key. Pure-stdlib python; same non-required check.
      - name: Supabase function-grant lint (revoke must name PUBLIC)
        run: python3 tests/supabase_function_grants_test.py
      # Re-key chain guard (Session 224) — a re-mint alias map can CHAIN (one
      # pair's old key is another pair's new key: `ARME M10AJ -> FLNG M10AJ`
      # beside `ARMN M10AJ -> ARME M10AJ`). The Supabase re-key must vacate the
      # shared key before filling it and must not count it as a leftover; the
      # 2026-09-03 recode run went red on exactly that false positive. Pure-stdlib
      # python, no network.
      - name: Supabase re-key chain guard (kb/_rekey_kb_curation_supabase.py)
        run: python3 tests/rekey_kb_curation_chain_test.py
      # The two re-mint applies (Session 224, #1453) — apply == spec, gated
      # against the frozen receipt: a moved row without its stamp, a ghost key
      # not healed, a pointer left on a Z id, a materialized record with a
      # membership entry of its own. 37 fixture checks that ran nowhere until
      # this step. Pure-stdlib python, no network.
      - name: Re-mint apply guards (kb/_authority_recode_apply.py, kb/_zband_retire_apply.py)
        run: |
          python3 tests/authority_recode_apply_test.py
          python3 tests/zband_retire_apply_test.py
      # UC-CUR placeholder promotion (Session 226) — the promote step the Z-band
      # retirement left open: a client or auto-merge mint's transient UC-CUR
      # target becomes a real M-ID record. Guards the number allocation (every
      # id ever minted stays reserved; CCN/C-ID numbers skipped; a full bucket
      # continues into the next band), the umbrella split code, the held cases
      # (one pointer, no discipline, no code, no band — never guessed), the
      # materialized record, P0 twice and P1 drift. Pure-stdlib python, no network.
      - name: UC-CUR promotion guard (kb/_uc_cur_promote.py)
        run: python3 tests/uc_cur_promote_test.py
      # Identities map re-key (Session 226) — the articulation identities map
      # carried 1,597 keys on ids no longer in the catalog. Guards the chain
      # resolution (one lookup per map, in order), the collision rule (the live
      # entry wins), the convergence tie-break (title, colleges, alphabetical),
      # the dead drop, the stamp, and — against the committed files — that
      # every ghost is dispositioned and the post-state is all live. Pure-stdlib
      # python, no network.
      - name: Identities map re-key guard (kb/_identities_rekey_dryrun.py)
        run: python3 tests/identities_rekey_test.py
      # Prefix fold dry run (Session 224) — the keep-number re-key for rows off
      # their discipline's canonical code: a span (KINE/ATHL) must not move, a
      # TOP-only discipline is held (Rule 7), a taken number gap-fills instead of
      # cascading, a swap is a cycle and never a chain, --scope reports rather
      # than drops. Pure-stdlib python, no network.
      - name: Prefix fold dry-run guard (kb/_prefix_fold_dryrun.py)
        run: python3 tests/prefix_fold_dryrun_test.py
      # Prefix fold apply (Session 225) — the receipted half: a moved row
      # without its stamp or with an earlier stamp lost, a materialized
      # record's member list left on an old id, a stale identities entry left
      # describing the wrong row, a receipt cut under another scope or ruling
      # passing P1, a second run of the same receipt, a TOP-only row moving
      # without the ruling on its evidence. Pure-stdlib python, no network.
      - name: Prefix fold apply guard (kb/_prefix_fold_apply.py)
        run: python3 tests/prefix_fold_apply_test.py
      # crnc_mirrors re-key (Session 225) — the 6th id-keyed artifact class,
      # missing from the post-apply chain until the recode left 398 of its
      # keys on retired ids: one lookup per map (never iterated within a map),
      # cross-map chains followed, two classes converging reported not merged,
      # a key on a memberless id reported, the era suffix guarded. Reads the
      # committed file too. Pure-stdlib python, no network.
      - name: crnc mirrors re-key guard (kb/_rekey_crnc_mirrors.py)
        run: python3 tests/rekey_crnc_mirrors_test.py
      # MAP's per-dataset verdict (2026-08-26) — the nightly load failed three
      # nights reporting a name mismatch while MAP was plainly answering
      # 400 "View_StudentDetailsCredits_APIDataset is not Valid" in a field
      # nothing read. Also pins that strictness stays OPT-IN: the daily
      # dashboard shares this fetcher and must not fall back over datasets it
      # never reads. Pure-stdlib python, no network.
      - name: MAP CustomReport response verdict (responseCode / duplicate views)
        run: python3 tests/custom_report_response_test.py
      # Lifecycle-booleans probe (Session 223) — the runner-side instrument that
      # finds Pedro's CPL lifecycle boolean columns + CollegeID2 on the MAP API.
      # Pins its truncated-response reader, boolean/token logic, PII denylist,
      # and that a student key used for in-memory grouping never reaches the
      # log. Pure-stdlib python, no network.
      - name: Lifecycle-booleans probe guard (kb/_probe_lifecycle_checks.py)
        run: python3 tests/probe_lifecycle_checks_test.py
      # Origination feed (Session 216, the N2 b gate) — the noncredit-only
      # institutions draw ONLY as CPL originating from them posts at a credit
      # college, so the nc_* keys and the origination block must be ABSENT (not
      # zeroed) until the pull carries LocID2, district/statewide scope must
      # follow the ruling, and an unresolvable LocID2 must surface rather than
      # be guessed onto an institution. Pure-stdlib python; same non-required
      # check.
      - name: Origination feed lint (funding/_build_funding_performance.py)
        run: python3 tests/funding_origination_test.py
      # Doctrine lookup (Session 179) — kb/doctrine.py answers "what has this
      # repo already decided about the files I am about to touch?", replacing
      # recall across 299 KB notes. It shipped with two silent-omission bugs
      # (the last artifact of every note dropped — 235 entries; and --changed
      # missing untracked files), so it carries its own guard. Pure-stdlib
      # python; same non-required check.
      - name: Doctrine lookup lint (kb/doctrine.py)
        run: python3 tests/doctrine_lookup_test.py
      # Context-pressure meter (Session 206) — this session auto-compacted at
      # 786,077 tokens with the checkpoint 150K stale, because Rule 9's trigger
      # said "Claude Code doesn't expose an exact counter; use proxies". It
      # does, in the transcript. The guard pins that the WARN threshold still
      # fits a heavy turn AND a full checkpoint (the first draft missed by 336
      # tokens) and that announce-once never becomes announce-never. Pure
      # stdlib; same non-required check.
      - name: Context-pressure meter (kb/_context_budget.py)
        run: python3 tests/context_budget_test.py
      # Merge-chain flattening (Session 187) — the curation overlay stores one
      # hop per row, so an identity merged into and then merged onward is both a
      # source and a target; the merge-target loop never skipped those, and 340
      # folded identities rendered as their own rows with members stranded
      # mid-chain. Wired here because 18 of the 20 tests/*_test.py run NOWHERE —
      # npm test discovers only *.test.js — and a guard nothing executes is not
      # a guard. Needs openpyxl (it imports the generator), which the job above
      # does not install, so it installs it itself. Same non-required check.
      - name: Merge-chain flattening lint (excel_to_dashboard.py)
        run: |
          pip install --quiet openpyxl
          python3 tests/merge_chain_flatten_test.py
      # Curated-anchor duplicates lane (Session 226) — the May 2026 curated
      # common-course anchors whose title and discipline exactly match a
      # catalog identity, offered to the curator as a worklist lane (never
      # merged by a script). Guards the strict title key (Accounting I is not
      # Accounting II), the discipline gate, the live-target resolution, the
      # member order that IS the merge direction, and — against the committed
      # files — that every receipt anchor is offered or already merged. Imports
      # the generator, so it runs in the openpyxl step above.
      - name: Curated-anchor duplicates lane guard (legacy_anchor_duplicate_groups)
        run: python3 tests/legacy_anchor_duplicates_test.py
      # Beginning-ESL spot-check worklist (Session 188) — the description-level
      # detector proposes re-levels against live curation rows, so its failure
      # modes are confident-wrong writes: reading a PREREQUISITE clause as the
      # course's own level (inverts the finding), reading the "Basic Skills
      # Level:" COCI field value as a level claim, and re-pointing a PURPOSE
      # carve-out (Enrichment/Civic/Vocational ESL) at a level survivor, which
      # silently strips the carve-out. Pure-stdlib python; same non-required
      # check.
      - name: ESL fold spot-check lint (kb/_build_esl_fold_spotcheck.py)
        run: python3 tests/esl_fold_spotcheck_test.py
      # ESL level bands (Session 188) — Sam ratified 0-2 Beginning / 3-5 Intermediate /
      # 6-10 Advanced, which supersedes the P-4 pinning and required extending the reader
      # from single-digit 1-7 to 0-10. That extension misfires without three guards, each
      # found in live data: a level WORD must beat a number ("Beginning Skills 9"), a grade
      # range is not a level ("K-12"), and roman numerals stop at VII ("Beginning Skills 2
      # X" reads the trailing X as 10). All three are proven to fail the test when broken.
      # Pure-stdlib python; same non-required check.
      - name: ESL level-band lint (kb/_esl_relevel_dryrun.py)
        run: python3 tests/esl_relevel_bands_test.py
      # SkyView member payload (Session 189) — the graph carried identities and NO
      # member courses, so there was nothing at course grain to drag and the one
      # verb the view exists for was unreachable. The payload's failure modes are
      # both invisible on screen: a member with no control number cannot be
      # written as `CN:<control_number>` and must be DROPPED and counted rather
      # than coerced to zero, and 1,122 control numbers sit under more than one
      # identity, so a move is a global statement that has to leave every card.
      # Both are proven to fail the test when broken. Browser behavior (does a
      # drag actually complete?) is prototype/check_ccr_atlas.js, deliberately not
      # in npm test. Pure-stdlib python; same non-required check.
      - name: SkyView member payload lint (kb/_build_ccr_universe.py)
        run: python3 tests/ccr_universe_members_test.py
      # SkyView orbit layout (Session 223) — every stand-alone course sits in
      # orbit around the identity it is most aligned to. Guards the alignment
      # floor (TOP + units + credit never earn an orbit alone; the title carries
      # the weight), the ring geometry (no overlaps, everything inside its
      # island) and the description shards being keyed by control number.
      # Pure-stdlib python; same non-required check.
      - name: SkyView orbit layout lint (kb/_build_ccr_universe.py)
        run: python3 tests/ccr_universe_orbits_test.py
      # SkyView launcher (Session 189) — Sam asked for "a button on the CCR Tab top
      # right and prominent". The failure this guards is not a missing button, it is
      # a button pointing at something that is not deployed: the self-contained
      # SkyView build is 9.9 MB and GITIGNORED, so a link to it 404s on the live site
      # while working perfectly on the machine that built it. Proven to fail when the
      # href is repointed at that build. Runs under `npm test` via tests/run.js.
      # Docs corpus (Session 204) — the lint that guards this repo's prose had
      # itself never run in CI: `npm test` discovers only *.test.js, so
      # tests/docs_audit_test.py's 67 assertions executed NOWHERE. The index is
      # the case that matters most, because its failure is silent and gradual —
      # docs/INDEX.md is generated now, and `--check` is what turns "somebody
      # forgot to rebuild" into a red check instead of another 273 KB landing
      # page. The spelling suite guards the substitution that must never land in
      # a link target, a wikilink, a code span or a quotation (imported COCI /
      # MAP strings, and Sam's own words). Pure-stdlib python; same non-required
      # check.
      - name: Docs corpus — lint, index generator, spelling
        run: |
          python3 tests/docs_audit_test.py
          python3 tests/docs_index_build_test.py
          python3 tests/american_spelling_test.py
          python3 kb/_build_docs_index.py --check
      # Dependency map (Sam's ruling A, 2026-08-29) — the dataset→consumers
      # artifact every session's cross-impact flag depends on. `--check` turns
      # "somebody forgot to rebuild after adding a fetch()" into a red check
      # (same shape as the docs index above); the test guards the content —
      # each of its checks is a failure mode the build actually hit, verified
      # by perturbation against the live artifact. Pure-stdlib python; same
      # non-required check.
      - name: Dependency map — content guards + drift check
        run: |
          python3 tests/dependency_map_test.py
          python3 kb/_build_dependency_map.py --check
      # E gate guards (Session 210) — pins the skip/run boundary from both
      # sides, re-derives which test files read inert (docs-shaped) paths and
      # requires each to run in the skip branch above, and keeps the
      # forever-block shape (`paths-ignore` on a required check) out of this
      # file. Pure-stdlib python; always-on like every other lint here.
      - name: JS-suite gate lint (scripts/js_suite_gate.sh)
        run: python3 tests/js_suite_gate_test.py
      # Stop-hook unpushed check (Session 228) — the hook nagged "There are 1
      # unpushed commit(s)" at the end of nearly every remote session, on
      # branches holding nothing of ours, until sessions learned to ignore it.
      # A hook people ignore is worse than none, because the one time it is
      # right nobody looks. Guards BOTH directions against a vendor-shaped hook
      # (the copy that actually runs in the cloud): the false positive goes
      # quiet, and one real local commit still fires. ⚠️ It must NOT be tested
      # against scripts/stop-hook-git-check.sh — that copy's Session-32
      # ancestor guard masks the case, so such a test passes with or without
      # the fix. Pure-stdlib python, no network.
      - name: Stop-hook unpushed check (scripts/patch_stop_hook.py)
        run: python3 tests/stop_hook_git_check_test.py
