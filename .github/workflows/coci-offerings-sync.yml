name: COCI offerings sync (Sierra catalog)

# Builds the COCI *offerings* catalog (what each college TEACHES — course +
# program catalog + geography) from the committed COCI extracts and lands it into
# the public Supabase tables coci_college_offerings / coci_college_programs /
# college_geo, which the shared cpl-chat function (Sierra) queries.
#
# WHY A RUNNER: the write uses the Supabase SERVICE KEY (chunkable replace RPCs),
# and the 141k-row source is rebuilt on the runner — no 20 MB artifact committed.
# NO PII (public course/program catalogs) → a push trigger is fine (unlike the
# gated map-users sync). Rebuild + re-sync whenever the COCI extract refreshes.
#
# Triggers:
#   - push to MAIN (on the builder/source paths) → --apply (refresh the catalog)
#   - workflow_dispatch → --apply (on-demand, or to re-run after a failure)
#
# ⚠️ `branches: [main]` IS LOAD-BEARING (added 2026-09-17, S272). Without it the
# push trigger fired on EVERY branch, so a `claude/*` feature branch that touched
# the builder ran `--apply` against the live public catalog from unreviewed code
# — measured: run 10 rewrote all three tables off a feature-branch commit before
# the PR had a single check finish. The write is a truncate-and-replace of
# coci_college_offerings / coci_college_programs / college_geo, which Sierra
# reads, so an unreviewed builder change reaches students' answers directly.
# Feature branches now verify with the DRY RUN (no --apply) and let main publish.

on:
  push:
    branches: [main]
    paths:
      - 'chatbox/build_coci_offerings.py'
      - 'chatbox/sync_coci_offerings.py'
      - 'chatbox/_seed_college_geo.py'
      - 'chatbox/college_geo.json'
      - 'kb/reference/coci_course_list.xlsx'
      - 'tmc/source_data/coci_program_export_*.csv'
      - '.github/workflows/coci-offerings-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coci-offerings-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install --quiet openpyxl
      - name: Build offerings payload
        run: python3 chatbox/build_coci_offerings.py
      - name: Sync to Supabase (service key)
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 chatbox/sync_coci_offerings.py --apply
