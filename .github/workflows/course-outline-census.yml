name: Course outline census
# Where each college's course outlines of record open (Sam, 2026-10-12: "capture
# also the system link to the colleges' course outlines of record (CORs)", so the
# harvest can read course SLOs for skills matching and faculty assessment).
# kb/_course_outline_census.py reads pages only and writes no table; it files
# kb/course_outline_census/census_<run>.json (or, with probe=1 in .run, the
# per-system probe probe_<run>.json), which this job commits back to the branch
# that ran it. Runs when a claude/** push changes
# kb/course_outline_census/.run. A merge of main into a branch also carries that
# file's change, so a merge commit does not start it (S372: merging main into
# claude/s371-miramar-read re-ran the gallery's thumbnail job the same way).
on:
  push:
    branches: ['claude/**']
    paths:
      - 'kb/course_outline_census/.run'

permissions:
  contents: write

concurrency:
  group: course-outline-census-${{ github.ref }}
  cancel-in-progress: false

jobs:
  census:
    if: github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'Merge')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Playwright + Chromium
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Census
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CENSUS_DELAY_MS: '3000'
        run: |
          args=()
          limit=$(sed -n 's/^limit=//p' kb/course_outline_census/.run)
          only=$(sed -n 's/^only=//p' kb/course_outline_census/.run)
          probe=$(sed -n 's/^probe=//p' kb/course_outline_census/.run)
          [ "$probe" = "1" ] && args+=(--probe)
          [ -n "$limit" ] && args+=(--limit "$limit")
          [ -n "$only" ] && args+=(--only "$only")
          python3 kb/_course_outline_census.py "${args[@]}"

      - name: Commit the census to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kb/course_outline_census/
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Course outline census (run ${{ github.run_id }})"
          git push origin HEAD:${{ github.ref_name }}
