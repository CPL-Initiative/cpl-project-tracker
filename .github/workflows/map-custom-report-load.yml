name: MAP Custom Report load (staging)

# Loads the two MAP Custom Report views that have never been loaded into
# Supabase STAGING tables, and reports what arrived.
#
#   View_CollegeExhibitCRByCatalogYear_APIDataset  ->  stg_map_college_cr_unit
#   View_StudentDetailsCredits_APIDataset          ->  stg_map_student_credit
#
# It loads staging, then asks Postgres to PROMOTE staging to live through
# map_promote_custom_reports() — gated, in ONE transaction.
#
# Sam, 2026-08-19: "This will run in the daily cron so just making sure I don't
# have to do a staging to live approval every day."
#
# So there is no human between staging and live. What the human was providing
# is provided by the function instead, and every check fails closed:
#
#   * ONE TRANSACTION — live is fully old or fully new, never partial. Proven:
#     a client timeout mid-promotion left live byte-identical.
#   * CONTENTS are replaced, never the table, so the reviewer-only policy on
#     map_student_credit is never dropped and cannot be restored wrongly.
#   * G1..G6 refuse a truncated pull or a broken surrogate key; G7/G8 refuse to
#     publish a recoverable suppression. A raised gate rolls everything back.
#   * Both published aggregates rebuild in the same transaction, so the
#     published and unsuppressed halves of a figure can never disagree.
#
# Runs at 13:40 UTC — after the last dashboard cron window (12:17) and after
# credential-catalog-sync (13:20), so the three do not contend.

on:
  schedule:
    - cron: "40 13 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "apply (load + promote to live) · staging-only (load, do not promote) · dry-run (report only)"
        required: true
        default: "apply"
        type: choice
        options: [apply, staging-only, dry-run]

concurrency:
  group: map-custom-report-load
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Fetches all ten datasets rather than the two we want. That is
      # deliberate: fetch_custom_report.py IS the PII boundary — its
      # minimisation is the absence of entries — and the cheapest change to a
      # guarded file is none. ~91 MB on a runner costs nothing.
      - name: Fetch CustomReport from MAP API
        env:
          MAP_API_KEY: ${{ secrets.MAP_API_KEY }}
          MAP_API_AUTH_HEADER: ${{ secrets.MAP_API_AUTH_HEADER }}
          MAP_API_AUTH_SCHEME: ${{ secrets.MAP_API_AUTH_SCHEME }}
        run: python fetch_custom_report.py --output CustomReport_latest.json

      # Runs before the load so a contract break is caught on the runner rather
      # than discovered mid-insert.
      - name: Guard the mapping and the minimisation
        run: |
          python3 tests/custom_report_payload_test.py
          python3 tests/map_custom_report_sync_test.py

      - name: Load staging and promote
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'apply' }}"
          echo "mode: $MODE"
          case "$MODE" in
            dry-run)      python3 kb/_sync_map_custom_reports.py --dry-run ;;
            staging-only) python3 kb/_sync_map_custom_reports.py --no-promote ;;
            *)            python3 kb/_sync_map_custom_reports.py ;;
          esac

      # The raw pull carries student-grain rows and this repo is PUBLIC. It is
      # gitignored, but deleting it means a later step cannot accidentally
      # upload it as an artifact either.
      - name: Remove the raw pull
        if: always()
        run: rm -f CustomReport_latest.json CustomReport_*.json
