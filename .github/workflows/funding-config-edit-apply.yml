name: Funding config edit apply

# Manual dispatch only. Writes reviewed edits into the stored funding config (cpl_funding_config),
# from a committed plan (kb/funding_config_edits_out/<date>/plan.json): dry-run reads and reports
# each path's state, commit writes, rollback restores the before-values still unchanged. Sam
# allowed this workflow on 2026-09-29 (open-asks sheet 3, card 7). Curators edit this config on
# the Implementation Funding tab; a session writes it only where a reviewed plan names the exact
# paths, their before-values and who ruled. The repo's Supabase guard denies a session's UPDATE,
# so a session dispatches this, as it does course-title-cleanup-apply.yml.
#
# The applier refuses unless every path still holds its reviewed before-value, and its one PATCH
# is filtered on the updated_at its fresh read returned, so a curator's newer save always wins
# (Rule 10). Receipts land in the plan dir and are pushed to main.

on:
  workflow_dispatch:
    inputs:
      plan_dir:
        description: "Plan directory, e.g. kb/funding_config_edits_out/2026-09-29"
        required: true
        type: string
      mode:
        description: "dry-run reads and reports; commit writes; rollback restores from the receipts"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, commit, rollback]

concurrency:
  group: funding-config-edit
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run the applier
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PLAN_DIR: ${{ inputs.plan_dir }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "$PLAN_DIR" in
            kb/funding_config_edits_out/20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *) echo "::error::plan_dir must be kb/funding_config_edits_out/<YYYY-MM-DD>"; exit 1 ;;
          esac
          test -f "$PLAN_DIR/plan.json"
          case "$MODE" in
            dry-run)  python kb/_funding_config_edit_apply.py "$PLAN_DIR" | tee -a "$GITHUB_STEP_SUMMARY" ;;
            commit)   python kb/_funding_config_edit_apply.py "$PLAN_DIR" --commit | tee -a "$GITHUB_STEP_SUMMARY" ;;
            rollback) python kb/_funding_config_edit_apply.py "$PLAN_DIR" --rollback | tee -a "$GITHUB_STEP_SUMMARY" ;;
          esac

      # always(): a write refused at the PATCH still wrote a receipt, and a receipt that never
      # reaches main cannot roll anything back.
      - name: Commit the receipt
        if: ${{ always() && inputs.mode != 'dry-run' }}
        env:
          PLAN_DIR: ${{ inputs.plan_dir }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "$PLAN_DIR" in
            kb/funding_config_edits_out/20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *) echo "No receipt: plan_dir is not a plan directory."; exit 0 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$PLAN_DIR"
          if git diff --cached --quiet; then echo "No receipt to commit."; exit 0; fi
          git commit -m "Funding config edit ($MODE): receipt for $PLAN_DIR"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          exit 1
