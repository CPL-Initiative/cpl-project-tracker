# Manual schema-discovery probe for the MAP Custom Reporting Module.
#
# Why: a Claude session's container can't reach the MAP hosts (egress allowlist),
# but a GitHub Actions runner can. This one-click workflow runs the PII-safe probe
# (kb/_discover_map_datasets.py) on the runner and prints the NEW datasets' real
# viewName + columns + grain + a couple of redacted sample rows to the run log,
# which Claude reads back via the GitHub MCP. It commits NOTHING (the raw MAP pull
# is PII-bearing + gitignored) — only the schema goes to the log.
#
# Run it: Actions → "Discover MAP datasets (manual)" → Run workflow. Once the real
# viewName is confirmed from the log, the Exhibit CRs Catalog gets wired into the
# daily fetch (fetch_custom_report.py) + the CER eligible/students columns.
name: Discover MAP datasets (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # Sam, 2026-09-02: Pedro has added CPL lifecycle BOOLEAN checks to the
      # student Custom Reports and is adding CollegeID2 (origination college,
      # the noncredit-FTES key). The funding model's `pac` measure reads the
      # counselor step and the builder SWEEPS candidate spellings for it, so
      # this asks the API for the real column names and the wire rendering.
      # Enumerates with `columnName: []` (bounded reads), bisects the view that
      # 500s on that, then profiles the NEW columns PII-denylisted. Commits
      # nothing; prints no student identifier.
      - name: Probe the student views for the CPL lifecycle booleans + CollegeID2
        env:
          MAP_API_KEY: ${{ secrets.MAP_API_KEY }}
          MAP_API_AUTH_HEADER: ${{ secrets.MAP_API_AUTH_HEADER }}
          MAP_API_AUTH_SCHEME: ${{ secrets.MAP_API_AUTH_SCHEME }}
        run: python kb/_probe_lifecycle_checks.py

      # Sam, 2026-08-19: three new Custom Reports (exhibit CRs, the same BY
      # CATALOG YEAR, student details). Runs FIRST and alone-fast — it answers a
      # yes/no that decides a whole workstream (three lines in REQUEST_PAYLOAD vs
      # a real integration), and the two probes below pull ~268k rows and would
      # starve it. Read-bounded, PII-denylisted, commits nothing.
      - name: Probe for the three new Custom Reports (exhibit CRs / catalog year / student details)
        if: ${{ false }}   # names CONFIRMED 2026-08-19; kept for the next unknown view
        run: python kb/_probe_new_custom_reports.py

      # Runs FIRST and never blocks on the catalog probe below, which pulls
      # ~268k rows and can take minutes. This one answers a live question — does
      # the API expose the student × credit-recommendation grain (and with it
      # CPLStatusPlan, the action a college took) that none of the nine fetched
      # views carries? Allowlisted columns only; no student identifier.
      # Sam pasted the three real headers 2026-08-19, so the names are known.
      # This asks whether the API SERVES them — a builder header proves only that
      # the report exists in the builder, and the cron pulls the API.
      - name: Serve-check the three confirmed Custom Reports
        if: ${{ false }}   # answered 2026-08-19; the 13:40 UTC load serve-checks them nightly
        run: python kb/_probe_confirmed_custom_reports.py

      # Run 1 found all 51 candidates "not Valid" — but it had no positive
      # control, so that could equally mean the empty-columnName trick stopped
      # working. This asks a view the cron pulls daily the same question, and
      # chases the one candidate that answered 500 instead of 400.
      - name: Control the sweep and chase the 500
        if: ${{ false }}   # answered: the 500 WAS View_StudentDetailsCredits_APIDataset
        run: python kb/_probe_new_custom_reports_followup.py

      - name: Probe for the student-detail (disposition) view
        if: ${{ false }}   # answered 2026-08-07 (400, unpublished); re-enable to re-ask
        run: python kb/_probe_student_detail_view.py

      # Sam, 2026-08-14: does the catalog carry usable "required evidence" text
      # (his AWS D1.1 practical-test case), and is EvidenceDescription truncated?
      # Runs BEFORE the 268k-row grain probe so a slow catalog pull can't starve
      # it. Discovers the real column spelling rather than assuming one.
      - name: Probe the Exhibit CRs Catalog for required-evidence fields
        if: ${{ false }}   # answered 2026-08-14 (PR #1177 census); re-enable to re-ask
        run: python kb/_probe_exhibit_evidence_fields.py

      - name: Probe MAP Custom Reporting Module for the new dataset schemas
        if: ${{ false }}   # Exhibit CRs Catalog grain, wired 2026-06-09; re-enable to re-ask
        run: python kb/_discover_map_datasets.py
