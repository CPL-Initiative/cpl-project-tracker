name: CER procedures

# The Common Exhibit Reference's nightly procedures run (kb/_cer_procedures.py). Sam, 2026-10-18
# ~02:55Z: "I want to be able to add more procedures to have you classify and complete common
# exhibit titles and elements as we go." Lane: docs/reference/lanes/cer-procedures.md.
#
# The rule procedures in kb/cer_procedures.json settle what they can; the classifier (the
# cer-classify Edge Function, which holds the model key: Sam's call 6, sheet 23) is asked about
# up to `classify` of the titles left, each title once, and again only when the procedures change.
# The run writes three committed files: kb/unclassified_preseed.json (the tab's pre-fills),
# kb/cer_classified.json (the classifier's cache) and kb/cer_procedures_out/latest.json (the
# tallies and the Needs-you list).
#
# With save=on (the default since Sam's ruling of 2026-10-18, Open Asks Sheet 94 card 2) every
# pre-fill no reason holds is also written to kb_curation as the tab's Save would write it, under
# the cohort cer-procedure-<id>@bot of the procedure that decided it: a fresh read first (a live
# row holds the save), INSERT-only with duplicates ignored, a receipt in kb/cer_procedures_out/
# saved/ before the write. `python3 kb/_cer_procedures.py --undo <procedure>` takes a procedure's
# rows back. save=preview lists what would save and writes no row. Governance: DR-07.
#
# Scheduled after the daily dashboard's primary cron (06:17), which refreshes the queue it reads.
# Its own concurrency group, kept apart from daily-dashboard on purpose (the S641 conductor): GitHub
# cancels an older pending run in a group without an alert, so a wider group would let this run and
# the daily build or an apply cancel each other. Its files and the daily's overlap: the daily commits
# kb/exhibits_adoption.json, exhibits_review.json, exhibits_related.json and kb/status/commons.json
# too (COBIx #3110 finding 7), so a push here can meet a conflict; the 07:47 cron sits clear of the
# daily ladder (06:17, 09:17, 12:17).

on:
  schedule:
    - cron: '47 7 * * *'
  workflow_dispatch:
    inputs:
      classify:
        description: "Titles the classifier may be asked about this run (0 = the rule procedures only)"
        required: true
        default: "400"
        type: string
      save:
        description: "on saves every pre-fill no reason holds under its procedure; preview lists them and writes no row; off neither"
        required: true
        default: "on"
        type: choice
        # Quoted: YAML reads a bare on and off as booleans, so a dispatch offered only
        # true, preview and false and refused save=on (S417, 2026-10-18); the nightly
        # run never noticed because the schedule takes the default.
        options: ["on", "preview", "off"]
      subject_fill:
        description: "The exhibit subject fill (kb/_exhibit_subject_fill.py): on writes every credential's missing Common SUBJ under exhibit-subject-s638@bot; preview (the nightly default) lists them against a fresh read and writes no row; off plans from the committed files alone"
        required: true
        default: "preview"
        type: choice
        options: ["on", "preview", "off"]

concurrency:
  group: cer-procedures-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # The college's own course title for a code-only exhibit comes from the COCI
      # course list (kb/reference/coci_course_list.xlsx); openpyxl reads it.
      - name: Install the catalog reader
        run: pip install "$(grep -i '^openpyxl==' requirements.txt)"

      - name: Run the procedures
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CLASSIFY: ${{ inputs.classify || '400' }}
          SAVE: ${{ inputs.save || 'on' }}
        run: |
          set -euo pipefail
          case "$CLASSIFY" in ''|*[!0-9]*) echo "classify must be a whole number"; exit 1;; esac
          case "$SAVE" in on|preview) SAVE_FLAG="--save $SAVE";; off) SAVE_FLAG="";; *) echo "save must be on, preview or off"; exit 1;; esac
          # shellcheck disable=SC2086
          python3 kb/_cer_procedures.py --classify "$CLASSIFY" $SAVE_FLAG | tee cer_procedures.log
          {
            echo "### CER procedures — $(date -u +%Y-%m-%d)"
            echo '```'
            cat cer_procedures.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The exhibit subject fill (Sam, in session 2026-11-11: "add a check into that in our common plan and
      # procedure so we can get those fill as automatically as possible"). A credential with no Common SUBJ takes
      # its credited courses' subject (several colleges, then one), else its issuer family's; a person's subject
      # always wins. Preview by default: a dispatch with subject_fill=on writes. Receipt before the INSERT under
      # kb/exhibit_subject_out/saved/; `python3 kb/_exhibit_subject_fill.py --undo` takes the cohort back. The
      # remainder lands in kb/exhibit_subject_out/worklist.json, which the Commons status (below) counts.
      # continue-on-error: a refused read or write must not stop the Exhibits and Commons rebuilds below.
      - name: Fill the exhibits' missing Common SUBJ
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUBJECT_FILL: ${{ inputs.subject_fill || 'preview' }}
        run: |
          set -euo pipefail
          case "$SUBJECT_FILL" in on|preview) FILL_FLAG="--save $SUBJECT_FILL";; off) FILL_FLAG="";; *) echo "subject_fill must be on, preview or off"; exit 1;; esac
          # shellcheck disable=SC2086
          python3 kb/_exhibit_subject_fill.py $FILL_FLAG | tee exhibit_subject_fill.log
          {
            echo "### Exhibit subject fill — $(date -u +%Y-%m-%d)"
            echo '```'
            cat exhibit_subject_fill.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The Exhibits tab's Review queue reads this run's held titles (kb/_build_exhibits_review.py).
      - name: Build the Exhibits review queue
        run: python3 kb/_build_exhibits_review.py --quiet || echo "::warning title=Exhibits review not rebuilt::kb/_build_exhibits_review.py failed; the Exhibits tab reads the previous file until the next run."

      # Another look (Sam, 2026-10-31) leaves a title this run holds to Review, so it rebuilds after it.
      - name: Build the Exhibits tab's Another look
        run: python3 kb/_sweep_exhibit_titles.py --quiet || echo "::warning title=Another look not rebuilt::kb/_sweep_exhibit_titles.py failed; the Exhibits tab reads the previous file until the next run."

      # The Review card's Related titles panel and the rename batch (Sam, 2026-11-11) read the reference, the
      # titles saved and held tonight, and Another look's open cards, so they rebuild after all three.
      - name: Build the Exhibits tab's related titles and rename batch
        run: python3 kb/_build_exhibits_related.py --quiet || echo "::warning title=Related titles not rebuilt::kb/_build_exhibits_related.py failed; the Exhibits tab reads the previous file until the next run."

      # The Exhibits tiles and the Commons' Exhibit row read the held titles and conflicts from this run's latest.json
      # (#2665's note, S544): rebuilt only by the daily run, the tile said 351 held while Review said 1 until the next
      # morning. Rebuilt here too, after the files it reads, so both pages agree with Review the same night.
      - name: Build the Commons status
        run: python3 kb/_build_commons_status.py --quiet || echo "::warning title=Commons status not rebuilt::kb/_build_commons_status.py failed; the Commons tab and the Exhibits tiles read the previous file until the next run."

      # always(): a save refused at the INSERT still wrote its receipt, and a receipt that never
      # reaches main cannot undo anything.
      - name: Commit the run
        if: ${{ always() }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kb/unclassified_preseed.json kb/cer_procedures_out/latest.json
          git add kb/cer_classified.json 2>/dev/null || true
          git add kb/cer_procedures_out/saved 2>/dev/null || true
          git add kb/exhibits_review.json kb/exhibits_review_courses.json kb/exhibits_adoption.json 2>/dev/null || true
          git add kb/exhibits_sweep.json 2>/dev/null || true
          git add kb/exhibits_related.json 2>/dev/null || true
          git add kb/status/commons.json 2>/dev/null || true
          git add kb/status/commons_history.json 2>/dev/null || true
          git add kb/exhibit_subject_out 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "CER procedures run (run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
            git checkout -- . && git pull --rebase origin "${{ github.ref_name }}"
          done
          echo "Push failed after 5 attempts."
          exit 1
