name: Second reader (program requirements)
# A second model reads each of one college's harvest records that fails a machine
# check, through the program-requirements-extract Edge Function with provider
# "xai" (version 11), and the scorer scores both readings. Nothing is written to a
# table and nothing is committed: kb/_second_reader.py files the comparison, and
# this run uploads it as the second-reader artifact for a person to read.
#
# WHY: Sam's Open Asks Sheet 97 ruling (2026-10-19 03:11Z, card 1, his own call):
# Build with Grok. Agreement between two readings of one page is evidence;
# disagreement is a known issue carrying both readings.
#
# THE KEY IS THE FUNCTION'S: the xAI key is an Edge Function secret (XAI_API_KEY,
# with XAI_MODEL), per Sam's call 6 on sheet 23 (no model key in GitHub). This
# runner presents the service key the extract step always has; until the function
# secret exists, every call answers "XAI_API_KEY not set" and the file says so.
#
# WHY DISPATCH-ONLY: every run spends real model calls, and the capture reads a
# college's catalog pages (CENSUS_DELAY_MS between pages, as the harvest does).
on:
  workflow_dispatch:
    inputs:
      college:
        description: 'The college, as program_source_registry names it (e.g. Cañada College)'
        type: string
        required: true
      limit:
        description: 'Cap the sitting to the first N failing records (blank = all)'
        type: string
        default: ''
      model:
        description: 'The second reader model id (blank = the function''s XAI_MODEL)'
        type: string
        default: ''
      rate_per_record:
        description: 'Dollars a record costs to read, for the price and the hard stop (required with a model the price table does not name; blank = the default rate)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: second-reader
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright + Chromium, pypdf, pdfminer (the capture's readers)
        run: |
          pip install --quiet playwright pypdf pdfminer.six
          bash scripts/install_browser.sh
      - name: Pin a hand-filed copy's hash (a no-op without a record)
        env:
          COLLEGE: ${{ inputs.college }}
        run: python3 kb/_program_requirements_college.py pin --college "$COLLEGE"
      - name: Capture the college (free; the page text and closed list the first reader saw)
        env:
          CENSUS_DELAY_MS: '4000'
          COLLEGE: ${{ inputs.college }}
        run: python3 kb/_program_requirements_college.py capture --college "$COLLEGE" --out out --limit 0
      # Every paid read is priced before any call ($40 a run on the estimate, Sam's standing go; S653): over
      # the limit, nothing is sent. Free, and it needs no key. tests/program_requirements_extraction_gate_test.py
      # fails a workflow whose paid call can run without its price step's go or its hard stop.
      # The price uses the default rate per record (Opus's rates), an upper estimate for the function's configured
      # xAI model; a model the price table does not name is refused unless the dispatch gives rate_per_record, and
      # the step prints the rate it used. A re-run attempt that would send records is refused (it pays again), and
      # a refusal ends the job red. Dispatch inputs reach the shell through env:, never the run text.
      - name: Price the second reading ($40 a run, Sam's standing go)
        id: price
        env:
          COLLEGE: ${{ inputs.college }}
          LIMIT: ${{ inputs.limit }}
          MODEL: ${{ inputs.model }}
          RATE: ${{ inputs.rate_per_record }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 kb/_second_reader.py --college "$COLLEGE" --capture out --price --limit-usd 40 \
            --model "$MODEL" --rate-per-record "$RATE" --attempt "$ATTEMPT" ${LIMIT:+--limit "$LIMIT"}
      - name: The second reader over the failing records (suggests, writes nothing)
        if: steps.price.outputs.go == 'true'
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          COLLEGE: ${{ inputs.college }}
          LIMIT: ${{ inputs.limit }}
          MODEL: ${{ inputs.model }}
          RATE: ${{ inputs.rate_per_record }}
          # The hard stop (kb/_spend_meter.py): no record is sent when the run's charges, the reservations in
          # flight and the next record's estimate would pass $40. A call costs at most $1.12 (the largest
          # committed request) against a $0.10 estimate, so with four workers the run can pass $40 by at most
          # $4.10, and $1.02 more for each further part of a read in parts in flight. A run the stop held ends red.
          CEILING: '40'
        run: |
          python3 kb/_second_reader.py --college "$COLLEGE" --capture out --ceiling-usd "$CEILING" \
            --model "$MODEL" --rate-per-record "$RATE" ${LIMIT:+--limit "$LIMIT"}
      - name: Upload the comparison
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: second-reader
          path: kb/second_reader_out/
