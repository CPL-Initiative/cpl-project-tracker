name: Probe CPL Stories page
# Runner-as-proxy probe: the agent sandbox can't reach map.rccd.edu, and a plain
# curl gets a SiteGround CAPTCHA challenge. Real Chromium (Playwright) passes the
# JS challenge — load the page + dump the rendered structure to the log so we can
# write the real extractor. Throwaway; deleted once the builder lands.
on:
  push:
    branches: [claude/factsheet-cpl-stories]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.47.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Probe (headless Chromium)
        run: node tools/probe_cpl_stories.mjs
