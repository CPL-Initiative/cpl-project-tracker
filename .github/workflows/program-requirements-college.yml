name: Program requirements, one college

# Phase 2 of the program requirements harvest
# (docs/reference/lanes/program-requirements-harvest.md): every active program
# at one college. Sam, 2026-10-09 (S353, as proposed): Cerritos first, by the
# method that passed the pilot, records unchecked until read. Two jobs, and a
# run does one of them; nothing passes between runners.
#
# read, three steps:
#   capture  kb/_program_requirements_college.py lists the catalog's program
#            pages once (sitemap.xml, robots first, 4 s between loads, the
#            census user agent that names the CPL Initiative: Sam's call 5 on
#            sheet 23) and gives each program the page naming its listed
#            courses. Anon reads only. Free in model calls, but about 360 page
#            loads at a college, so a push reads only when its message starts
#            with [read] (capture alone) or [extract].
#   extract  posts each source to the program-requirements-extract Edge Function
#            (Sam's call 6: the function holds the Anthropic key), six calls at
#            a time, and scores each record. It SPENDS MODEL CALLS (about $0.06
#            a program), so it runs on a dispatch or when the pushed commit's
#            message starts with [extract], never on a schedule. A record filed
#            from the same page is kept, so a re-run pays only for what moved.
#   file     commits the run's account, and the records when there are any, to
#            the branch that ran the workflow (kb/program_requirements_college/
#            <slug>/), so no session reads a job log. The page text stays in the
#            run's artifact for 90 days.
#
# load (a dispatch with step=load, or a push whose message starts with [load]):
#   posts the records COMMITTED on the branch to
#   program_requirement_records_college_load() with the service key, a batch at
#   a time. The function inserts each record unchecked and never touches a row
#   already there; the job commits the receipt that names every key it inserted
#   (kb/receipts/program_requirement_records_college_<slug>_<run>.json), which
#   is how the load rolls back. kb/governance_surface_map.json dismisses this
#   workflow with its reason (public catalog data).
#
# display (a dispatch with step=display, never a push): applies the receipt of
#   the display build cpl_pathways_roep_data.js carries
#   (kb/_program_requirements_display_apply.py), one PATCH of display a program,
#   with the service key. A checked program's display changes only on Sam's go,
#   so a dispatch is that go carried out. It reads each row's build first and
#   commits the applied record beside the receipt, which is the rollback. Until
#   S356 a session pushed each receipt through apply_migration; a college's is
#   megabytes.

on:
  workflow_dispatch:
    inputs:
      college:
        description: "The college, as program_source_registry names it"
        required: false
        default: "Cerritos College"
      extract:
        description: "1 = also extract (spends model calls)"
        required: false
        default: "1"
      limit:
        description: "The first N programs only (0 = all)"
        required: false
        default: "0"
      step:
        description: "read (capture, extract, file), load (the committed records, unchecked) or display (the page's display build)"
        required: false
        default: "read"
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/program-requirements-college.yml'
      - 'kb/_program_requirements_college.py'

concurrency:
  group: program-requirements-college-${{ github.ref }}
  cancel-in-progress: false

jobs:
  read:
    # The filing commit (github-actions[bot]) never runs the workflow again.
    if: >-
      github.actor != 'github-actions[bot]' && (
      (github.event_name == 'workflow_dispatch' && github.event.inputs.step != 'load' && github.event.inputs.step != 'display') ||
      (github.event_name == 'push' && (startsWith(github.event.head_commit.message, '[read]') ||
                                       startsWith(github.event.head_commit.message, '[extract]'))))
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      COLLEGE: ${{ github.event.inputs.college || 'Cerritos College' }}
      LIMIT: ${{ github.event.inputs.limit || '0' }}
      # A push extracts only when its message STARTS with [extract]: the first
      # run's commit merely described the marker, and contains() spent $15.80.
      EXTRACT: ${{ github.event.inputs.extract == '1' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[extract]')) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright + Chromium, pypdf, pdfminer
        run: |
          pip install --quiet playwright pypdf pdfminer.six
          python -m playwright install --with-deps chromium
      - name: Capture
        env:
          CENSUS_DELAY_MS: '4000'
        run: python3 kb/_program_requirements_college.py capture --college "$COLLEGE" --out out --limit "$LIMIT"
      - name: Extract and score
        if: env.EXTRACT == 'true'
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 kb/_program_requirements_college.py extract --college "$COLLEGE" --out out --workers 6
      - name: File the run
        run: python3 kb/_program_requirements_college.py file --college "$COLLEGE" --out out
      - name: Commit to the branch that ran it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kb/program_requirements_college
          if git diff --cached --quiet; then echo "nothing to file"; exit 0; fi
          git commit -m "File the program requirements read of $COLLEGE (run ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5)); git pull --rebase origin "${{ github.ref_name }}"
          done
          exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: program-requirements-${{ github.run_id }}
          path: out
          retention-days: 90

  load:
    if: >-
      github.actor != 'github-actions[bot]' && (
      (github.event_name == 'workflow_dispatch' && github.event.inputs.step == 'load') ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[load]')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      COLLEGE: ${{ github.event.inputs.college || 'Cerritos College' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Load the committed records, unchecked
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 kb/_program_requirements_college.py load --college "$COLLEGE"
      - name: Commit the receipt to the branch that ran it
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kb/receipts
          if git diff --cached --quiet; then echo "no receipt"; exit 0; fi
          git commit -m "Receipt: the load of $COLLEGE's program records (run ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5)); git pull --rebase origin "${{ github.ref_name }}"
          done
          exit 1

  display:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event_name == 'workflow_dispatch' && github.event.inputs.step == 'display'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply the display build the page carries
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 kb/_program_requirements_display_apply.py --apply
      - name: Commit the applied record to the branch that ran it
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kb/receipts
          if git diff --cached --quiet; then echo "no applied record"; exit 0; fi
          git commit -m "Applied record: the page's display build (run ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5)); git pull --rebase origin "${{ github.ref_name }}"
          done
          exit 1
