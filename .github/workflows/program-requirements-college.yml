name: Program requirements, one college

# Phase 2 of the program requirements harvest
# (docs/reference/lanes/program-requirements-harvest.md): every active program
# at one college. Sam, 2026-10-09 (S353, as proposed): Cerritos first, by the
# method that passed the pilot, records unchecked until read. One job, three
# steps, so nothing passes between runners:
#
#   capture  kb/_program_requirements_college.py lists the catalog's program
#            pages once (sitemap.xml, robots first, 4 s between loads, the
#            census user agent that names the CPL Initiative: Sam's call 5 on
#            sheet 23) and gives each program the page naming its listed
#            courses. Anon reads only. Free, so a push runs it.
#   extract  posts each source to the program-requirements-extract Edge Function
#            (Sam's call 6: the function holds the Anthropic key), six calls at
#            a time, and scores each record. It SPENDS MODEL CALLS (about $0.06
#            a program), so it runs on a dispatch or when the pushed commit's
#            message says [extract], never on a schedule.
#   file     commits the run's account, and the records when there are any, to
#            the branch that ran the workflow (kb/program_requirements_college/
#            <slug>/), so no session reads a job log. The page text stays in the
#            run's artifact for 90 days.

on:
  workflow_dispatch:
    inputs:
      college:
        description: "The college, as program_source_registry names it"
        required: false
        default: "Cerritos College"
      extract:
        description: "1 = also extract (spends model calls)"
        required: false
        default: "1"
      limit:
        description: "The first N programs only (0 = all)"
        required: false
        default: "0"
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/program-requirements-college.yml'
      - 'kb/_program_requirements_college.py'

concurrency:
  group: program-requirements-college-${{ github.ref }}
  cancel-in-progress: false

jobs:
  read:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      COLLEGE: ${{ github.event.inputs.college || 'Cerritos College' }}
      LIMIT: ${{ github.event.inputs.limit || '0' }}
      EXTRACT: ${{ github.event.inputs.extract == '1' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[extract]')) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright + Chromium, pypdf, pdfminer
        run: |
          pip install --quiet playwright pypdf pdfminer.six
          python -m playwright install --with-deps chromium
      - name: Capture
        env:
          CENSUS_DELAY_MS: '4000'
        run: python3 kb/_program_requirements_college.py capture --college "$COLLEGE" --out out --limit "$LIMIT"
      - name: Extract and score
        if: env.EXTRACT == 'true'
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 kb/_program_requirements_college.py extract --out out --workers 6
      - name: File the run
        run: python3 kb/_program_requirements_college.py file --college "$COLLEGE" --out out
      - name: Commit to the branch that ran it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kb/program_requirements_college
          if git diff --cached --quiet; then echo "nothing to file"; exit 0; fi
          git commit -m "File the program requirements read of $COLLEGE (run ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5)); git pull --rebase origin "${{ github.ref_name }}"
          done
          exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: program-requirements-${{ github.run_id }}
          path: out
          retention-days: 90
