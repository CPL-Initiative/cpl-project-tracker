name: Cred-Ref PR-5b/1 — Credential Rename Apply

# Manual-dispatch only. Applies the credential-title renames queued in
# kb/credential_review_overlay.json to the three source-of-truth files
# (credentials.json, unified_titles.json, coci_articulations.json) +
# migrates the matching Supabase kb_curation rows.
#
# Sequence:
#   1. Fresh-sync the credential-review overlay from Supabase (catches
#      curator edits since the last daily cron's sync).
#   2. Re-run dry-run on the fresh overlay (refreshes alias_map.json
#      against current credentials.json state — catches drift since the
#      last cron's dry-run).
#   3. Apply JSON renames via kb/_cred_rename_apply.py. Refuses to run
#      if dry-run reported apply_safe=false; V4 gate (articulation count
#      before/after) baked into the script.
#   4. Apply Supabase row migration via kb/_cred_rename_apply_supabase.py.
#      DELETEs fulfilled unified_title_override rows; PATCHes other
#      override rows' course_id to the new identity.
#   5. Commit + push the mutated kb files + frozen alias_map snapshot.
#   6. The dashboard job starts daily-dashboard.yml on main once a job pushed (#3110: the files lagged 98 minutes).
#
# Re-point (#3110, COBIx comments 6813000047 and 6813256997): step 3 also moves each saved value a bot saved on an
# old title (kb/_cred_rename_repoint.py: cer_classified.json, the occupation map, MAP's by_title) and holds a
# person's, or one naming no saver, for a ruling. A saved assignment moves through its kb_curation title row in step
# 4.1, and step 4.2 re-reads kb/unclassified_assignments.json from kb_curation, so the copy and the rows agree. After
# the writes, step 4c counts every old title left in kb/**/*.json into the receipt (old_titles_left.json); a count
# above 0 fails the job's last step, after the receipt is committed. The count never rolls anything back. The
# repoint_only input runs the re-point alone for an applied receipt (the repoint job below).
#
# One pass (#3110 build step 1): a lead that creates a title and the siblings
# whose merge into it is already confirmed apply in the same run; a second
# dispatch is no longer needed. Each fold group's issuer follows
# kb/fold_issuer.py's four rules in the kb files, and is stored in kb_curation
# as ONE issuer_resolution row per folded target (step 3b), never by updating
# or deleting a person's issuer row; the nightly sync enforces it. The receipt
# kb/cred_rename_out/<date>/ holds undo.json; kb/_cred_rename_undo.py reverses
# an apply from it.
#
# statewide_data.js is NOT rebuilt here (the MAP link verify file's by_title is re-keyed by step 3's re-point).
# statewide_data.js is written by the full excel_to_dashboard.py run, which
# also regenerates the dashboard HTML (Rule 1) and reads the master workbook
# and live Supabase; daily-dashboard.yml owns that run, and a second writer of
# those artifacts is what the artifact policy and Rule 6 rule out. After an
# apply, the dashboard job dispatches daily-dashboard.yml once the apply job released
# the group; its gate job runs every workflow_dispatch (only a scheduled run stands down).
#
# workflow_dispatch stays the only trigger: no schedule, no automatic start.
#
# Going light vs Phase 1e: this workflow has 5 steps, not 7 — no
# post-apply re-dry-run (V4 in-apply already validates), no auditor
# cleanup-receipt re-run (no rename-outcome invariant exists). Trust the
# in-script V1–V4 gates.
#
# concurrency: daily-dashboard (on the apply and repoint jobs)  →  serializes against the daily cron so
# excel_to_dashboard.py never reads the three kb files mid-mutation.

on:
  workflow_dispatch:
    inputs:
      only_plan:
        description: "Apply only this ruled plan's renames and merges (a plan_id under kb/cred_rename_plans/, e.g. sheet181-2026-11-12); empty applies every planned rename"
        required: false
        default: ""
        type: string
      repoint_only:
        description: "Re-point only, for an applied receipt folder under kb/cred_rename_out/ (e.g. kb/cred_rename_out/2026-11-12): the saved files and the kb_curation rows its plan left on old titles. Never runs the rename. Empty runs the apply."
        required: false
        default: ""
        type: string

# The two jobs that write take the daily-dashboard group, job by job, so the dashboard job below starts after it is
# free. A group name is one key in the repository whether a workflow or a job holds it.
jobs:
  apply:
    if: inputs.repoint_only == ''
    runs-on: ubuntu-latest
    concurrency:
      group: daily-dashboard
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
      receipt: ${{ steps.json.outputs.receipt }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # ── Step 1: fresh-sync overlay from Supabase ──────────────────
      - name: Fresh-sync credential-review overlay
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "${SUPABASE_SERVICE_KEY:-}" ]; then
            echo "::error::SUPABASE_SERVICE_KEY not set — required for apply"
            exit 1
          fi
          python kb/_apply_credential_review.py

      # ── Step 2: re-run dry-run (refreshes alias_map vs current state) ─
      - name: Re-run dry-run + verify apply_safe
        env:
          ONLY_PLAN: ${{ inputs.only_plan }}
        run: |
          if [ -n "${ONLY_PLAN:-}" ] && [ -z "$(printf '%s' "$ONLY_PLAN" | tr -d '[:space:]')" ]; then
            echo "::error::only_plan is blank; name a plan_id, or leave it empty to apply every planned rename"
            exit 1
          fi
          if [ -n "${ONLY_PLAN:-}" ]; then
            python kb/_cred_rename_dryrun.py --only-plan "$ONLY_PLAN"
          else
            python kb/_cred_rename_dryrun.py
          fi
          python3 << 'EOF'
          import json, sys
          with open('kb/cred_rename_dryrun/alias_map.json') as f:
              doc = json.load(f)
          summary = doc.get('summary') or {}
          if not summary.get('apply_safe'):
              print(f"::error::Dry-run reports apply_safe=false. "
                    f"v1={summary.get('v1_intra_batch_collisions_pass')} "
                    f"v2={summary.get('v2_source_exists_pass')} "
                    f"v3={summary.get('v3_target_collision_free_pass')} "
                    f"collisions={summary.get('collisions')}")
              sys.exit(1)
          n = len(doc.get('renames') or {}) + len(doc.get('merges') or {})
          if n == 0:
              print("::warning::Dry-run produced 0 renames/merges — apply is a no-op")
          for t, p in sorted((doc.get('issuer_preview') or {}).items()):
              if p.get('conflict'):
                  print(f"::notice title=Issuer conflict::{t}: the target's override "
                        f"{p['conflict']['target_override_before']['issuer']} becomes {p['winner']}")
              for e in p.get('exceptions') or []:
                  print(f"::warning title=Issuer exception for a person::{t}: {e['ic_exhibits']} "
                        f"industry-certification exhibit(s), issuer {e['issuer']} (does not block)")
          print(f"apply gate OK — {len(doc.get('renames') or {})} renames "
                f"+ {len(doc.get('merges') or {})} confirmed merges to apply")
          EOF

      # ── Step 3: apply JSON file mutations ─────────────────────────
      - name: Apply credential renames to kb files
        id: json
        run: python kb/_cred_rename_apply.py

      # ── Step 3b: the fold's issuer resolutions ────────────────────
      # One issuer_resolution row per folded target (kb/fold_issuer.py,
      # cohort cred-fold-s638@bot), written BEFORE the row moves and before
      # anything commits. No issuer row a person wrote is updated or deleted;
      # every reader and the nightly resolve and enforce these rows, and only
      # once the fold's receipt is on main (fold_issuer.applied_fold_ids): a
      # row from an apply that never landed is inert. A failure here fails the
      # job: the moves and the commit do not run, and the failure step at the
      # end takes the written rows back and commits the receipt alone.
      # Idempotent: a retry finds its own rows and writes nothing.
      - name: Write the fold's issuer resolutions to kb_curation
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python kb/_cred_fold_resolution_write.py

      # ── Step 4: apply Supabase row migration ──────────────────────
      # Moves each folded title's kb_curation rows onto its new title, as
      # before the redesign. The kb files are final once step 3 lands and the
      # resolutions are written, so they still commit when this step fails, but
      # the job then FAILS (the last step below) until someone re-runs
      # kb/_cred_rename_apply_supabase.py. A retry writes supabase_log-<UTC>.json
      # beside the first log; the undo reads them all.
      - name: Apply Supabase kb_curation row migration
        id: supa
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python kb/_cred_rename_apply_supabase.py

      # ── Step 4.1: move the re-pointed assignments' kb_curation rows ─
      # kb/unclassified_assignments.json is a copy of kb_curation's _UNCLASSIFIED:: rows, and the nightly
      # kb/_apply_unclassified_triage.py rewrites it from them: a re-point there lasts only once the row moves too.
      # One guarded PATCH of the value per bot row (value, reviewer and save time as a fresh read found them), filed
      # from a fresh read into repoint_supabase_log*.json; a person's row is never written. The undo reverses it.
      - name: Move the re-pointed assignments' kb_curation rows
        id: repoint_supa
        if: steps.json.outputs.receipt != ''
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RECEIPT: ${{ steps.json.outputs.receipt }}
        run: python kb/_cred_rename_repoint.py --supabase "$RECEIPT"

      # ── Step 4.2: re-read the credential-panel overlay after the row moves ─
      # Step 1's copy predates the moves; the count below reads what kb_curation holds now.
      # The saved assignments' copy is re-read the same way, so it names what the rows name after step 4.1
      # (kb/unclassified_assignments.json is never written by the re-point itself).
      - name: Re-sync the credential-review overlay after the row moves
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python kb/_apply_credential_review.py
          python kb/_apply_unclassified_triage.py

      # ── Step 4b: rebuild what reads the credential keys ───────────
      # The 2026-10-01 apply rewrote credentials.json and left three derived
      # files stale, so the lints job's freshness checks failed on main and on
      # every PR until a session rebuilt them (S313). Both builders are
      # standard-library Python over committed files.
      # continue-on-error: a crash here must not keep the kb files and the
      # receipt off main while kb_curation already holds the moves; the job
      # still fails at the end.
      - name: Rebuild the files derived from the credential keys
        id: rebuild
        continue-on-error: true
        run: |
          python3 kb/_build_remint_blast_radius.py
          python3 kb/_build_ccr_cpl.py
          python3 kb/_build_exhibits_related.py --quiet

      # ── Step 4c: count the old titles left under kb/ ──────────────
      # Every old title of this apply still under kb/ as an exact JSON key or value, outside the receipt and history
      # folders and alias lists named in kb/_cred_rename_repoint.py. Written into the receipt; the last step fails
      # the job on a count above 0, after the commit. continue-on-error: a crash here leaves the file missing, which
      # the last step also reports.
      - name: Count the old titles left under kb/
        if: steps.json.outputs.receipt != ''
        continue-on-error: true
        env:
          RECEIPT: ${{ steps.json.outputs.receipt }}
        run: python3 kb/_cred_rename_repoint.py --count "$RECEIPT"

      # ── Step 5: commit + push ─────────────────────────────────────
      - name: Commit + push
        id: commit
        env:
          SUPA_OUTCOME: ${{ steps.supa.outcome }}
        run: |
          set -euo pipefail
          if [ "$SUPA_OUTCOME" = "success" ]; then
            SUPA_LINE="Supabase kb_curation rows migrated in same window — log: kb/cred_rename_out/<date>/supabase_log*.json. unified_title_override rows DELETEd (fulfilled); other override rows PATCHed to new course_id. Issuer resolutions: kb/cred_rename_out/<date>/resolution_log*.json."
          else
            SUPA_LINE="Supabase kb_curation row moves FAILED or partial (outcome: $SUPA_OUTCOME); the kb files and kb_curation may disagree. Re-run kb/_cred_rename_apply_supabase.py and read kb/cred_rename_out/<date>/supabase_log*.json."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kb/credentials.json \
                  kb/unified_titles.json \
                  kb/coci_articulations.json \
                  kb/credential_review_overlay.json \
                  kb/unclassified_assignments.json \
                  kb/cer_classified.json \
                  kb/occupation_credential_map.json \
                  kb/reference/map_cpl_opportunities_verified.json \
                  kb/exhibits_related.json \
                  kb/cred_rename_dryrun/ \
                  kb/cred_rename_out/ \
                  kb/remint_blast_worklist.json \
                  prototype/ccr_remint_blast.json \
                  prototype/ccr_cpl.json
          if git diff --cached --quiet; then
            echo "No changes to commit (apply was a no-op or re-ran on already-applied state)."
            exit 0
          fi
          git commit \
            -m "Cred-Ref PR-5b/1: credential rename APPLY (Mode B)" \
            -m "Atomic re-key of unified credentials per kb/credential_review_overlay.json. Alias map (rollback basis): kb/cred_rename_out/<date>/alias_map.json." \
            -m "Mutated kb files: credentials.json (key rewrite), unified_titles.json (value rewrite), coci_articulations.json (value rewrite). Raw college-authored titles in unified_titles.json dict KEYS stay immutable per the supersede-don't-mutate ADR." \
            -m "Validated (in-apply gates): V1 dry-run reported apply_safe=true; V3 no drift collisions at apply time; V4 articulation cardinality preserved (rename, not delete)." \
            -m "$SUPA_LINE"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt $attempt failed — rebasing and retrying."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          exit 1

      # Fail closed: the job never reads success while the row moves failed.
      - name: Fail when the kb_curation row moves did not finish
        if: steps.supa.outcome == 'failure'
        run: |
          echo "::error::The kb_curation row moves failed; the folded titles keep rows under their old keys until the retry. Read kb/cred_rename_out/<date>/supabase_log*.json and re-run kb/_cred_rename_apply_supabase.py."
          exit 1

      - name: Fail when the re-pointed assignments' kb_curation rows did not move
        if: steps.repoint_supa.outcome == 'failure'
        run: |
          echo "::error::A re-pointed assignment's kb_curation row did not move; the nightly sync would put the old title back in kb/unclassified_assignments.json. Read repoint_supabase_log*.json in the receipt and re-run kb/_cred_rename_repoint.py --supabase <receipt>."
          exit 1

      - name: Fail when the derived files were not rebuilt
        if: steps.rebuild.outcome == 'failure'
        run: |
          echo "::error::kb/_build_remint_blast_radius.py or kb/_build_ccr_cpl.py failed; the kb files committed. Rebuild them in a PR."
          exit 1

      # The apply did not land on main (step 3b failed, or the commit or push
      # did): take back this run's issuer_resolution rows (guarded on the
      # cohort and the value written), mark the receipt apply_failed.json so
      # no reader enforces any row left, and commit the receipt ALONE, so the
      # undo can read its resolution and row-move logs. Never runs once the
      # kb files are on main.
      - name: Take back the resolutions and commit the receipt when the apply did not land
        if: failure() && steps.json.outputs.receipt != '' && steps.commit.outcome != 'success'
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RECEIPT: ${{ steps.json.outputs.receipt }}
        run: |
          set -uo pipefail
          python kb/_cred_fold_resolution_write.py --rollback "$RECEIPT" \
            || echo "::error::The rollback did not finish; ${RECEIPT}/apply_failed.json still keeps its rows inert. Read resolution_rollback_log.json."
          # Step 4.1's row moves go back too: each guarded on the row the move left, read back, filed in
          # repoint_rollback_log*.json. A row a person changed since is left and named.
          python kb/_cred_rename_repoint.py --supabase-undo "$RECEIPT" \
            || echo "::error::A re-pointed kb_curation row did not go back; read ${RECEIPT}/repoint_rollback_log*.json and re-run kb/_cred_rename_repoint.py --supabase-undo ${RECEIPT}."
          test -f "$RECEIPT/apply_failed.json" || python3 -c "import json,sys; json.dump({'_about': 'the apply did not land; rollback did not run'}, open(sys.argv[1] + '/apply_failed.json', 'w'))" "$RECEIPT"
          cp -r "$RECEIPT" "$RUNNER_TEMP/receipt"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            rm -rf "$RECEIPT" && mkdir -p "$RECEIPT" && cp -r "$RUNNER_TEMP/receipt/." "$RECEIPT/"
            git add "$RECEIPT"
            git diff --cached --quiet && exit 0
            git commit -m "Cred-Ref PR-5b/1: receipt of an apply that did not land ($RECEIPT)" \
              -m "The kb files did not change. Its issuer_resolution rows were taken back (resolution_rollback_log.json) and its re-pointed assignment rows (repoint_rollback_log*.json); apply_failed.json keeps any left inert. Row moves, if any, reverse with kb/_cred_rename_undo.py."
            git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          echo "::error::The receipt of the failed apply could not be pushed."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Cred-Ref PR-5b/1 — credential rename apply"
            echo
            echo "Status: ${{ job.status }}"
            echo
            echo "Receipts (committed under kb/cred_rename_out/<date>/):"
            echo "- \`alias_map.json\` — frozen alias map (rollback input)"
            echo "- \`validation.md\` — per-file mutation counts"
            echo "- \`supabase_log.json\` — per-row Supabase migration log"
          } >> "$GITHUB_STEP_SUMMARY"

      # The last step: the old titles left under kb/ after this apply, read from the receipt the commit carried.
      # Above 0 fails the job, naming each location, so the workflow failure watch reports it. Nothing is rolled back.
      - name: Fail when old titles are left under kb/
        if: always() && steps.commit.outputs.pushed == 'true' && steps.json.outputs.receipt != ''
        env:
          RECEIPT: ${{ steps.json.outputs.receipt }}
        run: python3 kb/_cred_rename_repoint.py --count "$RECEIPT" --check

  # ── repoint_only: the re-point for an applied receipt, through the same code as the apply ──────────────────
  # Checks out main, refuses a folder that does not exist or holds no applied plan, runs the file half (a no-op
  # when applied) and the kb_curation half (pending log, PATCH guarded on value, reviewer_email and reviewed_at, a
  # fresh read filing what landed; a row already on the new title is filed and not written), re-reads the copy,
  # commits the log and the files, then counts the old titles left. Never runs the rename itself.
  repoint:
    if: inputs.repoint_only != ''
    runs-on: ubuntu-latest
    concurrency:
      group: daily-dashboard
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Re-point the receipt's saved files and kb_curation rows
        id: repoint
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FOLDER: ${{ inputs.repoint_only }}
        run: python kb/_cred_rename_repoint.py --repoint-only "$FOLDER"

      - name: Re-read the saved assignments' copy from kb_curation
        if: steps.repoint.outcome == 'success' || steps.repoint.outcome == 'failure'
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python kb/_apply_unclassified_triage.py
          python3 kb/_build_exhibits_related.py --quiet

      - name: Count the old titles left under kb/
        continue-on-error: true
        env:
          FOLDER: ${{ inputs.repoint_only }}
        run: test -f "$FOLDER/alias_map.json" && python3 kb/_cred_rename_repoint.py --count "$FOLDER"

      - name: Commit + push the re-point's log and files
        id: commit
        env:
          FOLDER: ${{ inputs.repoint_only }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d "$FOLDER" ]; then git add "$FOLDER"; fi
          git add kb/unclassified_assignments.json kb/cer_classified.json kb/occupation_credential_map.json \
                  kb/reference/map_cpl_opportunities_verified.json kb/exhibits_related.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Cred-Ref re-point of $FOLDER (repoint_only)" \
            -m "The saved files and kb_curation rows this applied plan left on old titles (kb/_cred_rename_repoint.py). Log: $FOLDER/repoint_supabase_log*.json; files: $FOLDER/repoint*.json. kb/_cred_rename_undo.py or kb/_cred_rename_repoint.py --undo reverses it."
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          exit 1

      - name: Fail when the re-point refused or did not land
        if: always() && steps.repoint.outcome == 'failure'
        run: |
          echo "::error::kb/_cred_rename_repoint.py --repoint-only refused or a row did not land; read its log above and ${{ inputs.repoint_only }}/repoint_supabase_log*.json."
          exit 1

      - name: Fail when old titles are left under kb/
        if: always() && steps.commit.outputs.pushed == 'true'
        env:
          FOLDER: ${{ inputs.repoint_only }}
        run: python3 kb/_cred_rename_repoint.py --count "$FOLDER" --check

  # ── Start daily-dashboard.yml on main, so the published files follow the apply (#3110: they lagged 98 minutes) ─
  # Its own job, the only one holding actions: write, and only once a job above pushed. It starts after the writing
  # job released the daily-dashboard group. GitHub keeps ONE pending run per group and cancels the older pending one
  # when another arrives, so when a run of a workflow in the group is already pending this job dispatches nothing:
  # a pending daily-dashboard run publishes this commit anyway, and another workflow's pending run must not be
  # cancelled, so the job fails and the failure watch reports it. A failed lookup or a failed dispatch fails it too.
  # The dashboard's gate job runs every non-scheduled event, so the dispatched run is never skipped.
  dashboard:
    needs: [apply, repoint]
    if: always() && (needs.apply.outputs.pushed == 'true' || needs.repoint.outputs.pushed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout main (for the list of workflows in the group)
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Start daily-dashboard.yml on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          group_files=$(grep -lE '^ +group: daily-dashboard$' .github/workflows/*.yml | xargs -n1 basename)
          for wf in $group_files; do
            if ! n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --json status \
                  -q '[.[] | select(.status == "pending" or .status == "queued" or .status == "waiting")] | length'); then
              echo "::error title=Dashboard not started::The lookup of pending $wf runs failed, so a dispatch could cancel one. Dispatch daily-dashboard.yml by hand."
              exit 1
            fi
            if [ "$n" -gt 0 ]; then
              if [ "$wf" = "daily-dashboard.yml" ]; then
                echo "A daily-dashboard run is already pending; it publishes this commit."
                exit 0
              fi
              echo "::error title=Dashboard not started::$wf has a pending run in the daily-dashboard group, which a new dispatch would cancel. Dispatch daily-dashboard.yml after it finishes."
              exit 1
            fi
          done
          if ! gh workflow run daily-dashboard.yml --ref main -R "$GITHUB_REPOSITORY"; then
            echo "::error title=Dashboard not started::gh workflow run daily-dashboard.yml failed."
            exit 1
          fi
          echo "Dispatched daily-dashboard.yml on main."
