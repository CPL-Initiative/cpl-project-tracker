name: Daily CPL Dashboard

on:
  schedule:
    # GitHub's scheduled trigger is best-effort: it routinely delays this repo's
    # cron by 1.5-4h and occasionally DROPS a run entirely (no failed run, none
    # queued). We can't shrink that delay, so we (a) schedule EARLY for buffer and
    # (b) run a 3-cron ladder ~3h apart — if an earlier cron is dropped/over-delayed,
    # a later one still refreshes the dashboard before the workday. The job is
    # idempotent (concurrency serializes them; kpi_history overwrites same-day;
    # "no changes -> no commit"), so a later cron firing after a good earlier run
    # is a safe no-op. Times are fixed UTC (cron has no DST -> ~1h seasonal drift).
    - cron: '17 6 * * *'    # primary    — ~11:17 PM PT prev night (10:17 PM PST); lands overnight even after delay
    - cron: '17 9 * * *'    # backstop 1 — ~2:17 AM PT (1:17 AM PST)
    - cron: '17 12 * * *'   # backstop 2 — ~5:17 AM PT (4:17 AM PST); last safety net before the workday
  workflow_dispatch:         # allow manual trigger from GitHub UI

concurrency:
  group: daily-dashboard
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        # Pinned in requirements.txt; Dependabot proposes bumps via
        # .github/dependabot.yml. Run a PR's CI before merging a bump.
        run: pip install -r requirements.txt

      # ── Step 1: Fetch CustomReport JSON ─────────────────────────
      - name: Fetch CustomReport from MAP API
        # Pre-staged for MAP's user-auth rollout (docs/map_api_auth_handoff.md).
        # These secrets don't exist yet → they resolve to empty → fetch stays
        # unauthenticated (today's behavior). When MAP issues a service
        # credential, add the MAP_API_KEY secret (+ optionally header/scheme) and
        # the fetch authenticates with no code change.
        env:
          MAP_API_KEY: ${{ secrets.MAP_API_KEY }}
          MAP_API_AUTH_HEADER: ${{ secrets.MAP_API_AUTH_HEADER }}
          MAP_API_AUTH_SCHEME: ${{ secrets.MAP_API_AUTH_SCHEME }}
        run: |
          python fetch_custom_report.py --output CustomReport_latest.json \
            && echo "CUSTOM_REPORT_STATUS=success" >> "$GITHUB_ENV" \
            || echo "CUSTOM_REPORT_STATUS=fallback" >> "$GITHUB_ENV"

      # ── Step 2: Scrape live metrics ──────────────────────────────
      - name: Scrape live metrics from Cloudflare Worker
        env:
          CPL_SCRAPE_SECRET: ${{ secrets.CPL_SCRAPE_SECRET }}
        run: |
          curl -s "https://cpl-proxy.slee-548.workers.dev/scrape?secret=${CPL_SCRAPE_SECRET}" \
            -o live_metrics_new.json
          python3 - <<'EOF'
          import json, shutil, sys
          try:
              d = json.load(open('live_metrics_new.json'))
              assert 'scraped_at' in d and 'metrics' in d and 'raw' in d
              shutil.move('live_metrics_new.json', 'live_metrics.json')
              print(f"Live metrics updated: {d['scraped_at']}")
              open('/tmp/metrics_status', 'w').write('success')
          except Exception as e:
              print(f"Scrape failed ({e}) — using existing live_metrics.json")
              open('/tmp/metrics_status', 'w').write('fallback')
          EOF
          echo "LIVE_METRICS_STATUS=$(cat /tmp/metrics_status)" >> "$GITHUB_ENV"

      # ── Step 2b: Fetch MIL/JST (reported military vs uploaded JSTs) ──
      # Same public potential-savings API the worker scrapes, but carrying the
      # EnrolledMilitaryStudents (MIL) / VeteransWithJSTs (JST) counts + the
      # Veteran Star (JST >= 75% of MIL) the worker doesn't surface. Runs on the
      # runner (the Azure host is egress-blocked from the agent sandbox). Soft-
      # fails (keeps the prior veteran_jst.json) — the generator degrades
      # gracefully when it's absent (no MIL/JST column / proxy retained).
      - name: Fetch MIL/JST veteran data
        run: python3 fetch_veteran_jst.py || echo "veteran-jst fetch failed (non-fatal; prior artifact kept)"

      # ── Step 3: Sync curation overlay from Supabase ──────────────
      # Folds reviewer discipline edits (public.kb_curation) into the
      # git-canonical kb/coci_curation.json so the pipeline below bakes them
      # into the dataset + export. Skips gracefully until the secret is set.
      - name: Sync curation overlay from Supabase
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "${SUPABASE_SERVICE_KEY:-}" ]; then
            # Non-fatal like its siblings below: the curation sync is an overlay
            # enhancement and the generator falls back to the committed
            # kb/coci_curation.json. _apply_curation.py now retries transient
            # network/TLS blips itself; this guard backstops a persistent Supabase
            # outage so it can't abort the whole daily publish (a transient SSL
            # EOF here failed the 2026-06-22 manual run).
            python kb/_apply_curation.py || echo "::warning title=Curation sync failed::kb/_apply_curation.py exited non-zero — dashboard publishes from the committed kb/coci_curation.json; next run re-syncs. Check the step log."
            # Phase 1e: fold Canonical SUBJ4 curator edits (synthesized
            # _CANON_SUBJ4::<discipline> keys) into kb/discipline_canonical_subj4.json.
            # Skipped gracefully if the seed file doesn't exist yet.
            if [ -f kb/discipline_canonical_subj4.json ]; then
              # ::warning:: makes a silent-for-weeks failure LOUD in the run
              # summary (Session 47 found CIS=CSIS sat unsynced since 05-23
              # behind a bare `|| echo`). Still non-fatal — the dashboard
              # publish must not die on a sync hiccup; the seed is
              # eventually-consistent and appliers fresh-read at write-time.
              python kb/_apply_canonical_subj4.py || echo "::warning title=Canonical SUBJ4 sync failed::kb/_apply_canonical_subj4.py exited non-zero — the committed seed may drift from Supabase picks until this passes. Check the step log."
            fi
            # Cred-Ref PR-5a: fold credential-review curator edits
            # (_CREDENTIAL_REVIEW::<unified_title> rows) into the git-canonical
            # overlay at kb/credential_review_overlay.json. The dashboard reads
            # Supabase live; this script keeps the overlay in git for audit +
            # non-dashboard consumers. unified_title renames are RECORDED but
            # not applied — see Cred-Ref PR-5b for rename promotion.
            python kb/_apply_credential_review.py || echo "Credential review sync failed — non-fatal"
            # CER unclassified-triage PR-2: fold the worklist's raw-title→unified-title
            # assignments (_UNCLASSIFIED::<raw_title> rows) into the git-canonical
            # overlay kb/unclassified_assignments.json. Idempotent.
            python kb/_apply_unclassified_triage.py || echo "Unclassified triage sync failed — non-fatal"
            # CER unclassified-triage PR-3 (gated auto-fold, added 2026-07-07): fold
            # overlay assignments into kb/unified_titles.json + credentials.json when
            # EVERY V-gate passes (clean adds + supersedes of unreviewed machine
            # drafts only — the curator's reviewer-gated tab write IS the human act).
            # Human-reviewed conflicts + unresolved articulation ripples still block
            # and wait for the manual fold path; --apply-if-safe never fails the run.
            python kb/_fold_unclassified.py --apply-if-safe || echo "::warning title=Unclassified fold failed::kb/_fold_unclassified.py exited non-zero — curator triage assignments are stuck in the overlay until this passes. Check the step log."
          else
            echo "SUPABASE_SERVICE_KEY not set — skipping curation sync."
          fi

      # ── Step 3b: node docx for the Word reports ───────────────────
      # excel_to_dashboard.py shells out to `node generate_reports.js` (the
      # Master + per-project mini .docx linked from the dashboard). Without
      # this install the require('docx') fails and the step was silently
      # skipped ("Report generation warning" — non-fatal), so the committed
      # reports/*.docx went stale (found 2026-07-02: last refresh was a
      # session commit, not the cron). Pin the same version as the local
      # docx.min.js copy. --no-save keeps package.json test-only.
      - name: Install node docx (Word reports)
        run: npm install --no-save --no-package-lock docx@8.0.4

      # ── Step 4: Run pipeline ─────────────────────────────────────
      # SUPABASE_SERVICE_KEY is needed for the Workplan Goals read path
      # (Phase 1 PR-4: source-of-truth = public.workplan_goals). The
      # generator falls back to kb/workplan_goals_snapshot.json on Supabase
      # outage; if the env var is missing AND the snapshot is missing too,
      # the generator fails loudly (no silent rendering of nothing).
      # It also folds the newest Supabase item_updates (RACI 📝 composer)
      # into projects[].update so cards + reports carry current updates.
      - name: Run dashboard pipeline
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python excel_to_dashboard.py

      # ── Step 4a0: Governance drift detector (OQ-08) ────────────────
      # Regenerates kb/governance_candidates.json — surfaces that look governable
      # and have no row in the governance register. PROPOSALS only; nothing is
      # ever auto-added to the register itself. Pure static analysis of the repo:
      # no Supabase, no secrets, no network, so it cannot fail the run for an
      # external reason. `|| true` because a governance NICE-TO-HAVE must never
      # be what breaks the daily dashboard.
      - name: Rebuild governance drift candidates
        run: python kb/_build_governance_candidates.py || true

      # ── Step 4a0b: Common CR Reference worklist ────────────────────
      # Regenerates kb/cr_reference_worklist.json — the ranked curation queue
      # over the ~2,344 distinct credit-recommendation wordings colleges typed.
      #
      # The chain is three PURE LOCAL transforms over committed inputs
      # (kb/coci_articulations.json, credential_reference_data.js,
      # statewide_data.js) — no Supabase, no secrets, no network. The first two
      # payloads are gitignored intermediates that credential-catalog-sync.yml
      # also builds for its own Supabase push; rebuilding them here costs
      # seconds and removes a cross-workflow ordering dependency.
      #
      # ⚠️ The worklist is a PROPOSAL surface. Curator decisions live in the
      # gated Supabase table cr_reference_decisions and are keyed on group_key,
      # so regenerating this file can never overwrite a judgement — the same
      # separation governance_owners uses.
      #
      # `|| true` for the same reason as 4a0: a curation nice-to-have must never
      # be what breaks the daily dashboard.
      - name: Rebuild Common CR Reference worklist
        run: |
          python kb/_build_peer_articulations.py \
            && python kb/_build_credential_recs.py \
            && python kb/_build_cr_reference.py || true

      # ── Step 4a1: CPL Pathways — Common Course Reference enrichment ─
      # Rebuilds cpl_pathways_ccr_data.js from the CURRENT minted-identity +
      # articulation + catalog sources, so every mint / re-mint / merge in the
      # CCR pipeline ripples onto the CPL Pathways cards (student + college
      # views) on the next daily run — no separate sync (Sam, 2026-07-15).
      # Non-fatal: the pathways cards degrade gracefully (prior artifact kept)
      # if the minted sources are momentarily unreadable.
      - name: Build CPL Pathways CCR enrichment
        run: python3 kb/_build_cpl_pathway_ccr.py || echo "CPL Pathways CCR build failed (non-fatal; prior artifact kept)"

      # ── Step 4a1b: CPL Pathways — AUTHORITATIVE membership view ────
      # Rebuilds the program→course graph (from the committed Program Course File
      # + CB master + course list; ~67 MB, NOT committed — regenerable) and then
      # cpl_pathways_membership_data.js: each baccalaureate's OWN course list +
      # per-course potential CPL + its qualifying associate credentials (A.S./A.A./
      # cert, same college + field) where the dense CPL lives. Supersedes the
      # TOP-proxy CCR guess for the ~39 baccalaureates in the join (StarMora
      # run-through, docs/cpl_pathways_lessons.md). Non-fatal: the cards fall back
      # to the CCR view (prior artifact kept) if a source is momentarily unreadable.
      - name: Build CPL Pathways membership view
        run: |
          python3 kb/_build_program_course_graph.py \
            && python3 kb/_build_cpl_pathway_membership.py \
            || echo "CPL Pathways membership build failed (non-fatal; prior artifact kept)"

      # ── Step 4a2: Funding priority-metric actuals (P2/P3) ─────────
      # Aggregates the transient CustomReport student grain into per-college
      # suppressed counts (docs/kb-notes/adr-funding-priority-metrics-privacy.md,
      # ratified 2026-06-11). Skips gracefully (exit 0, keeps the prior
      # artifact) when the fetch fell back; non-fatal otherwise — the
      # dashboard publish matters more than one day of actuals.
      - name: Build funding priority-metric actuals
        run: python3 funding/_build_funding_performance.py CustomReport_latest.json || echo "funding-performance build failed (non-fatal; prior artifact kept)"

      # ── Step 4a3: ESS 25-82 outcome-2 rollup ──────────────────────
      # Rolls credential_reference_data.js (regenerated in step 3 above) down to a
      # compact per-college "adopted >= 1 statewide credit recommendation" sidecar
      # for the $15M Distributions sub-view. Non-fatal: absent sidecar → the tab
      # shows that outcome as pending rather than a false "not met".
      - name: Build ESS 25-82 statewide-recommendation rollup
        run: python3 funding/_build_funding_ess.py || echo "funding-ess build failed (non-fatal; prior artifact kept)"

      # ── Step 4b: Re-run row Trust-Card auditor ────────────────────
      # Read-only over kb/coci_*.json; writes kb/row_audit/{latest.json,
      # <date>.md} that the UCL "⚠ hinky" badge consumes. See CLAUDE.md §11.
      # Failure is non-fatal (auditor output is a UI enhancement, not load-
      # bearing for the dashboard itself).
      - name: Run row Trust-Card auditor
        run: python3 kb/_row_audit.py || echo "Auditor failed — UCL hinky chips will use prior latest.json"

      # ── Step 4b2: Re-run the EXHIBIT auditor (credential layer) ───
      # Writes kb/exhibit_audit/{latest.json, <date>.md} — the CER's triage
      # worklist reads latest.json LIVE, and it had been frozen at 2026-05-24
      # because no workflow ran kb/_audit_exhibits.py (found 2026-07-07: the
      # stale snapshot listed already-classified titles as unclassified).
      # Runs AFTER the curation sync + unclassified fold so freshly-folded
      # titles don't re-flag, and uses the step-1 CustomReport_latest.json for
      # MAP drift checks (KB-only mode when it's absent — non-fatal either way).
      - name: Run exhibit-canonicalization auditor
        run: python3 kb/_audit_exhibits.py || echo "Exhibit auditor failed — CER worklist will use prior latest.json"

      # ── Step 4b3: identity-anchored triage suggestions (Rule 5c) ──
      # After the auditor refreshes the unclassified queue, regenerate the
      # worklist's 💡 fill chips: CCN > C-ID > COS authority > modal local
      # course title, per skill Rule 5c. Suggestions only — curator confirms.
      - name: Build unclassified-triage suggestions
        run: python3 kb/_suggest_unclassified.py || echo "Triage suggestions failed — worklist renders without chips"

      # ── Step 4c: Cred-Ref PR-5b/0 — credential rename dry-run ─────
      # Read-only over kb/credential_review_overlay.json (synced from Supabase
      # at step 3); writes kb/cred_rename_dryrun/{report.md, alias_map.json,
      # collisions.json}. Mode B preview — projects unified_title_override
      # curator entries onto the post-rename state, surfaces collisions +
      # apply-gate status. Does NOT apply renames; apply is Cred-Ref PR-5b/1,
      # manual workflow_dispatch only. Failure is non-fatal.
      - name: Run credential rename dry-run
        run: python3 kb/_cred_rename_dryrun.py || echo "Credential rename dry-run failed — non-fatal"

      # Build the public Fact Sheet's statewide credit-rec data from the freshly
      # regenerated statewide_data.js (authoritative CCC-tagged recs only). Logs
      # any statewide credential lacking a CCC exhibit. Non-fatal.
      - name: Build statewide credit recs (Fact Sheet)
        run: python3 fact-sheet/_build_statewide_recs.py || echo "statewide recs build failed (non-fatal; prior artifact kept)"

      # ── Step 5: Prepare GitHub Pages entry point ─────────────────
      - name: Copy dashboard to index.html
        run: cp CPL_Dashboard.html index.html

      # ── Step 6: Commit and push ───────────────────────────────────
      - name: Commit and push to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html CPL_Dashboard.html CPL_Data.js \
                  live_metrics.json kpi_history.json statewide_data.js \
                  fact-sheet/statewide_recs.js \
                  fact_sheet_metrics.json \
                  statewide_prescriptive.js \
                  college_activity.js college_activity_template.html \
                  kb/coci_curation.json unified_courses_data.js \
                  unified_courses_index.js unified_courses_details.js \
                  unified_courses_standalone.js unified_courses_members.js \
                  unified_courses_member_desc.js \
                  unified_courses_suggestions.js \
                  unified_courses_aligned.js \
                  credential_reference_data.js \
                  kb/row_audit/latest.json kb/row_audit/*.md \
                  exports/unified_courses.xlsx
          # CPL Pathways AUTHORITATIVE membership view (StarMora) — the program→
          # course join artifact the cards read; regenerated in Step 4a1b above.
          git add cpl_pathways_membership_data.js 2>/dev/null || true
          # Phase 1e canonical SUBJ4 seed + curator-edit overlay (added 5a)
          git add kb/discipline_canonical_subj4.json 2>/dev/null || true
          # CSR rollup: per-discipline CPL opportunities (mirror of EACR/CCR)
          git add kb/discipline_cpl_rollup.json 2>/dev/null || true
          # Cred-Ref PR-5a: credential-review curator-edit overlay
          git add kb/credential_review_overlay.json 2>/dev/null || true
          # OQ-08: governance drift candidates (what's missing from the register)
          git add kb/governance_candidates.json 2>/dev/null || true
          # Common CR Reference: the ranked curation worklist the tab fetches.
          # Curator decisions are NOT here — they live in Supabase, so a rebuild
          # cannot overwrite one.
          git add kb/cr_reference_worklist.json 2>/dev/null || true
          # CER unclassified-triage PR-2: raw-title→unified-title assignment overlay
          git add kb/unclassified_assignments.json 2>/dev/null || true
          # CER unclassified-triage PR-3 (gated auto-fold): the credential KB the
          # fold mutates + its receipts + the audit snapshot it prunes. The
          # articulation re-point (supersede lane) also lands here.
          git add kb/unified_titles.json kb/credentials.json \
                  kb/coci_articulations.json kb/unclassified_fold/ 2>/dev/null || true
          # Exhibit auditor output (step 4b2): the CER triage worklist's live
          # source + the human report ((<date>.full.json stays gitignored).
          git add kb/exhibit_audit/latest.json kb/exhibit_audit/*.md 2>/dev/null || true
          # Identity-anchored triage suggestions (step 4b3) — the worklist's 💡 chips.
          git add kb/unclassified_suggestions.json 2>/dev/null || true
          # COCI source-data quality queues (regenerated by export_unified_courses
          # each run — for the colleges to fix at source): mojibake title repairs +
          # duplicate-CourseControlNumber errors (one control # → ≥2 courses).
          git add kb/coci_title_corrections.json \
                  kb/coci_duplicate_control_numbers.json 2>/dev/null || true
          # Cred-Ref PR-5b/0: credential rename dry-run artifacts (Mode B preview)
          git add kb/cred_rename_dryrun/report.md \
                  kb/cred_rename_dryrun/alias_map.json \
                  kb/cred_rename_dryrun/collisions.json 2>/dev/null || true
          # Funding priority-metric actuals (P2/P3, suppressed — ratified ADR)
          git add cpl_funding_performance.js 2>/dev/null || true
          git add cpl_funding_ess.js 2>/dev/null || true
          # MIL/JST veteran data (aggregate per-college MIL/JST + Veteran Star;
          # no PII — same counts shown on the public MAP dashboard). Guarded:
          # absent until the first successful fetch_veteran_jst.py run.
          git add veteran_jst.json 2>/dev/null || true
          # Workplan Goals Phase 1 PR-4: daily-cached Supabase snapshot
          # (graceful-degradation fallback for Supabase outages)
          git add kb/workplan_goals_snapshot.json 2>/dev/null || true
          # Projects Phase 2 PR-4: daily-cached Supabase snapshot
          # (graceful-degradation fallback for Supabase outages)
          git add kb/projects_snapshot.json 2>/dev/null || true
          # Project lifecycle (Session 84): committed ledger of Tabled/Archived
          # projects (offline fallback + the "noted in the KB" record)
          git add kb/project_lifecycle.json 2>/dev/null || true
          # Budget Phase 3 PR-1: daily-cached Supabase snapshot
          # (budget_funding + personnel; graceful-degradation fallback)
          git add kb/budget_snapshot.json 2>/dev/null || true
          # Word reports (Master + per-project minis) — regenerated by
          # generate_reports.js inside the pipeline run from the same
          # CPL_Data.js (incl. the live item_updates fold), and linked from
          # the dashboard (Master Report fallback + the 34 card Report
          # buttons). Committing them keeps those links current (they had
          # gone stale — 2026-07-02).
          git add reports/CPL_Master_Report.docx reports/projects/*.docx 2>/dev/null || true
          # COCI title-correction queue: raw course titles with encoding
          # artifacts, repaired for display (e:1 member chip) + queued here
          # so the source records can be fixed in COCI
          git add kb/coci_title_corrections.json 2>/dev/null || true
          # CustomReport_latest.json is intentionally NOT committed — it carries
          # student PII (names/DOB/IDs) + staff contacts. It is fetched fresh each
          # run (Step 1) and read by the generator at runtime; gitignored so it
          # never lands in this PUBLIC repo. Only aggregated artifacts are committed.
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily dashboard update — $(date +%Y-%m-%d)"
          # Retry push with rebase on non-fast-forward (handles concurrent pushes to main)
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed — rebasing onto origin/main and retrying."
            git fetch origin main
            # The run leaves UNSTAGED regenerated files (everything not in the
            # git add list) in the tree, and `git rebase` refuses with
            # "You have unstaged changes" — which is exactly how the
            # 2026-07-08 20:23 run died when PR #698 merged mid-run. That
            # output is disposable (the next run regenerates it): discard it
            # so the committed snapshot rebases cleanly.
            git checkout -- .
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          echo "Push failed after 5 attempts."
          exit 1

      - name: Summary
        run: |
          echo "### CPL Dashboard Update — $(date +%Y-%m-%d)" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| CustomReport | $CUSTOM_REPORT_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Live metrics | $LIVE_METRICS_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dashboard URL | https://cpl-initiative.github.io/cpl-project-tracker/ |" >> "$GITHUB_STEP_SUMMARY"
