name: Daily CPL Dashboard

on:
  schedule:
    # GitHub's scheduled trigger is best-effort: it routinely delays this repo's
    # cron by 1.5-4h and occasionally DROPS a run entirely (no failed run, none
    # queued). We can't shrink that delay, so we (a) schedule EARLY for buffer and
    # (b) run a 3-cron ladder ~3h apart — if an earlier cron is dropped/over-delayed,
    # a later one still refreshes the dashboard before the workday. The job is
    # idempotent (concurrency serializes them; kpi_history overwrites same-day;
    # "no changes -> no commit"), so a later cron firing after a good earlier run
    # is a safe no-op. Times are fixed UTC (cron has no DST -> ~1h seasonal drift).
    - cron: '17 6 * * *'    # primary    — ~11:17 PM PT prev night (10:17 PM PST); lands overnight even after delay
    - cron: '17 9 * * *'    # backstop 1 — ~2:17 AM PT (1:17 AM PST)
    - cron: '17 12 * * *'   # backstop 2 — ~5:17 AM PT (4:17 AM PST); last safety net before the workday
  workflow_dispatch:         # allow manual trigger from GitHub UI

# The concurrency group sits on update-dashboard, not on the workflow (COBIx #3110, S641). GitHub keeps
# one pending run per group and cancels the older pending one when another queues; a workflow-level group
# put every scheduled rung in the queue, so a rung that would only stand down (they land 5-7 hours late,
# in the working day) could displace an apply waiting in the group. The gate runs outside the group and
# reads nothing it writes; only a run that will build enters it. The group is still `daily-dashboard`,
# shared with the applies, the Docket and the Library publisher.
#
# The build is written once, in scripts/daily_build.sh, and runs as one step. Other workflows and merges
# push to main outside the group, so the run's push can meet a rebase conflict on a generated file. No side
# of it is ever picked: the "Commit and push to main" step resets to the new main and runs that main's
# scripts/daily_build.sh once more, inside this job, then pushes (COBIx #3110 finding 8, S641). A clean rebase
# that changes any path the build may read (all but docs/ and tests/) rebuilds the same way (S643); one rebuild
# a run, and an input that changes again after it is pushed over with a warning. Never by a
# dispatch: a conflicted run that ends green having published nothing makes the gate stand the later rungs
# down. A second conflict, or a failed rebuild, ends the run red with nothing pushed, so the later rungs stay
# the backstop. The CustomReport fetch, the scrape and the MIL/JST fetch are reused in the rebuild unless
# main's copy of their file changed meanwhile. The SkyView shard upload runs after the push, from the tree
# that was pushed.

jobs:
  # A scheduled run stands down when the day (UTC) already has a successful run (S527, Sam, 2026-10-30:
  # the cron "could give sierra problems" firing mid-Summit, and GitHub creates these runs 5-7 hours
  # late). The first CPL Queue firing each night dispatches the run on time (scheduled_sessions, step 0),
  # so the three crons are backstops that run only when nothing has. A dispatch always runs. If the
  # lookup itself fails, the run goes ahead, as before.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/daily_gate.sh
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: bash scripts/daily_gate.sh

  update-dashboard:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: daily-dashboard
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read   # the stand-down check, run again once this job holds the group

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # The gate ran before this run waited in the group. A rung that passed it while another run was still
      # building waits here, and builds a second time after that run succeeds: the mid-day build the S527
      # gate exists to prevent. So the same check runs again once this job holds the group (S641, #3147
      # review), and every step below runs only when it says build. A dispatch always builds, as at the gate.
      - name: Stand down if the day already has a successful run (the gate, again, inside the group)
        id: recheck
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: bash scripts/daily_gate.sh

      - name: Set up Python
        if: steps.recheck.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        if: steps.recheck.outputs.run == 'true'
        # Pinned in requirements.txt; Dependabot proposes bumps via
        # .github/dependabot.yml. Run a PR's CI before merging a bump.
        run: pip install -r requirements.txt

      # ── Step 3b: node docx for the Word reports ───────────────────
      # excel_to_dashboard.py shells out to `node generate_reports.js` (the
      # Master + per-project mini .docx linked from the dashboard). Without
      # this install the require('docx') fails and the step was silently
      # skipped ("Report generation warning" — non-fatal), so the committed
      # reports/*.docx went stale (found 2026-07-02: last refresh was a
      # session commit, not the cron). Pin the same version as the local
      # docx.min.js copy. --no-save keeps package.json test-only.
      - name: Install node docx (Word reports)
        if: steps.recheck.outputs.run == 'true'
        run: npm install --no-save --no-package-lock docx@8.0.4

      # ── Steps 1 to 5: the build, written once in scripts/daily_build.sh ──
      # The fetches, the curation sync, the pipeline and every rebuilder, in order, each as one `step` block
      # with its own comments (they were 41 steps here). The commit step below runs the same file again from
      # the new main when its push meets a rebase conflict. The env is the union of what the steps declared;
      # inside the script each block keeps only the secrets it declared (tests/apply_concurrency_test.py).
      - name: Build the dashboard and its kb files
        if: steps.recheck.outputs.run == 'true'
        env:
          MAP_API_KEY: ${{ secrets.MAP_API_KEY }}
          MAP_API_AUTH_HEADER: ${{ secrets.MAP_API_AUTH_HEADER }}
          MAP_API_AUTH_SCHEME: ${{ secrets.MAP_API_AUTH_SCHEME }}
          CPL_SCRAPE_SECRET: ${{ secrets.CPL_SCRAPE_SECRET }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: bash scripts/daily_build.sh

      # ── Step 6: Commit and push ───────────────────────────────────
      # `stage` is the run's git add list, written once here. On a rebase conflict, or a clean rebase that
      # changes a build input, the push rebuilds ONCE in this job: reset to the new main, reinstall
      # requirements.txt, run scripts/daily_build.sh from that tree, stage again (COBIx #3110 finding 8, S641).
      # The env carries the secrets the rebuild can need (the CustomReport fetch is always reused, so not MAP's).
      - name: Commit and push to main
        id: push
        if: steps.recheck.outputs.run == 'true'
        env:
          CPL_SCRAPE_SECRET: ${{ secrets.CPL_SCRAPE_SECRET }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          stage() {
            git add index.html CPL_Dashboard.html CPL_Data.js \
                    live_metrics.json kpi_history.json statewide_data.js \
                    fact-sheet/statewide_recs.js \
                    fact-sheet/statewide_catalog.json \
                    fact_sheet_metrics.json \
                    statewide_prescriptive.js \
                    college_activity.js college_activity_template.html \
                    kb/coci_curation.json unified_courses_data.js \
                    unified_courses_index.js unified_courses_details.js \
                    unified_courses_standalone.js unified_courses_members.js \
                    unified_courses_member_desc.js \
                    unified_courses_suggestions.js \
                    unified_courses_aligned.js \
                    credential_reference_data.js \
                    kb/row_audit/latest.json kb/row_audit/*.md \
                    exports/unified_courses.xlsx
            # CPL Pathways AUTHORITATIVE membership view (StarMora) — the program→
            # course join artifact the cards read; regenerated in Step 4a1b above.
            git add cpl_pathways_membership_data.js 2>/dev/null || true
            # Phase 1e canonical SUBJ4 seed + curator-edit overlay (added 5a)
            git add kb/discipline_canonical_subj4.json 2>/dev/null || true
            # COCI C-ID claim audit (SkyHarbor, 2026-11-06)
            git add kb/cid_claim_audit.json 2>/dev/null || true
            # College short names, folded from the College Identity tab's edits in the curation sync (S545).
            git add kb/college_short_names.json college_short_names.js 2>/dev/null || true
            # SkyView's decision payload + the served page that inlines it (Step
            # 4d2). ccr_universe.json is deliberately NOT here — the layout is
            # hand-rebuilt (Sam, 2026-09-06).
            git add prototype/ccr_atlas_data.json prototype/skyview.html 2>/dev/null || true
            # SkyView's CPL payload (Step 4d3): the crosswalk joined to the curated
            # agencies and the articulated-exhibit feed, rebuilt every run.
            git add prototype/ccr_cpl.json 2>/dev/null || true
            # ⚠️ REBUILT EVERY RUN AND NEVER LANDED (found 2026-09-10, S252): step
            # 4d3b regenerated this payload daily while this list did not name it,
            # so main's copy went stale against the refreshed CER and
            # tests/ccr_cpl_universe_test.py read red on main itself.
            git add prototype/ccr_cpl_universe.json 2>/dev/null || true
            git add prototype/ccr_cpl_universe_members.json 2>/dev/null || true
            # SkyView's sky placement (Step 4d4): the islands on the sphere, rebuilt when its inputs change.
            git add prototype/ccr_sky.json 2>/dev/null || true
            # The discipline-blank worklist (Step 4d5): the identities the edge
            # cannot reach, for a curator pass.
            git add kb/discipline_blanks_worklist.json 2>/dev/null || true
            # The orphan-parent worklist (Step 4d6): parents whose members all
            # disagree with them, for the same curator pass.
            git add kb/orphan_parent_worklist.json 2>/dev/null || true
            # The re-mint blast radius (Step 4d7): rebuilt from today's curation.
            git add prototype/ccr_remint_blast.json kb/remint_blast_worklist.json 2>/dev/null || true
            # CSR rollup: per-discipline CPL opportunities (mirror of EACR/CCR)
            git add kb/discipline_cpl_rollup.json 2>/dev/null || true
            # Cred-Ref PR-5a: credential-review curator-edit overlay
            git add kb/credential_review_overlay.json 2>/dev/null || true
            # OQ-08: governance drift candidates (what's missing from the register)
            git add kb/governance_candidates.json 2>/dev/null || true
            # Common CR Reference: the ranked curation worklist the tab fetches.
            # Curator decisions are NOT here — they live in Supabase, so a rebuild
            # cannot overwrite one.
            git add kb/cr_reference_worklist.json 2>/dev/null || true
            # CER unclassified-triage PR-2: raw-title→unified-title assignment overlay
            git add kb/unclassified_assignments.json 2>/dev/null || true
            # CER unclassified-triage PR-3 (gated auto-fold): the credential KB the
            # fold mutates + its receipts + the audit snapshot it prunes. The
            # articulation re-point (supersede lane) also lands here.
            git add kb/unified_titles.json kb/credentials.json \
                    kb/coci_articulations.json kb/unclassified_fold/ 2>/dev/null || true
            # Exhibit auditor output (step 4b2): the CER triage worklist's live
            # source + the human report ((<date>.full.json stays gitignored).
            git add kb/exhibit_audit/latest.json kb/exhibit_audit/*.md 2>/dev/null || true
            # Identity-anchored triage suggestions (step 4b3) — the worklist's 💡 chips.
            git add kb/unclassified_suggestions.json 2>/dev/null || true
            # The Exhibits tab's Review queue (kb/_build_exhibits_review.py).
            git add kb/exhibits_review.json kb/exhibits_review_courses.json kb/exhibits_adoption.json 2>/dev/null || true
            # The Exhibits tab's Another look (kb/_sweep_exhibit_titles.py).
            git add kb/exhibits_sweep.json 2>/dev/null || true
            git add kb/exhibits_related.json 2>/dev/null || true
            git add kb/credential_title_moves.json 2>/dev/null || true
            git add kb/exhibits_ai_sort.json 2>/dev/null || true
            git add kb/exhibit_cert_links.json 2>/dev/null || true
            git add kb/exhibit_slo_neighbors.json 2>/dev/null || true
            # The public adoption page's data (kb/_build_adopt_page.py) and its analysis (kb/_build_adopt_align.py).
            git add library/adopt/adopt_data.json library/adopt/adopt_more.json library/adopt/adopt_align.json library/adopt/adopt_ai.json 2>/dev/null || true
            # COCI source-data quality queues (regenerated by export_unified_courses
            # each run — for the colleges to fix at source): mojibake title repairs +
            # duplicate-CourseControlNumber errors (one control # → ≥2 courses).
            git add kb/coci_title_corrections.json \
                    kb/coci_duplicate_control_numbers.json 2>/dev/null || true
            # Cred-Ref PR-5b/0: credential rename dry-run artifacts (Mode B preview)
            git add kb/cred_rename_dryrun/report.md \
                    kb/cred_rename_dryrun/alias_map.json \
                    kb/cred_rename_dryrun/collisions.json 2>/dev/null || true
            # Funding priority-metric actuals (P2/P3, suppressed — ratified ADR)
            git add cpl_funding_performance.js 2>/dev/null || true
            git add cpl_funding_ess.js 2>/dev/null || true
            # MIL/JST veteran data (aggregate per-college MIL/JST + Veteran Star;
            # no PII — same counts shown on the public MAP dashboard). Guarded:
            # absent until the first successful fetch_veteran_jst.py run.
            git add veteran_jst.json 2>/dev/null || true
            # Workplan Goals Phase 1 PR-4: daily-cached Supabase snapshot
            # (graceful-degradation fallback for Supabase outages)
            git add kb/workplan_goals_snapshot.json 2>/dev/null || true
            # Projects Phase 2 PR-4: daily-cached Supabase snapshot
            # (graceful-degradation fallback for Supabase outages)
            git add kb/projects_snapshot.json 2>/dev/null || true
            # The Commons tab's figures (the step before the copy): rebuilt every run.
            git add kb/status/commons.json 2>/dev/null || true
            git add kb/status/commons_history.json 2>/dev/null || true
            git add kb/ccr_doubt.json 2>/dev/null || true
            git add kb/status/program-requirements-checked.json 2>/dev/null || true
            # The Common Subjects Reference's daily scan (the step before the Commons build).
            git add kb/csr_out/latest.json 2>/dev/null || true
            # Project lifecycle (Session 84): committed ledger of Tabled/Archived
            # projects (offline fallback + the "noted in the KB" record)
            git add kb/project_lifecycle.json 2>/dev/null || true
            # Budget Phase 3 PR-1: daily-cached Supabase snapshot
            # (budget_funding + personnel; graceful-degradation fallback)
            git add kb/budget_snapshot.json 2>/dev/null || true
            # Word reports (Master + per-project minis) — regenerated by
            # generate_reports.js inside the pipeline run from the same
            # CPL_Data.js (incl. the live item_updates fold), and linked from
            # the dashboard (Master Report fallback + the 34 card Report
            # buttons). Committing them keeps those links current (they had
            # gone stale — 2026-07-02).
            git add reports/CPL_Master_Report.docx reports/projects/*.docx 2>/dev/null || true
            # COCI title-correction queue: raw course titles with encoding
            # artifacts, repaired for display (e:1 member chip) + queued here
            # so the source records can be fixed in COCI
            git add kb/coci_title_corrections.json 2>/dev/null || true
            # CustomReport_latest.json is intentionally NOT committed — it carries
            # student PII (names/DOB/IDs) + staff contacts. It is fetched fresh each
            # run (Step 1) and read by the generator at runtime; gitignored so it
            # never lands in this PUBLIC repo. Only aggregated artifacts are committed.
          }
          # `stage` above is the list, written once. Commit, then push. A push that fails is retried up to 5
          # attempts (fetch, rebase onto the new main, push again); a failure that is no conflict keeps that
          # retry. A rebase CONFLICT means another writer changed a file this run also built, and no side of it
          # is picked: the rebase is aborted and daily_rebuild runs, once. A clean rebase that changes a build
          # input rebuilds the same way (below). The rebuilt commit always gets a push attempt, even on the last
          # one. A second conflict, or a failed rebuild, exits 1 with nothing pushed, so the later rungs stay the
          # backstop. The run exits 0 only after a push lands, or when there is nothing to commit (main already
          # holds this build). tests/apply_concurrency_test.py runs this loop in a scratch repo;
          # DAILY_PUSH_BACKOFF is its one hook.
          #
          # daily_rebuild: reset the tree to the new origin/main, reinstall its requirements, and run ITS
          # scripts/daily_build.sh. The three fetches whose result is not derived from main are reused:
          # CustomReport_latest.json is untracked, so the reset keeps today's copy; the scrape's
          # live_metrics.json and the MIL/JST fetch's veteran_jst.json are put back from this run's commit,
          # unless another writer changed main's copy since the run checked out, and then that fetch runs
          # again. The scrape's /tmp files and its download go first, so a second pass never reads the first's.
          daily_rebuild() {   # called in an `if`, where -e is off: every command carries its own `|| return 1`
            local new base keep f var
            new=$(git rev-parse origin/main) || return 1
            base=$(git merge-base HEAD "$new") || return 1
            keep=$(mktemp -d) || return 1
            export DAILY_REUSE_CUSTOM_REPORT=1 DAILY_REUSE_SCRAPE= DAILY_REUSE_VETERAN=
            for f in live_metrics.json veteran_jst.json; do
              case "$f" in live_metrics.json) var=DAILY_REUSE_SCRAPE ;; *) var=DAILY_REUSE_VETERAN ;; esac
              if git diff --quiet "$base" "$new" -- "$f" && git cat-file -e "HEAD:$f" 2>/dev/null; then
                git show "HEAD:$f" > "$keep/$f" || return 1
                export "$var=1"
              else
                echo "main's $f changed since ${base:0:8}: its fetch runs again."
              fi
            done
            git reset --hard "$new" || return 1
            if [ "$DAILY_REUSE_SCRAPE" = 1 ]; then cp "$keep/live_metrics.json" live_metrics.json || return 1; fi
            if [ "$DAILY_REUSE_VETERAN" = 1 ]; then cp "$keep/veteran_jst.json" veteran_jst.json || return 1; fi
            rm -rf "$keep" /tmp/metrics_status /tmp/scrape_detail live_metrics_new.json
            pip install -r requirements.txt || return 1
            bash scripts/daily_build.sh || return 1
          }
          # A CLEAN rebase can still bring in a changed build input (say kb/unified_titles.json): the commit would
          # then carry outputs built from the old input and the run would end green (COBIx #3110 point 4, S643).
          # So a clean rebase that changes any path the build may read rebuilds too, once, by daily_rebuild. The
          # build's inputs cannot be listed from the code (its builders glob kb/, list .github/workflows and the
          # root, and load modules by path), so the list kept here is the other one: the prefixes no build
          # command reads. tests/apply_concurrency_test.py walks every file the build runs (its scripts, their
          # imports, the scripts they load or launch) and fails when one names a path under either, so a new
          # reader cannot slip past it. Every other path counts as an input, the run's own outputs included:
          # several are read again (kb/unified_titles.json, kpi_history.json, CPL_Dashboard.html).
          not_inputs="docs/ tests/"
          build_inputs_changed() {   # $1: the main the commit was built on. Prints each path since then that counts.
            local changed f p
            changed=$(git diff --name-only "$1" origin/main) || return 1
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              for p in $not_inputs; do case "$f" in "$p"*) continue 2 ;; esac; done
              printf '%s\n' "$f"
            done <<< "$changed"
          }
          echo "start=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          daily_rebuilt=0

          stage
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily dashboard update — $(date +%Y-%m-%d)"

          max=5
          attempt=1
          while [ "$attempt" -le "$max" ]; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed — rebasing onto origin/main and retrying."
            git fetch origin main
            # The run leaves UNSTAGED regenerated files (everything not in the git add list) in the tree, and
            # `git rebase` refuses with "You have unstaged changes" (the 2026-07-08 20:23 run died that way when
            # PR #698 merged mid-run). That output is disposable: discard it so the committed snapshot rebases.
            git checkout -- .
            pre=$(git rev-parse HEAD)
            if git rebase origin/main; then
              base=$(git merge-base "$pre" origin/main)
              inputs=$(build_inputs_changed "$base")
              if [ -z "$inputs" ]; then
                sleep $((attempt * ${DAILY_PUSH_BACKOFF:-2}))
                attempt=$((attempt + 1))
                continue
              fi
              n_in=$(printf '%s\n' "$inputs" | wc -l | tr -d ' ')
              first_in=${inputs%%$'\n'*}
              # The bound: one rebuild a run, whichever path asked for it. A changed input after it is pushed over,
              # as before this rule, with a warning: a red run there would publish nothing for the day.
              if [ "$daily_rebuilt" = 1 ]; then
                echo "::warning title=Daily input changed again::Main changed $n_in build input(s) again after the rebuild (first: $first_in). The one rebuild is spent: the rebuilt commit is pushed, and its outputs trail main until the next run."
                sleep $((attempt * ${DAILY_PUSH_BACKOFF:-2}))
                attempt=$((attempt + 1))
                continue
              fi
              git reset -q --hard "$pre"   # back to the run's commit, as an aborted rebase leaves it
              daily_rebuilt=1
              echo "::warning title=Daily push rebased over a changed input::Main changed $n_in build input(s) since ${base:0:8} with no conflict (first: $first_in). Rebuilding once on the new main ($(git rev-parse --short origin/main)), in this job."
              printf '%s\n' "$inputs" | sed -n '1,20s/^/  changed input: /p'
            else
              # A CONFLICT is a rebase stopped in progress with conflicted paths. A rebase can also fail with none
              # in progress (another writer committed a file this tree holds untracked: "untracked working tree
              # files would be overwritten"); that is a failure like any other push failure, and keeps the retry.
              conflict=0
              if git rev-parse -q --verify REBASE_HEAD >/dev/null && [ -n "$(git diff --name-only --diff-filter=U)" ]; then
                conflict=1
              fi
              git rebase --abort 2>/dev/null || true
              if [ "$conflict" != 1 ]; then
                echo "Rebase onto origin/main failed without a conflict on attempt $attempt; retrying."
                sleep $((attempt * ${DAILY_PUSH_BACKOFF:-2}))
                attempt=$((attempt + 1))
                continue
              fi
              if [ "$daily_rebuilt" = 1 ]; then
                echo "::error title=Daily push lost twice::A second rebase conflict, after the rebuild on the new main. Nothing is pushed; the later rungs of the ladder are the backstop."
                exit 1
              fi
              daily_rebuilt=1
              echo "::warning title=Daily push conflicted::Another writer changed a file this run built. Rebuilding once on the new main ($(git rev-parse --short origin/main)), in this job."
            fi
            if ! daily_rebuild; then
              echo "::error title=Daily rebuild failed::The rebuild on the new main failed. Nothing is pushed; the later rungs of the ladder are the backstop."
              exit 1
            fi
            stage
            if git diff --cached --quiet; then
              echo "The rebuild on the new main changed nothing: main already holds this build."
              exit 0
            fi
            git commit -m "Daily dashboard update — $(date +%Y-%m-%d) (rebuilt on $(git rev-parse --short origin/main))"
            # The rebuilt commit gets its push even when the conflict or the changed input came on the last attempt.
            if [ "$attempt" -eq "$max" ]; then max=$((max + 1)); fi
            attempt=$((attempt + 1))
          done
          echo "::error title=Daily push failed::Push failed after $max attempts. Nothing more is pushed; the later rungs of the ladder are the backstop."
          exit 1

      # ── Step 6b: SkyView description shards → Supabase Storage, after the push ──
      # SkyView shows a course's catalog description on click, from one JSON
      # shard per subject area in the PUBLIC bucket `ccr-desc` (50 MB of
      # derived text, gitignored — see kb/supabase_ccr_desc_bucket.sql and
      # scripts/publish_skyview_desc_shards.sh). The shards are cut AFTER the push lands, from the tree that
      # was pushed (unstaged leftovers discarded first), so storage never holds shards of a build the push
      # threw away, or of a corpus older than main (COBIx #3110 finding 8, S641). Republished when the pushed
      # tree's corpus differs from the main this run checked out (the commit step's `start`); skipped
      # otherwise, and never fatal — a stale description is not a broken dashboard. A failed push skips it.
      - name: Publish SkyView description shards (after the push, from the pushed tree)
        if: steps.recheck.outputs.run == 'true'
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DAILY_START: ${{ steps.push.outputs.start }}
        run: |
          if [ -z "${SUPABASE_SERVICE_KEY:-}" ]; then
            echo "SUPABASE_SERVICE_KEY not set — SkyView shards left as published."; exit 0; fi
          git checkout -- .
          if [ -n "${DAILY_START:-}" ] && git diff --quiet "$DAILY_START" HEAD -- unified_courses_member_desc.js \
                unified_courses_members.js unified_courses_data.js unified_courses_standalone.js; then
            echo "Unified-courses artifacts unchanged on main — SkyView shards left as published."; exit 0; fi
          ( python3 kb/_build_ccr_universe.py --shards-only && bash scripts/publish_skyview_desc_shards.sh ) \
            || echo "::warning title=SkyView shards not published::kb/_build_ccr_universe.py --shards-only or the storage upload failed — SkyView course descriptions may lag the corpus until the next run. Check the step log."

      - name: Summary
        if: steps.recheck.outputs.run == 'true'
        run: |
          echo "### CPL Dashboard Update — $(date +%Y-%m-%d)" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| CustomReport | $CUSTOM_REPORT_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Live metrics | $LIVE_METRICS_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dashboard URL | https://cpl-initiative.github.io/cpl-project-tracker/ |" >> "$GITHUB_STEP_SUMMARY"

      # Last step, after the push and the summary, so the dashboard still publishes on the
      # old figures (pages.yml deploys on any completion) and the run turns red. A red run
      # also means the day has no successful run, so the next cron on the ladder tries the
      # scrape again (the gate job stands down only after a success).
      - name: Fail the run on a stale scrape
        if: env.LIVE_METRICS_STATUS != 'success' && steps.recheck.outputs.run == 'true'
        run: |
          echo "::error title=Stale live metrics::The scrape failed (status: ${LIVE_METRICS_STATUS:-unset}); live_metrics.json kept its last good copy."
          echo "Scrape detail: ${SCRAPE_DETAIL:-none recorded}"
          exit 1
