name: First Light apply

# The First Light tab's Apply (S643; design #3153 comments 6826461825 and 6829695812). A signed-in reviewer marks
# paintings and photos in COBI's #first-light and presses Apply, which files a pending row in
# first_light_apply_requests. This workflow turns the marks into ONE pull request. Sam merges it; nothing here
# merges, approves or enables auto-merge.
#
#   look   (no checkout) one REST read of every pending request, then the highest mark id. An hourly run with none
#          pending ends here, in seconds. A table not yet in place (HTTP 404) reads as none; any other answer but
#          200 (a revoked key, a 5xx) fails the run, so workflow-failure-watch.yml reports it (COBIx #3110 comment
#          6837874586, finding 2). One run serves exactly the requests it read, and consumes only the marks up to
#          the id it read after them: a request filed later waits for the next run and gets its own stamp (finding 1).
#   apply  a sparse checkout of main. The tools are copied out of main first and always run from that copy, never
#          from the open pull request's branch. tools/first_light_apply.mjs reads the marks up to the look's id
#          through the tab's own resolver and writes the selection, the hero list (each with applied_through_mark_id, the highest mark it
#          consumed), the three views' copies of the list and the story photos (fetched here, as cpl-stories.yml
#          does); the manifest builder runs. The one pull request from the branch first-light-apply is opened, or,
#          while it is open, updated by a commit on its branch (so words a session wrote there stay) with the new
#          summary appended to its description. js-tests.yml is dispatched on the branch, since a push with the
#          built-in token starts no workflow and a dispatch does (COBIx finding 3, fix a). Each request row is
#          stamped with the pull request's link, or with the run when it fails.
#
# Credentials per step: the service key only where a step reads the marks or stamps a request, the token only
# where a step reads the pull requests, pushes, opens the pull request or dispatches. checkout keeps no token.
# No new credential: the built-in token and the SUPABASE_SERVICE_KEY secret other workflows already use.
on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'   # hourly; the look exits before any checkout when nothing is pending

permissions:
  contents: read

# One Apply at a time: a second request waits for the first run, then updates the same pull request.
concurrency:
  group: first-light-apply
  cancel-in-progress: false

env:
  SUPABASE_URL: https://hvuwhnbuahrtptokpqfh.supabase.co
  BRANCH: first-light-apply

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ids: ${{ steps.look.outputs.ids }}
      through: ${{ steps.look.outputs.through }}
    steps:
      - name: Which Applies are pending, and the marks through which id? (no checkout)
        id: look
        env:
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -uo pipefail
          body=$(curl -sS --max-time 20 -w '\n%{http_code}' \
            "$SUPABASE_URL/rest/v1/first_light_apply_requests?status=eq.pending&select=id&order=id.asc" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY")
          code=$(printf '%s' "$body" | tail -n1)
          if [ "$code" = "404" ]; then
            echo "::notice::the request table is not in place (HTTP 404); nothing to do, and a dispatch does nothing either until it is"
            { echo "ids="; echo "through="; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::error::the request table answered HTTP $code (a revoked or rotated key, or the service is down); no Apply can run"
            exit 1
          fi
          ids=$(printf '%s' "$body" | sed '$d' | jq -r '[.[].id | tostring] | join(",")') || { echo "::error::the request table's answer was not a list"; exit 1; }
          # The highest mark id, read AFTER the requests: every mark of a request read above was filed before it,
          # so it is at or below this id. The Plan consumes no mark above it.
          marks=$(curl -sS --max-time 20 -w '\n%{http_code}' \
            "$SUPABASE_URL/rest/v1/first_light_marks?select=id&order=id.desc&limit=1" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY")
          mcode=$(printf '%s' "$marks" | tail -n1)
          if [ "$mcode" != "200" ]; then
            echo "::error::the marks table answered HTTP $mcode; no Apply can run"
            exit 1
          fi
          through=$(printf '%s' "$marks" | sed '$d' | jq -r '(.[0].id // 0) | tostring') || through=
          case "$through" in ''|*[!0-9]*) echo "::error::the marks table gave no mark id"; exit 1 ;; esac
          echo "pending requests: ${ids:-none}; marks through id $through"
          { echo "ids=$ids"; echo "through=$through"; } >> "$GITHUB_OUTPUT"

  apply:
    needs: look
    # A look that read no mark id (the tables not in place: its 404 notice) runs nothing, a dispatch included.
    if: needs.look.outputs.through != '' && (needs.look.outputs.ids != '' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      REQ_IDS: ${{ needs.look.outputs.ids }}
      THROUGH: ${{ needs.look.outputs.through }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.html
            /*.css
            /first_light.js
            /first_light_tab.js
            /cpl_pathways.js
            /fact-sheet/
            /library/
            /sierra/
            /scripts/install_browser.sh
            /tools/build_first_light_manifest.mjs
            /tools/first_light_apply.mjs
            /tools/first_light_selection.json
            /tools/first_light_candidates.json
            /tools/first_light_gallery/index.json
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Every script and tool this job runs is copied here from main, before the open pull request's branch is
      # fetched, and runs from this copy on every run. Files from that branch are read as data only (JSON, the
      # manifest, the pages the Apply rewrites); nothing from it is executed.
      - name: Copy the tools out of main
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/main"
          mkdir -p "$T/tools" "$T/scripts"
          cp first_light_tab.js "$T/"
          cp tools/first_light_apply.mjs tools/build_first_light_manifest.mjs "$T/tools/"
          cp scripts/install_browser.sh "$T/scripts/"
          echo "TOOLS=$T" >> "$GITHUB_ENV"

      # A second Apply while the first pull request is open builds on that branch's files, so the words a session
      # wrote there are kept; with no open pull request the branch starts again from main.
      - name: Find the one open pull request
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # This repository's own branch only: the repository is public, so a fork's pull request can carry the same
          # branch name (COBIx #3110 comment 6837874586, finding 3).
          open=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number,url,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository == false)][0] // empty')
          if [ -n "$open" ]; then
            auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c http.extraheader="$auth" fetch -q --depth 20 origin "$BRANCH"
            git checkout -q -B "$BRANCH" FETCH_HEAD
            echo "number=$(jq -r .number <<<"$open")" >> "$GITHUB_OUTPUT"
            echo "url=$(jq -r .url <<<"$open")" >> "$GITHUB_OUTPUT"
            echo "building on the open pull request $(jq -r .url <<<"$open")"
          else
            git checkout -q -B "$BRANCH"
            echo "no open pull request; building from main"
          fi

      - name: Plan from the marks
        id: plan
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          case "$THROUGH" in ''|*[!0-9]*) echo "::error::the look read no mark id"; exit 1 ;; esac
          node "$TOOLS/tools/first_light_apply.mjs" --root "$GITHUB_WORKSPACE" --plan --through "$THROUGH" --out "$RUNNER_TEMP/plan.json" | tee "$RUNNER_TEMP/plan.out"
          echo "changed=$(jq -r .changed "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"
          echo "fetch=$(jq -r '.fetches | length' "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"
          echo "held=$(jq -r '.held | length' "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"

      # Holds no secret, and runs main's installer from the tools copy, outside the checkout.
      - name: Install a browser for MAP's story photos (only when one is added)
        if: steps.plan.outputs.changed == 'true' && steps.plan.outputs.fetch != '0'
        working-directory: ${{ runner.temp }}/main
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.47.2 >/dev/null 2>&1
          bash scripts/install_browser.sh node
          echo "FIRST_LIGHT_PLAYWRIGHT=$RUNNER_TEMP/main/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"

      - name: Write the files and rebuild the manifest
        if: steps.plan.outputs.changed == 'true'
        run: |
          set -euo pipefail
          node "$TOOLS/tools/first_light_apply.mjs" --root "$GITHUB_WORKSPACE" --apply --plan "$RUNNER_TEMP/plan.json" --body "$RUNNER_TEMP/body.md"
          node "$TOOLS/tools/build_first_light_manifest.mjs" --root "$GITHUB_WORKSPACE"

      - name: Push the branch and open or update the one pull request
        id: pr
        if: steps.plan.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OPEN_NUMBER: ${{ steps.open.outputs.number }}
          OPEN_URL: ${{ steps.open.outputs.url }}
        run: |
          set -euo pipefail
          git add -A tools/first_light_selection.json first_light.js library/photos cpl_pathways.js library/index.html library/adopt/index.html
          if git diff --cached --quiet; then echo "outcome=nothing" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -q -m "First Light: apply the tab's marks (requests ${REQ_IDS:-none, by dispatch})" -m "Opened by first-light-apply.yml from first_light_marks. Sam merges; nothing auto-merges."
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          if [ -n "$OPEN_NUMBER" ]; then
            git -c http.extraheader="$auth" push -q origin "HEAD:$BRANCH"
            # Append, so the description keeps every Apply the pull request carries.
            { gh pr view "$OPEN_NUMBER" -R "$GITHUB_REPOSITORY" --json body --jq .body
              printf '\n\n---\n\n**A later Apply** (%s, requests %s)\n\n' "$(date -u +%Y-%m-%dT%H:%MZ)" "${REQ_IDS:-none, by dispatch}"
              cat "$RUNNER_TEMP/body.md"; } > "$RUNNER_TEMP/body-all.md"
            gh pr edit "$OPEN_NUMBER" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body-all.md"
            num=$OPEN_NUMBER; url=$OPEN_URL
            echo "outcome=updated" >> "$GITHUB_OUTPUT"
          else
            # No open pull request: a branch left from a closed one is replaced.
            git -c http.extraheader="$auth" push -q --force origin "HEAD:$BRANCH"
            url=$(gh pr create -R "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "First Light: the tab's marks" --body-file "$RUNNER_TEMP/body.md")
            num=${url##*/}
            echo "outcome=opened" >> "$GITHUB_OUTPUT"
          fi
          echo "number=$num" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # The PR's `test` check: a push with the built-in token starts no workflow; a dispatch does.
          gh workflow run js-tests.yml -R "$GITHUB_REPOSITORY" --ref "$BRANCH"

      - name: Stamp the requests
        if: always() && env.REQ_IDS != ''
        env:
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OUTCOME: ${{ job.status != 'success' && 'failed' || (steps.plan.outputs.changed != 'true' && 'nothing') || steps.pr.outputs.outcome }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
          OPEN_NUMBER: ${{ steps.open.outputs.number }}
          OPEN_URL: ${{ steps.open.outputs.url }}
          HELD: ${{ steps.plan.outputs.held }}
        run: |
          set -euo pipefail
          case "$REQ_IDS" in *[!0-9,]*) echo "::error::unexpected request ids"; exit 1 ;; esac
          detail=""
          num=$PR_NUMBER url=$PR_URL
          [ "$OUTCOME" = failed ] && detail="the run failed; its log says why"
          # Nothing new. While a pull request is open, its branch already holds what the live marks ask for (an
          # earlier run consumed them), so the stamp always names it. A held mark (an item the Plan could not find)
          # is said in words beside it: a held mark stays live on every run, so letting it replace the link would
          # hide the open pull request for as long as the mark stays (COBIx, #3110, S646 UI pass).
          if [ "$OUTCOME" = nothing ] && [ -z "$num" ]; then
            case "${HELD:-0}" in ''|*[!0-9]*) HELD=0 ;; esac
            held_words=""
            if [ "$HELD" -gt 0 ]; then
              items="$HELD marked items"; [ "$HELD" = 1 ] && items="1 marked item"
              held_words="held: $items could not be applied (a painting not in the candidate pool, or a story photo missing from the stories file or sharing its name with another story)"
            fi
            if [ -n "$OPEN_NUMBER" ]; then
              num=$OPEN_NUMBER url=$OPEN_URL detail="the open pull request already carries these marks"
              [ -n "$held_words" ] && detail="$detail; $held_words"
            else
              detail="$held_words"
            fi
          fi
          row=$(jq -nc --arg s "${OUTCOME:-failed}" --arg n "$num" --arg u "$url" --arg r "$RUN_URL" --arg d "$detail" \
            '{status:$s, handled_at:(now|todate), run_url:$r} + (if $n != "" then {pr_number:($n|tonumber)} else {} end)
             + (if $u != "" then {pr_url:$u} else {} end) + (if $d != "" then {detail:$d} else {} end)')
          curl -sS --fail --max-time 20 -X PATCH "$SUPABASE_URL/rest/v1/first_light_apply_requests?id=in.($REQ_IDS)&status=eq.pending" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "$row"
          echo "requests $REQ_IDS stamped: $OUTCOME"
