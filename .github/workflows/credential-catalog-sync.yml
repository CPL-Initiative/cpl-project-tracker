name: Credential catalog sync (Sierra)

# Publishes the canonical credential layer into Supabase `chatbox_credentials`
# so Sierra can answer credential questions by NAME instead of by matching the
# raw freehand titles colleges typed into MAP.
#
# The gap this closes: asked "what colleges articulate POST?", Sierra matched the
# literal string and answered 20 colleges. The curated record folds 16 variants
# — including "Peace Officer Standardized Training Academy", which contains no
# "POST" — and knows 32 adopters.
#
# Reads the PUBLISHED credential_reference_data.js, which the daily dashboard run
# regenerates. That ordering matters: small-cell suppression is applied at
# generation, so students_served is suppression-inherited by construction.
# Idempotent upsert on unified_title — safe to re-run any time.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (parse + report, write nothing) or apply"
        required: true
        default: "apply"
        type: choice
        options: [apply, dry-run]

  # After the daily dashboard has rebuilt the artifact (it runs 06:17/09:17/12:17
  # UTC). 13:20 leaves the last window room to finish and push.
  schedule:
    - cron: "20 13 * * *"

concurrency:
  group: credential-catalog-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # No ref pin: the cron runs on main; a workflow_dispatch runs on the ref
      # it was dispatched against, which is what you want when testing a change.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync credential catalog
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'apply' }}"
          echo "mode: $MODE"
          if [ "$MODE" = "dry-run" ]; then
            python3 kb/_sync_credential_catalog.py --dry-run
          else
            python3 kb/_sync_credential_catalog.py
          fi

      # ── Credit recommendations (what the credential is WORTH) ───────────────
      # chatbox_credentials.ccc_rec is a single string, so Sierra could name one
      # course where POST Basic Academy actually carries ten (8 C-IDs + 2
      # electives). The full sets live in statewide_data.js and are already on
      # the public CPL Fact Sheet — this publishes them where Sierra can read.
      #
      # Runs AFTER the catalog step and in the same window, because the two
      # tables join on unified_title and a reader that finds a credential but
      # not its recommendation set is the exact gap being closed. Build is
      # local and deterministic (statewide_data.js is committed); the ~1.2MB
      # kb/credential_recs.json is gitignored and rebuilt here each run.
      - name: Sync credit recommendations
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'apply' }}"
          python3 kb/_build_credential_recs.py
          if [ "$MODE" = "dry-run" ]; then
            python3 kb/_sync_credential_recs.py --dry-run
          else
            python3 kb/_sync_credential_recs.py
          fi
