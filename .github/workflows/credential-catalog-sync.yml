name: Credential catalog sync (Sierra)

# Publishes the canonical credential layer into Supabase `chatbox_credentials`
# so Sierra can answer credential questions by NAME instead of by matching the
# raw freehand titles colleges typed into MAP.
#
# The gap this closes: asked "what colleges articulate POST?", Sierra matched the
# literal string and answered 20 colleges. The curated record folds 16 variants
# — including "Peace Officer Standardized Training Academy", which contains no
# "POST" — and knows 32 adopters.
#
# Reads the PUBLISHED credential_reference_data.js, which the daily dashboard run
# regenerates. That ordering matters: small-cell suppression is applied at
# generation, so students_served is suppression-inherited by construction.
# Idempotent upsert on unified_title — safe to re-run any time.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (parse + report, write nothing) or apply"
        required: true
        default: "apply"
        type: choice
        options: [apply, dry-run]

  # After the daily dashboard has rebuilt the artifact (it runs 06:17/09:17/12:17
  # UTC). 13:20 leaves the last window room to finish and push.
  schedule:
    - cron: "20 13 * * *"

concurrency:
  group: credential-catalog-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # No ref pin: the cron runs on main; a workflow_dispatch runs on the ref
      # it was dispatched against, which is what you want when testing a change.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync credential catalog
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'apply' }}"
          echo "mode: $MODE"
          if [ "$MODE" = "dry-run" ]; then
            python3 kb/_sync_credential_catalog.py --dry-run
          else
            python3 kb/_sync_credential_catalog.py
          fi

      # ── Credit recommendations (what the credential is WORTH) ───────────────
      # chatbox_credentials.ccc_rec is a single string, so Sierra could name one
      # course where POST Basic Academy actually carries ten (8 C-IDs + 2
      # electives). The full sets live in statewide_data.js and are already on
      # the public CPL Fact Sheet — this publishes them where Sierra can read.
      #
      # Runs AFTER the catalog step and in the same window, because the two
      # tables join on unified_title and a reader that finds a credential but
      # not its recommendation set is the exact gap being closed. Build is
      # local and deterministic (statewide_data.js is committed); the ~1.2MB
      # kb/credential_recs.json is gitignored and rebuilt here each run.
      - name: Sync credit recommendations
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'apply' }}"
          python3 kb/_build_credential_recs.py
          if [ "$MODE" = "dry-run" ]; then
            python3 kb/_sync_credential_recs.py --dry-run
          else
            python3 kb/_sync_credential_recs.py
          fi

      # ── Peer articulations (how OTHER colleges did it) ──────────────────────
      # Sam, 2026-08-13: when Sierra answers for a college she should recommend
      # that college's most aligned courses AND give access to the other college
      # articulations for the same certificate. This publishes the second half,
      # and it goes first because it is a FACT (looked up, no matching) whereas
      # the alignment ranking is a proposal.
      #
      # Joins two sources because neither has both halves: coci_articulations.json
      # has the credit recommendations but no college attribution on its local
      # courses, while credential_reference_data.js has per-course colleges but no
      # recommendation. Every row carries `attribution` — 'per_course' when the
      # course's college list is its own, 'group_wide' when the articulation
      # repeated one identical list onto every course and we therefore know WHICH
      # colleges and WHICH courses but not which used which.
      #
      # Runs after the recs step and in the same window: the three tables join on
      # unified_title and a reader that finds a credential but not its peers is
      # the gap being closed. The ~2 MB payload is gitignored and rebuilt here.
      - name: Sync peer articulations
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'apply' }}"
          python3 kb/_build_peer_articulations.py
          if [ "$MODE" = "dry-run" ]; then
            python3 kb/_sync_peer_articulations.py --dry-run
          else
            python3 kb/_sync_peer_articulations.py
          fi

      # ── Per-college course catalogue (what each college TEACHES) ────────────
      # The other half of the alignment layer: to tell a college which of ITS OWN
      # courses to articulate against a credit recommendation, you need that
      # college's course TITLES, and nothing in Supabase had them.
      # coci_college_offerings is a TOP-aggregated rollup capped at 900 chars of
      # titles_text and 8 sample courses, so Cerritos Welding shows 8 of 121
      # courses and WELD 214L — the right answer — never appears.
      #
      # ~141,700 rows from the committed 25 MB COCI extract. Needs openpyxl,
      # which the earlier steps do not. Static source, so this only changes on a
      # fresh COCI extract, but it is cheap and idempotent to re-run.
      - name: Sync per-college course catalogue
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'apply' }}"
          pip install --quiet openpyxl
          python3 kb/_build_college_courses.py
          if [ "$MODE" = "dry-run" ]; then
            python3 kb/_sync_college_courses.py --dry-run
          else
            python3 kb/_sync_college_courses.py
          fi
