name: Credential family apply

# Manual dispatch only. Writes the credential family tags into kb_curation (Sam, 2026-11-11, cpl_memory
# sam-bundle-family-is-a-field-2026-11-11: each ASE bundle stays its own title and gains
# credential_family = ASE Certificate Bundles; his saved folds are read as family tags, never as folds).
# kb/_family_tag_apply.py reads live at dispatch and decides through kb/_family_tag_plan.py:
#   dry-run   reads, reports each title (write, written, held, conflict) and the count to commit with;
#   commit    reads again and inserts under credential-family-s638@bot only while the live set still
#             gives `expect` tags and no conflict; Sam's fold rows are never edited or deleted;
#   rollback  removes the rows this cohort wrote, from its receipts.
# Receipts land in kb/receipts/credential_family_2026-11-11_s638/ and are pushed to main.
# Governance: DR-07 (unified credential titles), kb/governance_surface_map.json.
#
# concurrency: daily-dashboard -> serializes against the daily cron, which reads kb_curation and
# carries the family onto kb/credentials.json (kb/_apply_credential_review.py promote_families).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run reads and reports; commit writes; rollback removes this cohort's rows"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, commit, rollback]
      expect:
        description: "commit only: the tag count the dry run printed (to write plus already written)"
        required: false
        default: ""
        type: string

concurrency:
  group: daily-dashboard
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run the applier
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODE: ${{ inputs.mode }}
          EXPECT: ${{ inputs.expect }}
        run: |
          set -euo pipefail
          case "$MODE" in
            dry-run)  python kb/_family_tag_apply.py | tee -a "$GITHUB_STEP_SUMMARY" ;;
            commit)
              case "$EXPECT" in
                ''|*[!0-9]*) echo "::error::commit needs expect: the tag count the dry run printed"; exit 1 ;;
              esac
              python kb/_family_tag_apply.py --commit "$EXPECT" | tee -a "$GITHUB_STEP_SUMMARY" ;;
            rollback) python kb/_family_tag_apply.py --rollback | tee -a "$GITHUB_STEP_SUMMARY" ;;
          esac

      # always(): a write refused after its receipt still wrote one, and a receipt that never
      # reaches main cannot roll anything back.
      - name: Commit the receipt
        if: ${{ always() && inputs.mode != 'dry-run' }}
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          DIR=kb/receipts/credential_family_2026-11-11_s638
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DIR"
          if git diff --cached --quiet; then echo "No receipt to commit."; exit 0; fi
          git commit -m "Credential family apply ($MODE): receipt in $DIR"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          exit 1
