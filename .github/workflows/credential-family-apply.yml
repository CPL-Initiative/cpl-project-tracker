name: Credential family apply

# Manual dispatch only. Writes the credential family tags into kb_curation (Sam, 2026-11-11, cpl_memory
# sam-bundle-family-is-a-field-2026-11-11: each ASE bundle stays its own title and gains
# credential_family = ASE Certificate Bundles; his saved folds are read as family tags, never as folds).
# kb/_family_tag_apply.py reads live at dispatch and decides through kb/_family_tag_plan.py:
#   dry-run   reads, reports each title (write, written, held, conflict) and the set hash to commit with;
#   commit    reads again; while the live set is still `expect` (the hash, never a count) and no title
#             conflicts, writes the pending receipt and PUSHES it to main; then reads again, inserts under
#             credential-family-s638@bot, files each row by a live read-back and pushes the settled
#             receipt. Sam's fold rows are never edited or deleted;
#   rollback  removes the rows this cohort's receipts planned (pending ones included), each delete guarded
#             by cohort, field and value; a row a person has changed since is left and reported.
# Receipts land in kb/receipts/credential_family_2026-11-11_s638/ and are pushed to main.
# Governance: DR-07 (unified credential titles), kb/governance_surface_map.json.
#
# concurrency: daily-dashboard -> serializes against the daily cron, which reads kb_curation and
# carries the family onto kb/credentials.json (kb/_apply_credential_review.py promote_families).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run reads and reports; commit writes; rollback removes this cohort's rows"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, commit, rollback]
      expect:
        description: "commit only: the set hash the dry run printed (commit with expect=...)"
        required: false
        default: ""
        type: string

concurrency:
  group: daily-dashboard
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Dry run
        if: ${{ inputs.mode == 'dry-run' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          python kb/_family_tag_apply.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prepare the pending receipt
        if: ${{ inputs.mode == 'commit' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EXPECT: ${{ inputs.expect }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$EXPECT" | grep -Eq '^[0-9a-f]{12}$'; then
            echo "::error::commit needs expect: the set hash the dry run printed"; exit 1
          fi
          python kb/_family_tag_apply.py --prepare "$EXPECT" | tee -a "$GITHUB_STEP_SUMMARY"

      # The pending receipt (planned rows, cohort, expected set) reaches main BEFORE any row is
      # inserted; when this push fails, the insert step does not run.
      - name: Push the pending receipt
        if: ${{ inputs.mode == 'commit' }}
        env:
          MODE: ${{ inputs.mode }}
          STAGE: pending
        run: |
          set -euo pipefail
          DIR=kb/receipts/credential_family_2026-11-11_s638
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DIR"
          if ! git diff --cached --quiet; then git commit -m "Credential family apply ($MODE, $STAGE): receipt in $DIR"; fi
          git fetch origin main
          if [ "$(git rev-list --count origin/main..HEAD)" = 0 ]; then echo "No receipt to push."; exit 0; fi
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          exit 1

      - name: Insert and read back
        if: ${{ inputs.mode == 'commit' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EXPECT: ${{ inputs.expect }}
        run: |
          set -euo pipefail
          python kb/_family_tag_apply.py --commit "$EXPECT" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Roll back
        if: ${{ inputs.mode == 'rollback' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          python kb/_family_tag_apply.py --rollback | tee -a "$GITHUB_STEP_SUMMARY"

      # always(): a failed, refused or cancelled step still settled its receipt, and a receipt that
      # never reaches main cannot roll anything back. A failed push here leaves the pending one on main.
      - name: Push the receipt
        if: ${{ always() && inputs.mode != 'dry-run' }}
        env:
          MODE: ${{ inputs.mode }}
          STAGE: final
        run: |
          set -euo pipefail
          DIR=kb/receipts/credential_family_2026-11-11_s638
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DIR"
          if ! git diff --cached --quiet; then git commit -m "Credential family apply ($MODE, $STAGE): receipt in $DIR"; fi
          git fetch origin main
          if [ "$(git rev-list --count origin/main..HEAD)" = 0 ]; then echo "No receipt to push."; exit 0; fi
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          exit 1
