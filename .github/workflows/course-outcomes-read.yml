name: Course outcomes read
# Each course's SLOs, exactly as printed, from its public course outline (Sam, Open
# Asks Sheet 70 card 3, 2026-10-12: "Every course in the loaded records").
# kb/_course_outcomes_read.py reads pages only and writes no table; it files
# kb/course_outcomes/..., which this job commits back to the branch that ran it.
# Runs when a claude/** push changes kb/course_outcomes/.run to something main
# does not hold (the gate job), never on a merge commit (a merge of main carries
# that file's change too). The slices run one at a time, so one reader is on the
# college's host at once.
on:
  push:
    branches: ['claude/**']
    paths:
      - 'kb/course_outcomes/.run'

permissions:
  contents: write

concurrency:
  group: course-outcomes-read-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    # Runs the work only when the pushed trigger file differs from main's. A merge of
    # main carries every trigger file main holds, and a push after it (not only the
    # merge commit) starts this workflow (S376: a display push on a branch that had
    # merged main re-ran the SDCCD index; here it would re-run a read of hours, or a
    # load). To run the same file again, change a line in it.
    if: github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'Merge')
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.diff.outputs.go }}
    steps:
      - uses: actions/checkout@v7
      - id: diff
        run: |
          git fetch -q --depth=1 origin main
          if git diff --quiet FETCH_HEAD -- kb/course_outcomes/.run; then
            echo "go=0" >> "$GITHUB_OUTPUT"; echo "kb/course_outcomes/.run matches main's: nothing to run."
          else
            echo "go=1" >> "$GITHUB_OUTPUT"
          fi

  plan:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.p.outputs.mode }}
      parts: ${{ steps.p.outputs.parts }}
    steps:
      - uses: actions/checkout@v7
      - id: p
        run: |
          trial=$(sed -n 's/^trial=//p' kb/course_outcomes/.run)
          parts=$(sed -n 's/^parts=//p' kb/course_outcomes/.run)
          if [ -n "$trial" ]; then echo "mode=trial" >> "$GITHUB_OUTPUT"; echo "parts=[1]" >> "$GITHUB_OUTPUT"
          else n=${parts:-1}; echo "mode=read" >> "$GITHUB_OUTPUT"
               echo "parts=$(python3 -c "import json;print(json.dumps(list(range(1,$n+1))))")" >> "$GITHUB_OUTPUT"; fi

  read:
    needs: [gate, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Playwright + Chromium
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Read
        env:
          CENSUS_DELAY_MS: '3000'
        run: |
          index=$(sed -n 's/^index=//p' kb/course_outcomes/.run)
          slugs=$(sed -n 's/^slugs=//p' kb/course_outcomes/.run)
          trial=$(sed -n 's/^trial=//p' kb/course_outcomes/.run)
          parts=$(sed -n 's/^parts=//p' kb/course_outcomes/.run)
          args=(--index "$index")
          [ -n "$slugs" ] && args+=(--slugs "$slugs")
          if [ "${{ needs.plan.outputs.mode }}" = trial ]; then args+=(--trial "$trial")
          else args+=(--part "${{ matrix.part }}" --of "${parts:-1}"); fi
          python3 kb/_course_outcomes_read.py "${args[@]}"

      - name: Keep the slice's files as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: course-outcomes-${{ github.run_id }}-part${{ matrix.part }}
          path: kb/course_outcomes/
          retention-days: 30

      - name: Commit the result to this branch
        if: always()
        # Lands the slice's new files on the branch's current tip without its
        # history: the checkout is one commit deep, and a pull --rebase across a
        # merge of main fetched main's whole history (S374, slice 1: five minutes).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=$(git ls-files --others --modified --exclude-standard kb/course_outcomes/)
          if [ -z "$changed" ]; then echo "Nothing new."; exit 0; fi
          tar -czf "$RUNNER_TEMP/slice.tgz" $changed
          for i in 1 2 3 4; do
            git fetch -q --depth=1 origin ${{ github.ref_name }} &&
            git checkout -q -f -B land FETCH_HEAD &&
            tar -xzf "$RUNNER_TEMP/slice.tgz" &&
            git add kb/course_outcomes/ &&
            { git diff --cached --quiet || git commit -q -m "Course outcomes read (run ${{ github.run_id }}, part ${{ matrix.part }})"; } &&
            git push origin HEAD:${{ github.ref_name }} && exit 0
            sleep $((i * 5))
          done
          exit 1
