name: "Secret scan"

# Pre-merge secret-detection scan via TruffleHog. Catches accidentally-
# committed credentials before they land on main. Free for org repos (the
# gitleaks-action started requiring a paid license for orgs in v8.20+, so
# we switched).
#
# `--results=verified` runs each candidate finding through a live-verification
# check against the issuing service — so the embedded Supabase ANON keys
# in unified_courses.js / canonical_subj4.js / pipeline.js (public by
# design, gated by Row-Level Security) won't false-positive: they're real
# JWTs that fail the "is this an active write-privileged secret?" check.
# (The older `--only-verified` flag was deprecated; using the recommended
# form from the trufflesecurity/trufflehog README.)
#
# Defense-in-depth alongside GitHub's built-in secret scanning + push
# protection (free for public repos, runs on push not pre-merge).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Same reasoning as js-tests.yml: this fires 1:1 with it (220 runs each in the
# month measured 2026-09-06) and a superseded run scans a commit nobody will
# merge. Keyed to the pull request so only superseded runs are cancelled; a push
# to main keys on the SHA and always finishes, because main is what a leaked
# credential would actually be published from.
#
# ⚠️ The fetch below stays FULL. Narrowing it would save ~60s of the ~75s spent
# fetching refs, and it would risk leaving BASE unreachable — at which point
# this scans nothing and reports green, which is worse than slow. Measured
# 2026-09-06: the scan itself is already diff-only (45 chunks, 66 KB for a
# 31-file PR); the time is ref-fetching plus ~88s of TruffleHog detector
# startup inside the action, neither of which is the scan depth.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so PR diff scans cover every commit, not just the tip.
          fetch-depth: 0

      - name: Scan for verified secrets
        # @main per the trufflesecurity/trufflehog README. (Tried pinning
        # to v3.82.13 — that tag doesn't exist; latest is v3.95.x. Dependabot
        # can still bump @main weekly.)
        uses: trufflesecurity/trufflehog@main
        with:
          # Matches the README's recommended config verbatim. On
          # pull_request the action scans base..head; on push it scans the
          # commits in the push.
          extra_args: --results=verified,unknown
