name: ESL sheet apply

# Manual dispatch only. Carries an ESL decision sheet's verdicts into kb_curation from the committed
# plan (kb/esl_sheet_out/<date>/plan.json, built by kb/_esl_sheet_apply_build.py): dry-run reads and
# reports, commit writes, rollback undoes from the receipts. Sam, 2026-09-27: "It's not feasible for
# me to run one-off procedures like this..." so a session dispatches this after his verdict instead
# of handing him SQL. The applier re-checks every row at write time (Rule 10); receipts land in the
# plan dir and are pushed to main.
#
# concurrency: daily-dashboard -> serializes against the daily cron, which reads kb_curation.

on:
  workflow_dispatch:
    inputs:
      plan_dir:
        description: "Plan directory, e.g. kb/esl_sheet_out/2026-09-26, or a monthly pass's kb/esl_sheet_out/2026-10-27-monthly"
        required: true
        type: string
      mode:
        description: "dry-run reads and reports; commit writes; rollback undoes the receipts"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, commit, rollback]

concurrency:
  group: daily-dashboard
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run the applier
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PLAN_DIR: ${{ inputs.plan_dir }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "$PLAN_DIR" in
            kb/esl_sheet_out/20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            kb/esl_sheet_out/20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]-monthly) ;;
            *) echo "::error::plan_dir must be kb/esl_sheet_out/<YYYY-MM-DD> or kb/esl_sheet_out/<YYYY-MM-DD>-monthly"; exit 1 ;;
          esac
          test -f "$PLAN_DIR/plan.json"
          case "$MODE" in
            dry-run)  python kb/_esl_sheet_apply.py "$PLAN_DIR" | tee -a "$GITHUB_STEP_SUMMARY" ;;
            commit)   python kb/_esl_sheet_apply.py "$PLAN_DIR" --commit | tee -a "$GITHUB_STEP_SUMMARY" ;;
            rollback) python kb/_esl_sheet_apply.py "$PLAN_DIR" --rollback | tee -a "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: Commit the receipt
        if: ${{ inputs.mode != 'dry-run' }}
        env:
          PLAN_DIR: ${{ inputs.plan_dir }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$PLAN_DIR"
          if git diff --cached --quiet; then echo "No receipt to commit."; exit 0; fi
          git commit -m "ESL sheet apply ($MODE): receipt for $PLAN_DIR"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          exit 1
