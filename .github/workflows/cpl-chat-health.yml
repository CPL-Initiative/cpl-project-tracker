name: Sierra health (hourly uptime probe)

# ONE question an hour against the live cpl-chat Edge Function, so an outage is
# found by a monitor instead of by a session that happens to look.
#
# THE GAP THIS CLOSES. cpl-chat-smoke.yml and sierra-preflight.yml both fire only
# on dispatch or push — neither is scheduled, and no other workflow probes the
# function. The Anthropic credit balance behind Sierra ran dry on 2026-08-21 and
# again on 2026-08-22, taking every Sierra surface down both times, and both were
# noticed hours later by chance.
#
# COST, AND WHY THE CADENCE IS 3-HOURLY RATHER THAN HOURLY. One model call per
# run, not the ~16 of the smoke suite — that was the explicit trade in the To-Do
# feed ("the cheap option is an alert when the assistant starts returning errors;
# the expensive one is running her test suite every hour, which costs real money
# every run"). But "one call" is not "free": the probe asks a GENERAL question
# (the cheapest mode — fewest context builders fire), and even that carries the
# always-on rule bodies, so a run is roughly 6-10K input tokens plus a short
# answer. At Sonnet 4.6 rates that is ~$0.03 a run:
#
#     hourly    ~$0.72/day   ~$22/month
#     3-hourly  ~$0.24/day   ~$7/month     <- shipped
#
# Sierra is on Sam's PERSONAL Anthropic funding until the corporate account is
# set up (2026-08-23), so this ships at the cadence that costs him least while
# still catching an outage the same day. RAISE IT TO HOURLY once billing moves
# to the corporate account — an outage window of up to three hours on a
# student-facing tool is a deliberate compromise, not a target.
#
# The far bigger cost lever is not this workflow: cpl-chat uses NO prompt
# caching, and ~7,000 tokens of stable rule text ride on EVERY turn.
#
# WHAT IT DOES NOT DO. It asserts nothing about the CONTENT of the answer — no
# college names, no figures, no prose greps. Capability regressions are the smoke
# suite's job. This one answers "is she answering at all?", which is the question
# a student's failed visit actually poses.

on:
  schedule:
    # Every 3 hours at :07 — off the :00 rush and clear of the daily crons at
    # :17/:20/:40. See the COST note above before changing this.
    - cron: '7 */3 * * *'
  workflow_dispatch:
  # Self-test: a push that touches the probe or this file runs it once, so a
  # broken monitor is found by the change that broke it rather than by the
  # outage it then fails to report.
  push:
    paths:
      - chatbox/health_check.sh
      - .github/workflows/cpl-chat-health.yml

concurrency:
  group: cpl-chat-health
  cancel-in-progress: false

permissions:
  contents: read
  issues: write        # to raise / close the outage issue

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # TWO attempts, 60s apart, before declaring an outage. A single transient
      # 502 must not page anyone — an alert that cries wolf gets muted, and a
      # muted alert is the state we are already in.
      - name: Probe Sierra
        id: probe
        run: |
          if bash chatbox/health_check.sh; then exit 0; fi
          echo "::warning::first probe failed — retrying in 60s before declaring an outage"
          sleep 60
          bash chatbox/health_check.sh
        continue-on-error: true

      - name: Raise or update the outage issue
        if: steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.probe.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Sierra is down — cpl-chat is not answering"
          BODY=$(printf '%s\n' \
            "The hourly health probe could not get an answer out of the live \`cpl-chat\` function — twice, 60 seconds apart." \
            "" \
            "**Reason:** ${REASON:-(no reason captured)}" \
            "" \
            "**Probe run:** ${RUN_URL}" \
            "" \
            "Every Sierra surface is affected at once: the public page, the COBI tab, the Fact Sheet drawer, map.rccd.edu, the college landing pages and the vendor iframe." \
            "" \
            "This issue closes itself on the next successful probe." \
            "" \
            "---" \
            "_Generated by [Claude Code](https://claude.ai/code)_")
          # Reuse the open issue if there is one, so an outage is ONE thread and
          # not one issue an hour.
          NUM=$(gh issue list --label sierra-outage --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            echo "Outage issue #$NUM already open — adding a heartbeat comment."
            gh issue comment "$NUM" --body "$BODY"
          else
            gh label create sierra-outage --color B60205 --description "Sierra (cpl-chat) is not answering" 2>/dev/null || true
            gh issue create --title "$TITLE" --label sierra-outage --body "$BODY"
          fi

      - name: Close the outage issue on recovery
        if: steps.probe.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          NUM=$(gh issue list --label sierra-outage --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "$(printf '%s\n' \
              "Sierra is answering again — recovered as of this probe." \
              "" \
              "**Probe run:** ${RUN_URL}" \
              "" \
              "---" \
              "_Generated by [Claude Code](https://claude.ai/code)_")"
          else
            echo "Sierra is up and no outage issue is open — nothing to do."
          fi

      # The probe step is continue-on-error so the issue steps can run; fail the
      # RUN afterwards so the workflow's own status tells the truth.
      - name: Fail the run if Sierra is down
        if: steps.probe.outcome == 'failure'
        run: |
          echo "::error::Sierra is DOWN — ${{ steps.probe.outputs.reason }}"
          exit 1
