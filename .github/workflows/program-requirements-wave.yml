name: Program requirements, a wave of colleges

# The program requirements harvest, several colleges in one dispatch (S644;
# docs/program_requirements_harvest_lessons.md, "Running a wave"). Each college
# is read by kb/_program_requirements_college.py, step by step, as
# program-requirements-college.yml reads one; kb/_program_requirements_wave.py
# plans, prices, verifies and files around it. No reading logic lives here.
#
#   plan   validates the dispatch (at most 8 colleges, each in
#          program_source_registry by an anon read, none named twice, no two on
#          one catalog host, limit_usd at most Sam's standing $40, the branch
#          claude/harvest-wave-<wave>, never main) and emits the matrix.
#   read   one job a college, pushing nothing: capture (free in model calls), a
#          price (would_extract x the college's cost_per_program from its
#          committed summary, 0.08 when none, plus 25%), the extraction only when
#          extract is 1, the capture answered 90% of its pages and the price is
#          within the limit (it SPENDS MODEL CALLS), the file step into the job's
#          checkout, then a verify against main's filed records. Uploads the
#          college's folder and its verify row.
#   file   one job: copies every college's folder into the branch and writes
#          kb/program_requirements_wave/<wave>.json and .md, one commit, one push.
#
# Version 1 writes no table: the load, reread and display stay the college
# workflow's dispatches (step=reread college=X on the wave branch), which the
# conductor runs for each ready college after reading the one table.
# kb/governance_surface_map.json dismisses this workflow with its reason.

on:
  workflow_dispatch:
    inputs:
      colleges:
        description: "Colleges, comma-separated, as program_source_registry names them (at most 8, distinct catalog hosts)"
        required: true
      extract:
        description: "0 = capture and price only (free); 1 = also extract where the price is within the limit (spends model calls)"
        required: false
        default: "0"
      limit_usd:
        description: "The most a college's extraction may cost, on the estimate (at most 40, Sam's standing limit)"
        required: false
        default: "40"
      wave:
        description: "The wave's short name; dispatch on claude/harvest-wave-<wave>"
        required: true

concurrency:
  group: program-requirements-wave-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Plan the wave (names, hosts, limit, branch)
        id: plan
        env:
          COLLEGES: ${{ github.event.inputs.colleges }}
          EXTRACT: ${{ github.event.inputs.extract }}
          LIMIT_USD: ${{ github.event.inputs.limit_usd }}
          WAVE: ${{ github.event.inputs.wave }}
          REF_NAME: ${{ github.ref_name }}
        run: >-
          python3 kb/_program_requirements_wave.py plan --colleges "$COLLEGES" --extract "$EXTRACT"
          --limit-usd "$LIMIT_USD" --wave "$WAVE" --ref "$REF_NAME"

  read:
    needs: plan
    name: read ${{ matrix.college }}
    runs-on: ubuntu-latest
    # A hosted runner's limit, as the college workflow's read job.
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      COLLEGE: ${{ matrix.college }}
      SLUG: ${{ matrix.slug }}
      EXTRACT: ${{ github.event.inputs.extract }}
      LIMIT_USD: ${{ github.event.inputs.limit_usd }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch main, the baseline the verify compares with
        run: git fetch --depth 1 origin main:refs/remotes/origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright + Chromium, pypdf, pdfminer
        run: |
          pip install --quiet playwright pypdf pdfminer.six
          bash scripts/install_browser.sh
      - name: Pin a hand-filed copy's hash (kb/hand_filed_catalogs/; a no-op without a record)
        run: python3 kb/_program_requirements_college.py pin --college "$COLLEGE"
      - name: Capture
        id: capture
        env:
          CENSUS_DELAY_MS: '4000'
        run: python3 kb/_program_requirements_college.py capture --college "$COLLEGE" --out out --limit 0
      - name: Price the extraction
        id: price
        run: python3 kb/_program_requirements_wave.py price --college "$COLLEGE" --out out --extract "$EXTRACT" --limit-usd "$LIMIT_USD"
      - name: Extract and score
        id: extract
        if: steps.price.outputs.go == 'true'
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 kb/_program_requirements_college.py extract --college "$COLLEGE" --out out --workers 6 --force ""
      - name: File the run into this job's checkout
        id: file
        # Records already paid for are filed even when the extraction stopped partway.
        if: always() && steps.capture.outcome == 'success'
        run: python3 kb/_program_requirements_college.py file --college "$COLLEGE" --out out
      - name: Verify against main's filed records
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          EXTRACT_OUTCOME: ${{ steps.extract.outcome }}
          FILE_OUTCOME: ${{ steps.file.outcome }}
        run: >-
          python3 kb/_program_requirements_wave.py verify --college "$COLLEGE" --out out --baseline-ref origin/main
          --capture-outcome "$CAPTURE_OUTCOME" --extract-outcome "$EXTRACT_OUTCOME" --file-outcome "$FILE_OUTCOME"
          --write "wave_out/$SLUG.wave.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wave-filed-${{ github.run_id }}-${{ matrix.slug }}
          path: |
            wave_out/${{ matrix.slug }}.wave.json
            kb/program_requirements_college/${{ matrix.slug }}
            kb/hand_filed_catalogs/${{ matrix.slug }}.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: program-requirements-${{ github.run_id }}-${{ matrix.slug }}
          path: out
          retention-days: 90

  file:
    needs: [plan, read]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        # A college whose job uploaded nothing is a row "failed: no result", never a stopped filing.
        continue-on-error: true
        with:
          pattern: wave-filed-${{ github.run_id }}-*
          path: wave_artifacts
      - name: File every college and the wave's table
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          EXTRACT: ${{ github.event.inputs.extract }}
          LIMIT_USD: ${{ github.event.inputs.limit_usd }}
          WAVE: ${{ github.event.inputs.wave }}
        run: >-
          python3 kb/_program_requirements_wave.py file --wave "$WAVE" --artifacts wave_artifacts
          --matrix "$MATRIX" --extract "$EXTRACT" --limit-usd "$LIMIT_USD"
      - name: Commit to the wave branch, once
        env:
          WAVE: ${{ github.event.inputs.wave }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kb/program_requirements_college kb/hand_filed_catalogs kb/program_requirements_wave
          if git diff --cached --quiet; then echo "nothing to file"; exit 0; fi
          git commit -m "File the program requirements wave $WAVE (run ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5)); git pull --rebase origin "${{ github.ref_name }}"
          done
          exit 1
