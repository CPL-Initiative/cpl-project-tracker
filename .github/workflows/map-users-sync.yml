name: MAP Users sync (gated, PII-safe)

# Syncs MAP "College Users & Roles" (View_CollegeUsersRoles_APIDataset, ~2,741
# staff rows) into the GATED Supabase table public.map_college_users, which the
# COBI "MAP Users" tab reads (aggregates public; the roster reviewer-gated).
#
# WHY A RUNNER: the Azure MAP Custom Report API is egress-blocked from the agent
# sandbox (runner-as-proxy, like cpl-landing-pages.yml). The view is reachable
# unauthenticated with an explicit column list — no MAP credential needed; the
# write uses the Supabase SERVICE KEY through the transactional map_users_replace
# RPC.
#
# PII-SAFE: map/sync_map_users.py prints only counts + the non-PII RoleName mix,
# writes nothing to disk, and commits nothing. Staff names/emails exist ONLY in
# the gated Supabase table — never in the repo or an Actions artifact.
#
# Triggers (NO push trigger — this fetches PII, so it runs only on demand / cron):
#   - workflow_dispatch → dry-run by default; set apply=true to write.
#   - schedule (DAILY, see the cron block) → --apply, to keep the roster fresh.
#     ⚠ This line said "monthly" until 2026-09-11, a year after the cron itself
#     moved to daily — the schedule and its own description had disagreed since.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write the roster to map_college_users (service key)'
        type: boolean
        default: false
  schedule:
    # DAILY (Sam, 2026-08-13). Was monthly, on the reasoning that "the roster
    # changes slowly" — true of the roster, and irrelevant once Sierra started
    # reading these contacts live (cpl-chat v45). A stale roster no longer costs
    # a stale COUNT on a tab; it costs a STUDENT THE WRONG PERSON TO EMAIL. And
    # the MAP team is actively filling in the missing users right now, so a
    # monthly cadence would have hidden their work until 1 September.
    - cron: '0 13 * * *'   # every day, 13:00 UTC

permissions:
  contents: read
  issues: write        # the identity lint raises / closes its own finding issue

concurrency:
  group: map-users-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Sync MAP users (apply on schedule / dispatch-apply)
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          APPLY=""
          if [ "${{ github.event_name }}" = "schedule" ]; then APPLY="--apply"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.apply }}" = "true" ]; then APPLY="--apply"; fi
          echo "event=${{ github.event_name }} apply='${APPLY:-(dry-run)}'"
          python3 map/sync_map_users.py $APPLY

      # ── The college-identity lint, against the names we just pulled ──────────
      # Sam, 2026-09-11: "We could run it daily in the cron against what we pull
      # from MAP and flag any diffs."
      #
      # IT LIVES HERE RATHER THAN IN ITS OWN WORKFLOW because this job already
      # holds SUPABASE_SERVICE_KEY and is the one that pulls from MAP, so the
      # names are fresh in the same run. A second scheduled workflow would be a
      # second cron reading the same rows minutes apart.
      #
      # ⚠ READ-ONLY, AND IT NEVER COMMITS. The reviewed artifact stays the
      # committed college_identity_data.js; this only reports whether the finding
      # set MOVED. Landing regenerated identity decisions by schedule is exactly
      # what kb/reference/college_identity_rulings.json exists to prevent.
      #
      # continue-on-error: the roster sync above is the job people depend on, and
      # a lint that cannot read must never be what turns this run red.
      - name: College identity lint (flag any diffs)
        id: identity
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 kb/_identity_daily_check.py

      # One issue, reused — an outage thread, not one issue a day. Same shape as
      # cpl-chat-health.yml, and for the same reason: an alert that repeats itself
      # daily gets muted, and a muted alert is worse than none.
      - name: Raise or update the identity-findings issue
        if: steps.identity.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ADDED: ${{ steps.identity.outputs.added }}
          GONE: ${{ steps.identity.outputs.gone }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="College identity: the finding set moved"
          BODY=$(printf '%s\n' \
            "The daily lint rebuilt the crosswalk against live names and the findings changed: **${ADDED} new**, **${GONE} resolved**." \
            "" \
            "The run summary lists them by name: ${RUN_URL}" \
            "" \
            "A **new** finding is a name in a live table that resolves to no identity — a real question about what that college IS, not a typo to paper over. Resolve it in \`kb/reference/college_identity_rulings.json\` (attributed data, never hard-coded) and rebuild, or report it to MAP if only they can supply the id." \
            "" \
            "This issue closes itself on the next run whose findings match the committed artifact." \
            "" \
            "---" \
            "_Generated by [Claude Code](https://claude.ai/code)_")
          NUM=$(gh issue list --label college-identity --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh label create college-identity --color 1D76DB --description "College/district identity findings" 2>/dev/null || true
            gh issue create --title "$TITLE" --label college-identity --body "$BODY"
          fi

      - name: Close the identity issue when the findings match again
        if: steps.identity.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          NUM=$(gh issue list --label college-identity --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "$(printf '%s\n' \
              "The live findings match the committed artifact again — closing." \
              "" \
              "Run: ${RUN_URL}" \
              "" \
              "---" \
              "_Generated by [Claude Code](https://claude.ai/code)_")"
          else
            echo "Findings unchanged and no issue open — nothing to do."
          fi
