name: "CodeQL"

# Static analysis for Python + JavaScript. Runs on every push to main
# (catches drift after merge) + weekly (catches new query rules + currency
# from CodeQL itself). Free for public repos. Findings show up in the
# repo's Security tab.
#
# This repo has a small surface — Python pipeline scripts + browser JS for
# the dashboard tabs — so the default query suite is plenty. Path-level
# exclusions live in `.github/codeql/codeql-config.yml` (referenced via
# the `config-file:` input below). See that file for the audit trail on
# any excluded files / queries.
#
# PR-trigger TEMPORARILY DISABLED (2026-05-26) while a multi-PR EACR Phase 4
# re-pivot is in flight. The js/xss query has historically thrown structural
# false positives on the dashboard's DOM-builder helper (see PR #114, four
# rounds of iteration; commentary in codeql-config.yml), and that iteration
# tax compounds when several PRs land in sequence. Push-to-main trigger
# stays so drift on main is still caught; weekly schedule stays so new
# query rules still surface. Restore the `pull_request:` trigger when the
# re-pivot lands (PR-C2 merged).

on:
  push:
    branches: [main]
    # The daily cron pushes to main three times a day and commits only
    # REGENERATED artifacts — data files that happen to carry a .js extension
    # (CPL_Data.js, unified_courses_*.js and credential_reference_data.js are
    # megabyte-scale object literals, not code). CodeQL analysed every one of
    # those pushes: 66 runs in the five days measured 2026-09-06, 501 minutes,
    # for diffs that never contain a line a human wrote.
    #
    # ⚠️ This costs no coverage, and it is not the `paths:` mistake js-tests.yml
    # warns about — CodeQL is not a PR check here (its pull_request trigger has
    # been off since 2026-05-26), so nothing waits on it to report. The weekly
    # schedule below still analyses the whole tree, secret-scan runs on every
    # push to main regardless, and paths-ignore skips a push only when EVERY
    # changed file matches — one real source file and the run happens.
    paths-ignore:
      - 'CPL_Dashboard.html'
      - 'index.html'
      - 'CPL_Data.js'
      - 'unified_courses_*.js'
      - 'credential_reference_data.js'
      - 'cpl_funding_ess.js'
      - 'cpl_funding_performance.js'
      - 'cpl_pathways_membership_data.js'
      - 'college_activity.js'
      - 'college_activity_template.html'
      - 'fact-sheet/statewide_recs.js'
      - 'statewide_data.js'
      - 'statewide_prescriptive.js'
      # ⚠️ NOT a bare 'kb/**': that would skip kb/_build_*.py and the rest of
      # the Python under kb/, which is real source and exactly what CodeQL is
      # here for. Only the generated data and receipts under it are ignored.
      - 'kb/**/*.json'
      - 'kb/**/*.md'
      - 'kb/**/*.tsv'
      - 'kb/**/*.csv'
      - 'exports/**'
      - 'reports/**'
      - 'veteran_jst.json'
      - 'docs/**'
      # Named rather than '*.json': a blanket root glob would also skip a
      # package.json-only push, and a dependency change is exactly the kind
      # of push worth analysing.
      - 'live_metrics.json'
      - 'kpi_history.json'
      - 'fact_sheet_metrics.json'
      - 'CustomReport_latest.json'
  schedule:
    # Monday 06:00 UTC. Off-cycle from the daily cron (10:17 UTC) so they
    # don't compete for runners.
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
