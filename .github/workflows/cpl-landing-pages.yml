name: CPL college landing pages (sync)

# Syncs each college's CPL landing-page link into
# chatbox_college_profiles.landing_page_url, which the CPL Assistant (cpl-chat
# Edge Function) joins on the college name to surface in chat answers.
#
# SOURCE: the MAP College Landing Page API (POST {} → full {College,
# CollegeLandingURL} list), the same one the public page's script calls. The old
# base is rewritten to cpldashboardcccco/<code>. Runs ON A RUNNER because that
# Azure host is egress-blocked from the agent sandbox (runner-as-proxy pattern).
# A plain JSON POST — no browser/WAF handling.
#
# ⚠ INTERIM: superseded once these URLs land in the MAP Custom Report (then the
# daily dashboard cron can publish them and this workflow is retired).
#
# Triggers:
#   - push to claude/** (scoped) → DRY-RUN: fetch + reconcile, commit the JSON.
#   - schedule (weekly) → --apply: refresh the live table.
#   - workflow_dispatch → --apply when the `apply` input is true (default).

on:
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/cpl-landing-pages.yml'
      - 'chatbox/scrape_landing_pages.py'
      - 'chatbox/.landing-run'
  schedule:
    - cron: '37 14 * * 1'   # Mondays 14:37 UTC (~6:37 AM PT) — rarely-changing list
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write the landing URLs to chatbox_college_profiles'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: cpl-landing-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Sync landing pages (apply on schedule / dispatch-apply)
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          APPLY=""
          if [ "${{ github.event_name }}" = "schedule" ]; then APPLY="--apply"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.apply }}" = "true" ]; then APPLY="--apply"; fi
          echo "event=${{ github.event_name }} apply='${APPLY:-(dry-run)}'"
          python3 chatbox/scrape_landing_pages.py $APPLY
      - name: Commit the landing mapping back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chatbox/college_landing_pages.json
          if git diff --cached --quiet; then
            echo "No mapping changes to commit."
          else
            git commit -m "chore(chatbox): refresh college landing-page links [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
