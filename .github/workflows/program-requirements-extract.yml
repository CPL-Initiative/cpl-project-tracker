name: Program requirements extraction

# Phase 1 of the program requirements harvest
# (docs/reference/lanes/program-requirements-harvest.md), the extraction pass.
#
# kb/_program_requirements_extract.py reads the catalog text the capture pass
# filed under kb/program_requirements_pilot/sources/ (it never loads a
# college's site), posts each program to the program-requirements-extract
# Edge Function, and scores the record against the state's closed course list.
# It WRITES NOTHING: records, scores and the cost of each call go to the job
# log for a session to read through the GitHub MCP.
#
# Sam's call 6 on sheet 23 (2026-10-03): model calls go through a Supabase Edge
# Function that holds the Anthropic key. The service key here only
# authenticates the call (the cpl-news.yml pattern). Each run spends model
# tokens, so it runs by hand or when this workflow or its script changes,
# never on a schedule and never because a fixture changed.
#
# A PUSH RUNS ONLY WHEN THE BRANCH'S OWN SCRIPT DIFFERS FROM MAIN'S (S361).
# The paths filter compares a push with the branch's previous push, so merging
# main into a branch that predates a change to the script, or rebasing onto it,
# starts the full pilot (22 programs, $1.59 on 2026-10-11, run 38105582450)
# with nothing of the branch's to test. Three such runs in two sessions
# (S360, S361). The guard step compares the script with main's and skips the
# extraction when they match; a dispatch always runs.
#
# AND ONLY WHEN THE PUSHED COMMIT'S MESSAGE STARTS WITH [extract] (S389). A
# branch that changes the script for another reason (record shape 5, #2110)
# still ran the whole pilot on its first push, $1.6 nobody asked for (run
# 38560251804). The college workflow already reads only on [read]/[extract].

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only programs whose college or control number contains this (blank = all)"
        required: false
        default: ""
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/program-requirements-extract.yml'
      - 'kb/_program_requirements_extract.py'

permissions:
  contents: read

concurrency:
  group: program-requirements-extract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: On a push, run only on [extract] and when the branch's script differs from main's
        id: guard
        if: github.event_name == 'push'
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          case "$MSG" in
            "[extract]"*) ;;
            *) echo "run=no" >> "$GITHUB_OUTPUT"
               echo "The pushed commit's message does not start with [extract], so no model calls. Dispatch the workflow, or push a commit marked [extract], to run it."
               exit 0 ;;
          esac
          git fetch --no-tags --depth=1 origin main
          if git diff --quiet FETCH_HEAD -- kb/_program_requirements_extract.py; then
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "kb/_program_requirements_extract.py matches main's: nothing of this branch's to test, so no model calls. Dispatch the workflow to run it."
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.guard.outputs.run != 'no'
        with:
          python-version: '3.12'

      - name: Extract and score
        if: steps.guard.outputs.run != 'no'
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ONLY: ${{ github.event.inputs.only }}
        run: python3 kb/_program_requirements_extract.py --only "$ONLY"
