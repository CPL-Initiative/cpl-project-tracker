<script>(function(){function a(t){var r=document.documentElement;if(t==="light"||t==="dark")r.setAttribute("data-theme",t);else r.removeAttribute("data-theme")}

  .cpo-share { font-size: .92rem; overflow-wrap: anywhere; }
  .cpo-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .cpo-fact { border-top: 2px solid var(--text-strong); padding-top: 8px; display: grid; gap: 2px; }

  .cpo-tbl { overflow: auto; max-height: 70vh; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }

  .cpo-adopt { display: inline-block; font-weight: 700; color: var(--on-accent); background: var(--seal-blue); padding: 4px 10px; border-radius: 6px; text-decoration: underline; white-space: nowrap; }

  .cpo-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .cpo-legend { display: flex; gap: 16px; font-size: .85rem; color: var(--text-muted); }
  .cpo-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .cpo-legend .hi, .cpo-seg.hi { background: var(--bar-hi); } .cpo-legend .me, .cpo-seg.me { background: var(--bar-me); } .cpo-legend .lo, .cpo-seg.lo { background: var(--bar-lo); }
  .cpo-bar-row { display: grid; grid-template-columns: minmax(120px, 240px) 1fr 200px; gap: 10px; align-items: center; font-size: .9rem; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<style>

:root[data-theme="dark"]{--cplh-bg:#1E2127;--cplh-line:#3A3F49;--cplh-fg:#D8D5CD;--cplh-link:#7DA1D4;--cplh-strong:#F2F0EA}
.cplh{background:var(--cplh-bg);border-bottom:1px solid var(--cplh-line);color:var(--cplh-fg);font-family:'Source Sans 3',Arial,sans-serif;font-size:.95rem;line-height:1.4}
.cplh-in{max-width:1080px;margin:0 auto;padding-block:.6rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.4rem}
.cplh-logo{display:inline-flex;min-height:24px}
.cplh-logo img{display:block;height:40px;width:auto;max-width:100%}
.cplh-logo .cplh-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cplh-logo .cplh-light{display:none}:root:not([data-theme="light"]) .cplh-logo .cplh-dark{display:block}}
:root[data-theme="dark"] .cplh-logo .cplh-light{display:none}
:root[data-theme="dark"] .cplh-logo .cplh-dark{display:block}
.cplh-nav{display:flex;flex-wrap:wrap;gap:.3rem 1.1rem;margin:0;padding:0;list-style:none;flex:1 1 auto}
.cplh a{color:var(--cplh-link)}
.cplh-nav a{display:inline-flex;align-items:center;min-height:24px;text-underline-offset:3px}

.cplh-theme button[aria-pressed="true"]{color:var(--cplh-strong);text-decoration-thickness:2px}
.cplh a:focus-visible,.cplh button:focus-visible{outline:2px solid var(--cplh-link);outline-offset:2px}

<script>
(function () {
  var KEY = "cpl_theme", root = document.documentElement;
  function read() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function current() {
    var t = root.getAttribute("data-theme");
    if (t === "light" || t === "dark") return t;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function paint() {
    var t = current();
    Array.prototype.forEach.call(document.querySelectorAll("[data-cplh-theme]"), function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-cplh-theme") === t));
    });
  }
  var saved = read();
  if (saved === "light" || saved === "dark") root.setAttribute("data-theme", saved);
  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-cplh-theme]") : null;
    if (!b) return;
    var t = b.getAttribute("data-cplh-theme");
    root.setAttribute("data-theme", t);
    try { localStorage.setItem(KEY, t); } catch (err) { /* private window: the choice holds for this visit */ }
    paint();
  });
  if (window.matchMedia) { try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paint); } catch (e) {} }
  paint();
})();
</script>

<script src="../college_cpl_workbook.js"></script>
<script>
(function () {
  var W = window.CPL_COLLEGE_WORKBOOK, root = document.getElementById("cpo-root");
  var pick = document.getElementById("cpo-college"), status = document.getElementById("cpo-status");
  function loadScript(src, g, cb) {
    if (window[g]) { cb(); return; }
    var s = document.createElement("script");
    s.src = src; s.onload = cb; s.onerror = cb;
    document.head.appendChild(s);
  }
  function wanted() {
    try { return new URLSearchParams(location.search).get("college") || ""; } catch (e) { return ""; }
  }
  function show(college) {
    if (!college) { root.innerHTML = '<p class="cpo-note">Choose a college to see its CPL opportunities.</p>'; return; }
    status.textContent = "Building " + college + "…";
    W.prepare({ college: college, loadScript: loadScript, base: "../" }, function (err, b) {
      if (err || !b) { status.textContent = "Could not build it: " + (err && err.message || "no data"); return; }
      document.title = college + " CPL Opportunities";
      root.innerHTML = W.pageHtml(b);
      W.wirePage(root, b);
      status.textContent = "";
    });
  }
  // Load the data once, fill the picker, then build the college the link names.
  W.load({ loadScript: loadScript, base: "../" }, function (err) {
    if (err) { status.textContent = err.message; return; }
    var names = W.colleges(), want = W.resolve(names, wanted()) || wanted();
    pick.innerHTML = '<option value="">Choose a college</option>' + names.map(function (n) {
      return '<option' + (n === want ? " selected" : "") + ">" + n.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</option>";
    }).join("");
    pick.disabled = false;
    status.textContent = "";
    show(want);
  });
  pick.addEventListener("change", function () {
    var c = pick.value;
    try { history.replaceState(null, "", c ? "?college=" + encodeURIComponent(c) : location.pathname); } catch (e) { /* the link still works */ }
    show(c);
  });
})();
</script>
