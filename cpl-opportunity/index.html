<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPL Opportunity Analysis</title>
<meta name="description" content="One California community college's credit for prior learning opportunities: its COCI programs and courses, its MAP exhibits, and the statewide credit recommendations it could adopt.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<!--
  The shareable CPL opportunity visual (Ashley and Sam, 2026-10-20): one page per
  college, addressed as ?college=<name>, built in the browser by
  college_cpl_workbook.js from files COBI already publishes. My College and the
  CPL Pathways college picker link here ("View CPL Visual") and download the
  same build as an Excel extract ("Download CPL Extract").

  Hand-maintained static file, Pages-served. NOT regenerated by
  excel_to_dashboard.py, so it is exempt from Rule 1 / Rule 4. It writes nothing.
-->
<style>
  /* First Light (docs/kb-notes/reference-ui-design-system.md): the light identity, one opt-in dark palette. */
  :root {
    --paper: #F4F2ED; --surface: #FFFFFF; --surface-subtle: #F7F5F1; --text-strong: #1C1C1A; --text-body: #3A3A36;
    --text-muted: #5C5C55; --border: rgba(28,28,26,.14); --cobalt: #0047AB; --seal-blue: #002F6D;
    --bar-hi: #0047AB; --bar-me: #7DA1D4; --bar-lo: #D6D2C8; --on-accent: #FFFFFF;
    --display: "Playfair Display", Georgia, serif; --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root {
    --paper: #1E1E21; --surface: #27272E; --surface-subtle: #2D2D34; --text-strong: #F2F0EA; --text-body: #DAD7CF;
    --text-muted: #B4B1A8; --border: rgba(242,240,234,.16); --cobalt: #7DA1D4; --seal-blue: #7DA1D4;
    --bar-hi: #7DA1D4; --bar-me: #46628A; --bar-lo: #4A4A50; --on-accent: #1E1E21; color-scheme: dark; } }
  body { margin: 0; background: var(--paper); color: var(--text-body); font: 16px/1.55 var(--body); }
  .skip { position: absolute; left: -999px; top: 8px; background: var(--surface); color: var(--cobalt); padding: 8px 12px; }
  .skip:focus { left: 16px; }
  main { max-width: 1180px; margin: 0 auto; padding: 28px 16px 64px; display: grid; gap: 30px; }
  h1, h2 { font-family: var(--display); color: var(--text-strong); margin: 0; text-wrap: balance; }
  h1 { font-size: clamp(1.8rem, 4vw, 2.5rem); line-height: 1.15; }
  h2 { font-size: clamp(1.2rem, 2.4vw, 1.5rem); }
  section { display: grid; gap: 12px; min-width: 0; }
  a { color: var(--cobalt); }
  :focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }
  #cpo-root { display: grid; gap: 30px; min-width: 0; }
  .cpo-pick { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .cpo-pick select, .cpo-f select, .cpo-f input { font: inherit; min-height: 32px; padding: 2px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text-body); max-width: 100%; }
  .cpo-status { color: var(--text-muted); }
  .cpo-head { display: grid; gap: 8px; }
  .cpo-eyebrow { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
  .cpo-acts { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .cpo-act { font: inherit; font-weight: 600; color: var(--cobalt); background: none; border: 0; padding: 0; min-height: 24px; text-decoration: underline; cursor: pointer; }
  .cpo-share { font-size: .92rem; overflow-wrap: anywhere; }
  .cpo-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .cpo-fact { border-top: 2px solid var(--text-strong); padding-top: 8px; display: grid; gap: 2px; }
  .cpo-fact b { font: 700 1.6rem/1.1 var(--display); color: var(--text-strong); font-variant-numeric: tabular-nums; }
  .cpo-fact span { font-size: .9rem; color: var(--text-muted); }
  .cpo-note { font-size: .9rem; color: var(--text-muted); margin: 0; }
  .cpo-filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
  .cpo-f { display: grid; gap: 2px; font-size: .85rem; color: var(--text-muted); }
  .cpo-count { font-size: .85rem; color: var(--text-muted); }
  .cpo-tbl { overflow: auto; max-height: 70vh; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--text-strong); font-weight: 600; background: var(--surface-subtle); position: sticky; top: 0; }
  .cpo-adopt { display: inline-block; font-weight: 700; color: var(--on-accent); background: var(--seal-blue); padding: 4px 10px; border-radius: 6px; text-decoration: underline; white-space: nowrap; }
  .cpo-muted { color: var(--text-muted); font-size: .85rem; }
  .cpo-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .cpo-legend { display: flex; gap: 16px; font-size: .85rem; color: var(--text-muted); }
  .cpo-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .cpo-legend .hi, .cpo-seg.hi { background: var(--bar-hi); } .cpo-legend .me, .cpo-seg.me { background: var(--bar-me); } .cpo-legend .lo, .cpo-seg.lo { background: var(--bar-lo); }
  .cpo-bar-row { display: grid; grid-template-columns: minmax(120px, 240px) 1fr 200px; gap: 10px; align-items: center; font-size: .9rem; }
  .cpo-bar { display: flex; height: 14px; background: var(--surface-subtle); border-radius: 3px; overflow: hidden; }
  .cpo-bar-n { color: var(--text-muted); font-size: .82rem; font-variant-numeric: tabular-nums; }
  @media (max-width: 560px) { .cpo-bar-row { grid-template-columns: 1fr; gap: 4px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<a class="skip" href="#cpo-root">Skip to the analysis</a>
<main>
  <div class="cpo-pick">
    <label for="cpo-college">College</label>
    <select id="cpo-college" disabled><option value="">Loading the college list…</option></select>
    <span class="cpo-status" id="cpo-status" role="status">The first build reads about 45 MB of COBI data.</span>
  </div>
  <div id="cpo-root"></div>
</main>
<script src="../college_cpl_workbook.js"></script>
<script>
(function () {
  var W = window.CPL_COLLEGE_WORKBOOK, root = document.getElementById("cpo-root");
  var pick = document.getElementById("cpo-college"), status = document.getElementById("cpo-status");
  function loadScript(src, g, cb) {
    if (window[g]) { cb(); return; }
    var s = document.createElement("script");
    s.src = src; s.onload = cb; s.onerror = cb;
    document.head.appendChild(s);
  }
  function wanted() {
    try { return new URLSearchParams(location.search).get("college") || ""; } catch (e) { return ""; }
  }
  function show(college) {
    if (!college) { root.innerHTML = '<p class="cpo-note">Choose a college to see its CPL opportunities.</p>'; return; }
    status.textContent = "Building " + college + "…";
    W.prepare({ college: college, loadScript: loadScript, base: "../" }, function (err, b) {
      if (err || !b) { status.textContent = "Could not build it: " + (err && err.message || "no data"); return; }
      document.title = college + " CPL Opportunities";
      root.innerHTML = W.pageHtml(b);
      W.wirePage(root, b);
      status.textContent = "";
    });
  }
  // Load the data once, fill the picker, then build the college the link names.
  W.load({ loadScript: loadScript, base: "../" }, function (err) {
    if (err) { status.textContent = err.message; return; }
    var names = W.colleges(), want = W.resolve(names, wanted()) || wanted();
    pick.innerHTML = '<option value="">Choose a college</option>' + names.map(function (n) {
      return '<option' + (n === want ? " selected" : "") + ">" + n.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</option>";
    }).join("");
    pick.disabled = false;
    status.textContent = "";
    show(want);
  });
  pick.addEventListener("change", function () {
    var c = pick.value;
    try { history.replaceState(null, "", c ? "?college=" + encodeURIComponent(c) : location.pathname); } catch (e) { /* the link still works */ }
    show(c);
  });
})();
</script>
</body>
</html>
