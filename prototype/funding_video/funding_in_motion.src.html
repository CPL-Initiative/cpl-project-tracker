<style>
:root{
  --paper:#F4F2ED;--ink:#1C1C1A;--ink-body:#3A3A36;--ink-muted:#5C5C55;--surface:#FFFFFF;
  --cobalt:#0047AB;--cobalt-on-dark:#7DA1D4;--seal-blue:#002F6D;--mustard-fill:#E3B341;--mustard-text:#8B6800;
  --map-navy:#233761;--map-red:#9E2A2B;
  --stage-paper:#FBFAF6;--stage-ink:var(--ink);--stage-body:var(--ink-body);--stage-muted:var(--ink-muted);
  --stage-blue:var(--cobalt);--stage-navy:var(--seal-blue);--stage-gold:var(--mustard-fill);--stage-gold-text:var(--mustard-text);
  --stage-rule:rgba(28,28,26,.16);--stage-track:#E9E5DA;--stage-shadow:rgba(28,28,26,.30);--stage-seg3:#7DA1D4;
  --page:var(--paper);--text:var(--ink);--text-body:var(--ink-body);--text-muted:var(--ink-muted);--card:var(--surface);
  --line:rgba(28,28,26,.14);--line-strong:rgba(28,28,26,.32);--btn:var(--surface);--btn-text:var(--ink);
  --btn-strong:var(--ink);--btn-strong-text:var(--paper);--focus:var(--cobalt);--accent-text:var(--mustard-text);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--page:#16171B;--text:#EDEBE5;--text-body:#D3D0C8;--text-muted:#A9A69D;--card:#202227;--line:rgba(237,235,229,.14);--line-strong:rgba(237,235,229,.34);--btn:#202227;--btn-text:#EDEBE5;--btn-strong:#EDEBE5;--btn-strong-text:#16171B;--focus:var(--cobalt-on-dark);--accent-text:var(--mustard-fill);--stage-shadow:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{color-scheme:dark;--page:#16171B;--text:#EDEBE5;--text-body:#D3D0C8;--text-muted:#A9A69D;--card:#202227;--line:rgba(237,235,229,.14);--line-strong:rgba(237,235,229,.34);--btn:#202227;--btn-text:#EDEBE5;--btn-strong:#EDEBE5;--btn-strong-text:#16171B;--focus:var(--cobalt-on-dark);--accent-text:var(--mustard-fill);--stage-shadow:rgba(0,0,0,.6)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font:400 16px/1.55 "Source Sans 3",Arial,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding-inline:clamp(16px,4vw,32px);padding-block:clamp(20px,4vw,40px) 56px}
.eyebrow{margin:0 0 6px;font-weight:700;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text)}
h1{margin:0;font:700 clamp(1.7rem,1.15rem + 2.2vw,2.7rem)/1.12 "Playfair Display",Georgia,serif;text-wrap:balance}
.dek{margin:8px 0 0;color:var(--text-muted);max-width:62ch}
.stage{position:relative;margin-top:clamp(16px,3vw,28px);width:100%;aspect-ratio:16/9;background:var(--stage-paper);border:1px solid var(--line);border-radius:6px;overflow:hidden;container-type:inline-size;box-shadow:0 14px 36px -22px var(--stage-shadow);color:var(--stage-ink)}
.sc{position:absolute;inset:0;padding:5cqw 6cqw;visibility:hidden}
.w,.ch{display:inline-block;will-change:transform,opacity}
.hd{margin:0;font:700 4.6cqw/1.08 "Playfair Display",Georgia,serif;letter-spacing:-.01em}
.ln{margin:0;font:400 2.5cqw/1.3 "Source Sans 3",Arial,sans-serif;color:var(--stage-body)}
.ln b{color:var(--stage-ink);font-weight:700}
.big{font:900 11cqw/1 "Playfair Display",Georgia,serif;letter-spacing:-.02em;font-variant-numeric:lining-nums tabular-nums}
.gold{color:var(--stage-gold-text)}.blue{color:var(--stage-blue)}
.kick{font:700 1.5cqw/1 "Source Sans 3",Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--stage-blue)}
.abs{position:absolute}
.bar{position:absolute;height:4.2cqw;border-radius:.6cqw;overflow:hidden;background:var(--stage-track)}
.fill{position:absolute;top:0;bottom:0;left:0}
.pill{display:inline-block;padding:.35cqw 1cqw;border-radius:99px;font:700 1.4cqw/1 "Source Sans 3",Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase}
/* The logo lockup: the MAP wordmark (its arrow cut out, so the flying arrow
   is the only one), the platform's long name, the tagline, and the CPL
   Initiative logo beneath. Sized in cqw so the arrow's home is a fixed point. */
/* The CPL Initiative logo leads and is the largest mark; the MAP wordmark
   sits beneath it at three-fifths the width, with the platform's long name
   and tagline (Sam, 2026-09-26: "the CPL Initiative logo should still be the
   most prominent but the MAP logo gets second fiddle and special treatment"). */
.lock{position:absolute;left:25cqw;top:4cqw;width:50cqw;text-align:center;color:var(--map-navy)}
.lock img{display:block;margin:0 auto}
.lock .cpl{width:100%}
.lock .rule{height:.32cqw;background:var(--map-navy);margin:1.2cqw 0 1.4cqw}
.lock .map{width:58%}
.lock .l1{margin:.4cqw 0 0;font:700 1.7cqw/1.2 "Source Sans 3",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.lock .l2{margin:.1cqw 0 0;font:italic 600 1.3cqw/1.25 "Source Sans 3",Arial,sans-serif}
.arrow{position:absolute;left:0;top:0;width:3.39cqw;height:auto;z-index:4;pointer-events:none;transform-origin:50% 58%;will-change:transform}
/* The trail: a few copies of the arrow lagging behind it, each fainter and
   smaller, so the mark reads as a small ship under way (Sam, 2026-09-26). */
.ghost{position:absolute;left:0;top:0;width:3.39cqw;height:auto;z-index:3;pointer-events:none;transform-origin:50% 58%;will-change:transform;filter:blur(.15cqw)}
.bigplay{position:absolute;left:50%;top:88%;transform:translate(-50%,-50%);min-height:44px;padding:0 1.5em;border:0;border-radius:999px;background:var(--stage-ink);color:var(--stage-paper);font:700 clamp(14px,1.5cqw,18px)/1 "Source Sans 3",Arial,sans-serif;cursor:pointer;z-index:5}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-top:12px}
.btn{min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line-strong);background:var(--btn);color:var(--btn-text);font:600 1rem/1 "Source Sans 3",Arial,sans-serif;cursor:pointer}
.btn.strong{min-width:96px;background:var(--btn-strong);color:var(--btn-strong-text);border-color:var(--btn-strong)}
.scrub{flex:1 1 220px;display:flex;min-width:0}.scrub input{width:100%;height:28px;margin:0;accent-color:var(--text)}
output{min-width:7.5ch;font-variant-numeric:tabular-nums;color:var(--text-muted)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.scenes{margin-top:clamp(28px,5vw,44px)}
.scenes h2{margin:0 0 12px;font:700 1.35rem/1.2 "Playfair Display",Georgia,serif}
.chapters{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.chap{width:100%;height:100%;display:grid;gap:4px;align-content:start;padding:12px 14px;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;cursor:pointer}
.chap[aria-current="true"]{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.chap .tc{font-size:.8rem;font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums;color:var(--accent-text)}
.chap .nm{font-weight:700}.chap .tx{font-size:.95rem;line-height:1.45;color:var(--text-body)}
</style>

<main class="wrap">
  <header>
    <p class="eyebrow">__EYEBROW__</p>
    <h1>2026-2028 CPL Initiative Funding: How It Works</h1>
    <p class="dek">__DEK__</p>
  </header>
  <div class="stage" id="stage" role="region" aria-label="Guide video">
    <p class="vh" id="said" aria-live="polite"></p>
    <img class="arrow" id="arrow" src="__ARROW__" alt="" aria-hidden="true">
    <div id="trail" aria-hidden="true"></div>
    <button type="button" class="bigplay" id="bigplay">Play the guide</button>
  </div>
  <div class="controls">
    <button type="button" class="btn strong" id="play">Play</button>
    <button type="button" class="btn" id="replay">Replay</button>
    <div class="scrub"><label for="pos" class="vh">Position in the guide</label><input type="range" id="pos" min="0" max="90" step="0.05" value="0"></div>
    <output id="time" for="pos">0:00</output>

  </div>
  <p style="margin:14px 0 0">The full explainer, with every institution’s figures: <a href="__EXPLAINER__" style="color:var(--focus);font-weight:600">__LINKLABEL__</a></p>
  <section class="scenes" aria-labelledby="sh"><h2 id="sh">Scenes</h2><ol class="chapters" id="chapters"></ol></section>
</main>

<script>
(function(){

var $=function(i){return document.getElementById(i);};

var reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
/* ---- motion helpers: every value is a pure function of the clock ---- */

function eo(x){x=cl(x);return 1-Math.pow(1-x,3);}

  if(style==='drop'){el.style.opacity=p;el.style.transform='translateY('+((1-p)*-0.9)+'em) scale('+(1+(1-p)*0.6)+')';el.style.filter='blur('+((1-p)*8)+'px)';}

function fade(el,t,a,b){var p=eo(k(t,a,b));el.style.opacity=p;el.style.transform='translateY('+((1-p)*1.2)+'cqw)';}
function money(n){return '$'+Math.round(n).toLocaleString('en-US');}

/* ---- the logo lockup, shared by the first and last scene ---- */
function lockup(r){var d=E('div','lock',null,r);var c=E('img','cpl',null,d);c.src=LOGO;c.alt='California Community Colleges Credit for Prior Learning Initiative';E('div','rule',null,d);var m=E('img','map',null,d);m.src=MAP;m.alt='MAP Initiative';E('p','l1','Mapping Articulated Pathways',d);E('p','l2','With Credit for Prior Learning for Working Adults &amp; Veterans',d);d.map=m;return d;}
/* ---- the script ---- */
var S=[];
function scene(t0,t1,name,text,build,update){var root=E('div','sc',null,stage);var o={t0:t0,t1:t1,name:name,text:text,root:root,u:update};build(root,o);S.push(o);}

scene(0,6,'Title',CFG.titleText,function(r,o){
  o.lock=lockup(r);
  o.t=chars(r,'2026-2028 CPL Initiative Funding: How It Works','hd');o.t.style.cssText='position:absolute;left:4cqw;right:4cqw;top:69%;text-align:center;font-size:4cqw';
  o.s=E('p','kick',CFG.kick,r,'position:absolute;left:0;right:0;top:85%;text-align:center');
},function(o,t){o.lock.style.opacity=eo(k(t,0.2,1.4));reveal(o.t.cs,t,1.4,0.04,0.7,'drop');fade(o.s,t,3.6,4.4);});

scene(6,15,'The funding','The state set aside 35 million dollars in one-time funding for 2026–27. 25.2 million goes directly to 118 institutions, 9.0 million funds statewide CPL projects and technology, and 800 thousand funds two Chancellor’s Office positions that support colleges.',function(r,o){

  o.bar=E('div','bar',null,r,'left:6cqw;right:6cqw;top:32cqw');
  var segs=[[0,72.1,'var(--stage-blue)'],[72.1,25.6,'var(--stage-navy)'],[97.7,2.3,'var(--stage-seg3)']];

},function(o,t){fade(o.k,t,0.1,0.8);count(o.n,t,0.2,2.4,35000000);o.n.style.transform='scale('+(1+0.08*Math.sin(Math.PI*k(t,2.2,2.9)))+')';reveal(o.l.ws,t,2.2,0.06,0.5);
  o.segs.forEach(function(s,i){var p=eio(k(t,3.6+i*0.7,4.6+i*0.7));s.el.style.width=(s.d[1]*p)+'%';});o.lab.forEach(function(d,i){fade(d,t,4.0+i*0.7,4.8+i*0.7);});});

scene(15,25,'Maximum allocation','Every institution has a maximum allocation, sized by its share of instruction, credit and noncredit together. It sits between a base of 150 thousand and a cap of 400 thousand across the two years. Sample College’s maximum allocation is 345,220 dollars.',function(r,o){

  o.track=E('div','abs',null,r,'left:10cqw;right:10cqw;top:34cqw;height:.5cqw;background:var(--stage-ink);transform-origin:left');
  o.ticks=[[0,'$150,000','base'],[8.9,'$172,314','typical'],[100,'$400,000','cap']].map(function(a,i){var d=E('div','abs',null,r,'left:calc(10cqw + '+a[0]+'% * 0.8);top:31.5cqw;transform:translateX('+(i===0?'-85%':i===2?'-15%':'-50%')+');text-align:'+(i===0?'right':i===2?'left':'center')+'');E('div',null,null,d,'width:.35cqw;height:5.5cqw;background:var(--stage-ink);margin:0 auto');E('div',null,a[1],d,'font:900 2.4cqw/1.1 \'Playfair Display\',Georgia,serif;margin-top:.6cqw');E('div','kick',a[2],d,'margin-top:.4cqw;color:var(--stage-muted)');if(i===1){d.style.top='27.2cqw';d.style.transform='translateX(-50%)';d.appendChild(d.firstChild);d.lastChild.style.height='2.8cqw';d.lastChild.style.marginTop='.3cqw';}return d;});
  o.m=E('div','abs',null,r,'top:22.5cqw;transform:translateX(-50%);text-align:center');E('div','pill','Sample College',o.m,'background:var(--stage-gold);color:var(--stage-ink)');o.mv=E('div',null,'$345,220',o.m,'font:900 3.2cqw/1.2 \'Playfair Display\',Georgia,serif;margin-top:.4cqw');E('div',null,null,o.m,'width:.35cqw;height:3.4cqw;background:var(--stage-gold);margin:.2cqw auto 0');
  o.b=words(r,'Smaller institutions are brought up to the base. The largest are held at the cap.','ln abs');o.b.style.cssText='left:6cqw;right:6cqw;bottom:4cqw';
},function(o,t){reveal(o.h.ws,t,0.1,0.08,0.6);reveal(o.l.ws,t,0.8,0.04,0.5);var p=eio(k(t,1.6,2.6));o.track.style.transform='scaleX('+p+')';o.ticks.forEach(function(d,i){d.style.opacity=eo(k(t,2.0+i*0.35,2.7+i*0.35));});
  var x=back(k(t,4.0,5.6));o.m.style.left='calc(10cqw + '+(78.1*x*0.8)+'%)';o.m.style.opacity=k(t,4.0,4.3);reveal(o.b.ws,t,6.2,0.06,0.5);});

scene(25,32,'Credit and noncredit','Each maximum allocation splits into a credit share and a noncredit share, by the institution’s own instructional mix. Only noncredit outcomes count toward the noncredit share.',function(r,o){
  o.h=words(r,'Every allocation splits in two','hd');
  o.a=E('div','big abs','$345,220',r,'left:50%;top:15cqw;transform:translateX(-50%);font-size:9cqw');
  o.c=E('div','abs',null,r,'top:15cqw;text-align:center;width:36cqw');o.cv=E('div','big blue',null,o.c,'font-size:7cqw');E('div','kick','credit share',o.c,'margin-top:1cqw');
  o.n=E('div','abs',null,r,'top:15cqw;text-align:center;width:36cqw');o.nv=E('div','big gold',null,o.n,'font-size:7cqw');E('div','kick','noncredit share',o.n,'margin-top:1cqw;color:var(--stage-gold-text)');
  o.l=words(r,'The split follows each institution’s own instructional mix. <b>Only noncredit outcomes count toward the noncredit share.</b>','ln abs');o.l.style.cssText='left:6cqw;right:6cqw;top:34cqw';
},function(o,t){reveal(o.h.ws,t,0.1,0.08,0.6);var s=eio(k(t,1.8,3.0));o.a.style.opacity=1-k(t,1.8,2.2);o.a.style.transform='translateX(-50%) scale('+(1+0.15*Math.sin(Math.PI*k(t,1.2,1.8)))+')';

},function(o,t){reveal(o.h.ws,t,0.1,0.08,0.6);o.cols.forEach(function(c,i){var a=1.2+i*4,p=back(k(t,a,a+0.9));c.d.style.opacity=k(t,a,a+0.3);c.d.style.transform='translateY('+((1-p)*6)+'cqw) rotate('+((1-p)*(i-1)*4)+'deg)';
