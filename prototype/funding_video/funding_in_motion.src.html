<style>

}

:root[data-theme="dark"]{color-scheme:dark;--page:#16171B;--text:#EDEBE5;--text-body:#D3D0C8;--text-muted:#A9A69D;--card:#202227;--line:rgba(237,235,229,.14);--line-strong:rgba(237,235,229,.34);--btn:#202227;--btn-text:#EDEBE5;--btn-strong:#EDEBE5;--btn-strong-text:#16171B;--focus:var(--cobalt-on-dark);--accent-text:var(--mustard-fill);--stage-shadow:rgba(0,0,0,.6)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font:400 16px/1.55 "Source Sans 3",Arial,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding-inline:clamp(16px,4vw,32px);padding-block:clamp(20px,4vw,40px) 56px}
.eyebrow{margin:0 0 6px;font-weight:700;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text)}

.gold{color:var(--stage-gold-text)}.blue{color:var(--stage-blue)}

.abs{position:absolute}

.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-top:12px}
.btn{min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line-strong);background:var(--btn);color:var(--btn-text);font:600 1rem/1 "Source Sans 3",Arial,sans-serif;cursor:pointer}
.btn.strong{min-width:96px;background:var(--btn-strong);color:var(--btn-strong-text);border-color:var(--btn-strong)}

output{min-width:7.5ch;font-variant-numeric:tabular-nums;color:var(--text-muted)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.chap{width:100%;height:100%;display:grid;gap:4px;align-content:start;padding:12px 14px;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;cursor:pointer}
.chap[aria-current="true"]{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.chap .tc{font-size:.8rem;font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums;color:var(--accent-text)}
.chap .nm{font-weight:700}.chap .tx{font-size:.95rem;line-height:1.45;color:var(--text-body)}
</style>

<main class="wrap">
  <header>
    <p class="eyebrow">CPL Initiative</p>
    <h1>How CPL implementation funding works</h1>
    <p class="dek">A 90-second guide for colleges, with music. The sound starts when you press Play.</p>
  </header>
  <div class="stage" id="stage" role="region" aria-label="Guide video">
    <p class="vh" id="said" aria-live="polite"></p>
    <button type="button" class="bigplay" id="bigplay">Play the guide</button>
  </div>
  <div class="controls">
    <button type="button" class="btn strong" id="play">Play</button>
    <button type="button" class="btn" id="replay">Replay</button>
    <div class="scrub"><label for="pos" class="vh">Position in the guide</label><input type="range" id="pos" min="0" max="90" step="0.05" value="0"></div>
    <output id="time" for="pos">0:00</output>
    <button type="button" class="btn" id="sound">Mute</button>
  </div>
  <p style="margin:14px 0 0">The full explainer, with every institution’s figures: <a href="https://cpl-initiative.github.io/cpl-project-tracker/funding-model/" style="color:var(--focus);font-weight:600">CPL funding model</a></p>
  <section class="scenes" aria-labelledby="sh"><h2 id="sh">Scenes</h2><ol class="chapters" id="chapters"></ol></section>
</main>

<script>
(function(){

var DUR=90,LOGO='__LOGO__',EXPLAINER='https://cpl-initiative.github.io/cpl-project-tracker/funding-model/';
var $=function(i){return document.getElementById(i);};
var stage=$('stage'),said=$('said');
var reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
/* ---- motion helpers: every value is a pure function of the clock ---- */
function cl(x){return x<0?0:x>1?1:x;}
function eo(x){x=cl(x);return 1-Math.pow(1-x,3);}
function eio(x){x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}

  if(style==='drop'){el.style.opacity=p;el.style.transform='translateY('+((1-p)*-0.9)+'em) scale('+(1+(1-p)*0.6)+')';el.style.filter='blur('+((1-p)*8)+'px)';}
  else{el.style.opacity=p;el.style.transform='translateY('+((1-p)*0.55)+'em)';el.style.filter='blur('+((1-p)*5)+'px)';}});}
function fade(el,t,a,b){var p=eo(k(t,a,b));el.style.opacity=p;el.style.transform='translateY('+((1-p)*1.2)+'cqw)';}

/* ---- the script ---- */

scene(0,6,'Title','How CPL implementation funding works: a guide for colleges.',function(r,o){
  o.logo=E('img','logo',null,r,'top:14%');o.logo.src=LOGO;o.logo.alt='California Community Colleges Credit for Prior Learning Initiative';
  o.t=chars(r,'How CPL implementation funding works','hd');o.t.style.cssText='position:absolute;left:0;right:0;top:58%;text-align:center;font-size:5cqw';

},function(o,t){o.logo.style.opacity=eo(k(t,0.2,1.4));reveal(o.t.cs,t,1.4,0.045,0.7,'drop');fade(o.s,t,3.4,4.2);});

scene(6,15,'The funding','The state set aside 35 million dollars in one-time funding for 2026–27. 25.2 million goes directly to 118 institutions, 9.0 million funds statewide CPL projects and technology, and 800 thousand funds two Chancellor’s Office positions that support colleges.',function(r,o){
  o.k=E('p','kick','One-time funding for 2026–27',r,'position:absolute;left:6cqw;top:6cqw');

  o.bar=E('div','bar',null,r,'left:6cqw;right:6cqw;top:32cqw');
  var segs=[[0,72.1,'var(--stage-blue)'],[72.1,25.6,'var(--stage-navy)'],[97.7,2.3,'var(--stage-seg3)']];

  o.lab=[[6,'$25,240,308','directly to 118 institutions','var(--stage-blue)'],[47,'$8,959,692','statewide CPL projects and technology','var(--stage-navy)'],[76,'$800,000','two Chancellor’s Office positions supporting colleges','var(--stage-muted)']].map(function(a){var d=E('div','abs',null,r,'left:'+a[0]+'cqw;top:38cqw;width:22cqw');E('div',null,a[1],d,'font:900 3.3cqw/1 \'Playfair Display\',Georgia,serif;color:'+a[3]);E('div','ln',a[2],d,'font-size:1.9cqw;margin-top:.6cqw');return d;});
},function(o,t){fade(o.k,t,0.1,0.8);count(o.n,t,0.2,2.4,35000000);o.n.style.transform='scale('+(1+0.08*Math.sin(Math.PI*k(t,2.2,2.9)))+')';reveal(o.l.ws,t,2.2,0.06,0.5);
  o.segs.forEach(function(s,i){var p=eio(k(t,3.6+i*0.7,4.6+i*0.7));s.el.style.width=(s.d[1]*p)+'%';});o.lab.forEach(function(d,i){fade(d,t,4.0+i*0.7,4.8+i*0.7);});});

scene(15,25,'Maximum allocation','Every institution has a maximum allocation, sized by its share of instruction, credit and noncredit together. It sits between a base of 150 thousand and a cap of 400 thousand across the two years. Sample College’s maximum allocation is 345,220 dollars.',function(r,o){
  o.h=words(r,'Every institution has a <span class="blue">maximum allocation</span>','hd');

  o.m=E('div','abs',null,r,'top:22.5cqw;transform:translateX(-50%);text-align:center');E('div','pill','Sample College',o.m,'background:var(--stage-gold);color:var(--stage-ink)');o.mv=E('div',null,'$345,220',o.m,'font:900 3.2cqw/1.2 \'Playfair Display\',Georgia,serif;margin-top:.4cqw');E('div',null,null,o.m,'width:.35cqw;height:3.4cqw;background:var(--stage-gold);margin:.2cqw auto 0');
  o.b=words(r,'Smaller institutions are brought up to the base. The largest are held at the cap.','ln abs');o.b.style.cssText='left:6cqw;right:6cqw;bottom:4cqw';
},function(o,t){reveal(o.h.ws,t,0.1,0.08,0.6);reveal(o.l.ws,t,0.8,0.04,0.5);var p=eio(k(t,1.6,2.6));o.track.style.transform='scaleX('+p+')';o.ticks.forEach(function(d,i){d.style.opacity=eo(k(t,2.0+i*0.35,2.7+i*0.35));});
  var x=back(k(t,4.0,5.6));o.m.style.left='calc(10cqw + '+(78.1*x*0.8)+'%)';o.m.style.opacity=k(t,4.0,4.3);reveal(o.b.ws,t,6.2,0.06,0.5);});

scene(25,32,'Credit and noncredit','Each maximum allocation splits into a credit share and a noncredit share, by the institution’s own instructional mix. Only noncredit outcomes count toward the noncredit share.',function(r,o){
  o.h=words(r,'Every allocation splits in two','hd');
  o.a=E('div','big abs','$345,220',r,'left:50%;top:15cqw;transform:translateX(-50%);font-size:9cqw');
  o.c=E('div','abs',null,r,'top:15cqw;text-align:center;width:36cqw');o.cv=E('div','big blue',null,o.c,'font-size:7cqw');E('div','kick','credit share',o.c,'margin-top:1cqw');
  o.n=E('div','abs',null,r,'top:15cqw;text-align:center;width:36cqw');o.nv=E('div','big gold',null,o.n,'font-size:7cqw');E('div','kick','noncredit share',o.n,'margin-top:1cqw;color:var(--stage-gold-text)');
  o.l=words(r,'The split follows each institution’s own instructional mix. <b>Only noncredit outcomes count toward the noncredit share.</b>','ln abs');o.l.style.cssText='left:6cqw;right:6cqw;top:34cqw';
},function(o,t){reveal(o.h.ws,t,0.1,0.08,0.6);var s=eio(k(t,1.8,3.0));o.a.style.opacity=1-k(t,1.8,2.2);o.a.style.transform='translateX(-50%) scale('+(1+0.15*Math.sin(Math.PI*k(t,1.2,1.8)))+')';
  o.c.style.left=(32-24*s)+'cqw';o.n.style.left=(32+24*s)+'cqw';o.c.style.opacity=o.n.style.opacity=k(t,1.9,2.3);count(o.cv,t,1.9,3.4,340861);count(o.nv,t,1.9,3.4,4358);reveal(o.l.ws,t,3.8,0.05,0.5);});

scene(32,46,'Three priorities','Three priorities carry the funding. Access, 33 percent, counts applied CPL units from students who start at the CPL Portal, a college CPL landing page, or a batch upload. Completion, 34 percent, counts transcribed CPL units with the counselor step checked. Career attainment, 33 percent, counts CPL units for students who reach a career outcome in EDD wage records, measured by the Chancellor’s Office.',function(r,o){

  o.cols=P.map(function(p,i){var d=E('div','abs',null,r,'left:'+(6+i*30)+'cqw;top:13cqw;width:27cqw;padding:2cqw;border-top:.5cqw solid var(--stage-blue);background:var(--surface);border-radius:.4cqw;box-shadow:0 1cqw 2.5cqw -1.5cqw var(--stage-shadow)');
    var n=E('div','big blue','0%',d,'font-size:6.5cqw');E('div',null,p[1],d,'font:700 2.8cqw/1.1 \'Playfair Display\',Georgia,serif;margin:.8cqw 0 1cqw');E('div','ln',p[2],d,'font-size:1.9cqw');return{d:d,n:n,v:p[0]};});
},function(o,t){reveal(o.h.ws,t,0.1,0.08,0.6);o.cols.forEach(function(c,i){var a=1.2+i*4,p=back(k(t,a,a+0.9));c.d.style.opacity=k(t,a,a+0.3);c.d.style.transform='translateY('+((1-p)*6)+'cqw) rotate('+((1-p)*(i-1)*4)+'deg)';
  count(c.n,t,a+0.2,a+1.4,c.v,function(v){return Math.round(v)+'%';});var on=t>=a&&t<a+4;c.d.style.filter=t>=13.2||on||t<a?'none':'saturate(.4) opacity(.55)';});});

scene(46,56,'Targets','Every priority has a target in FTES: 30 semester units of CPL make one FTES, or 45 on a quarter calendar. Sample College’s Access target is 44.3 FTES behind 112,484 dollars. Reach half the target, 22.2 FTES, and it qualifies for 56,242 dollars. Going past the target adds nothing: the share is the ceiling.',function(r,o){

  o.fte=E('div',null,'0.0 FTES',o.row,'font:900 4.6cqw/1 \'Playfair Display\',Georgia,serif');o.usd=E('div','gold',null,o.row,'font:900 4.6cqw/1 \'Playfair Display\',Georgia,serif');

},function(o,t){reveal(o.h.ws,t,0.1,0.08,0.6);reveal(o.l.ws,t,0.9,0.05,0.5);fade(o.card,t,2.0,2.6);
  var f1=eio(k(t,3.0,5.0)),f2=eio(k(t,6.6,7.6)),v=f1*0.5+f2*0.5,over=t>7.6?Math.sin(k(t,7.6,8.4)*Math.PI*3)*(1-k(t,7.6,8.4)):0;
