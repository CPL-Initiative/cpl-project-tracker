<style>
:root{
  --paper:#F4F2ED;--ink:#1C1C1A;--ink-body:#3A3A36;--ink-muted:#5C5C55;--surface:#FFFFFF;
  --cobalt:#0047AB;--cobalt-on-dark:#7DA1D4;--seal-blue:#002F6D;--mustard-fill:#E3B341;--mustard-text:#8B6800;
  --map-navy:#233761;--map-red:#9E2A2B;
  --stage-paper:#FBFAF6;--stage-ink:var(--ink);--stage-body:var(--ink-body);--stage-muted:var(--ink-muted);
  --stage-blue:var(--cobalt);--stage-navy:var(--seal-blue);--stage-gold:var(--mustard-fill);--stage-gold-text:var(--mustard-text);
  --stage-rule:rgba(28,28,26,.16);--stage-track:#E9E5DA;--stage-shadow:rgba(28,28,26,.30);--stage-seg3:#7DA1D4;
  --stage-barrier:#8A8779;--stage-cc-bg:rgba(0,26,61,.86);--stage-cc-text:#FFFFFF;
  --page:var(--paper);--text:var(--ink);--text-body:var(--ink-body);--text-muted:var(--ink-muted);--card:var(--surface);
  --line:rgba(28,28,26,.14);--line-strong:rgba(28,28,26,.32);--btn:var(--surface);--btn-text:var(--ink);
  --btn-strong:var(--ink);--btn-strong-text:var(--paper);--focus:var(--cobalt);--accent-text:var(--mustard-text);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--page:#16171B;--text:#EDEBE5;--text-body:#D3D0C8;--text-muted:#A9A69D;--card:#202227;--line:rgba(237,235,229,.14);--line-strong:rgba(237,235,229,.34);--btn:#202227;--btn-text:#EDEBE5;--btn-strong:#EDEBE5;--btn-strong-text:#16171B;--focus:var(--cobalt-on-dark);--accent-text:var(--mustard-fill);--stage-shadow:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{color-scheme:dark;--page:#16171B;--text:#EDEBE5;--text-body:#D3D0C8;--text-muted:#A9A69D;--card:#202227;--line:rgba(237,235,229,.14);--line-strong:rgba(237,235,229,.34);--btn:#202227;--btn-text:#EDEBE5;--btn-strong:#EDEBE5;--btn-strong-text:#16171B;--focus:var(--cobalt-on-dark);--accent-text:var(--mustard-fill);--stage-shadow:rgba(0,0,0,.6)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font:400 16px/1.55 "Source Sans 3",Arial,sans-serif}
/* The player opens filling the window: the stage takes the largest 16:9 box
   that leaves room for one row of controls (Sam, 2026-09-26: "maybe it should
   just open and use the fullest screen possible"). Full screen goes further. */
.player{--ctl:64px;width:min(100%,calc((100svh - var(--ctl) - 12px) * 16 / 9 + 2 * clamp(8px,1.6vw,16px)));margin:0 auto;padding:clamp(8px,1.6vw,16px) clamp(8px,1.6vw,16px) 0}
.player:fullscreen{width:100vw;height:100vh;padding:0;background:var(--page);display:flex;flex-direction:column;align-items:center;justify-content:center}
.player:fullscreen .stage{width:min(100vw,calc((100vh - var(--ctl)) * 16 / 9));border:0;border-radius:0;box-shadow:none}
.player:fullscreen .controls{width:min(100vw,calc((100vh - var(--ctl)) * 16 / 9));margin-top:8px;padding-inline:12px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:clamp(16px,4vw,32px);padding-block:clamp(16px,3vw,28px) 56px}
.eyebrow{margin:0 0 6px;font-weight:700;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text)}
h1{margin:0;font:700 clamp(1.7rem,1.15rem + 2.2vw,2.7rem)/1.12 "Playfair Display",Georgia,serif;text-wrap:balance}
.dek{margin:8px 0 0;color:var(--text-muted);max-width:var(--cpl-measure,none)}
.stage{position:relative;width:100%;aspect-ratio:16/9;background:var(--stage-paper);border:1px solid var(--line);border-radius:6px;overflow:hidden;container-type:inline-size;box-shadow:0 14px 36px -22px var(--stage-shadow);color:var(--stage-ink)}
/* Type and marks are sized to fill the frame (Sam, 2026-09-26: "sized to fill
   the screen for readability and dramatic effect"): at 1920 wide a body line
   is 63px and a headline 115px. */
.sc{position:absolute;inset:0;padding:3.6cqw 4.5cqw;visibility:hidden}
.w,.ch{display:inline-block;will-change:transform,opacity}
.hd{margin:0;font:700 6cqw/1.06 "Playfair Display",Georgia,serif;letter-spacing:-.012em}
.ln{margin:0;font:400 3.3cqw/1.28 "Source Sans 3",Arial,sans-serif;color:var(--stage-body)}
.ln b{color:var(--stage-ink);font-weight:700}
.big{font:900 14cqw/1 "Playfair Display",Georgia,serif;letter-spacing:-.02em;font-variant-numeric:lining-nums tabular-nums}
.gold{color:var(--stage-gold-text)}.blue{color:var(--stage-blue)}
.kick{font:700 2.1cqw/1.1 "Source Sans 3",Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--stage-blue)}
/* captions for the narrated cut: one cue at a time, bottom center, over the scene */
.cc{position:absolute;left:8cqw;right:8cqw;bottom:2.2cqw;z-index:30;margin:0;text-align:center;pointer-events:none;text-wrap:balance}
.cc span{background:var(--stage-cc-bg);color:var(--stage-cc-text);font:600 2.3cqw/1.55 "Source Sans 3",Arial,sans-serif;padding:.3cqw .9cqw;border-radius:.4cqw;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.abs{position:absolute}
.bar{position:absolute;height:6cqw;border-radius:.7cqw;overflow:hidden;background:var(--stage-track)}
.fill{position:absolute;top:0;bottom:0;left:0}
.pill{display:inline-block;white-space:nowrap;padding:.5cqw 1.3cqw;border-radius:99px;font:700 2cqw/1 "Source Sans 3",Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase}
/* The logo lockup: the CPL Initiative logo leads and is the largest mark; the
   MAP wordmark (its arrow cut out, so the flying arrow is the only one) sits
   beneath at three-fifths the width with the platform's long name and tagline
   (Sam, 2026-09-26: "the CPL Initiative logo should still be the most
   prominent but the MAP logo gets second fiddle and special treatment"). */
.lock{position:absolute;left:4.5cqw;top:13.5cqw;width:46cqw;text-align:center;color:var(--map-navy)}
.lock img{display:block;margin:0 auto}
.lock .cpl{width:100%}
.lock .rule{height:.36cqw;background:var(--map-navy);margin:1.4cqw 0 1.6cqw}
.lock .map{width:58%}
.lock .l1{margin:.5cqw 0 0;font:700 2cqw/1.2 "Source Sans 3",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.lock .l2{margin:.15cqw 0 0;font:italic 600 1.55cqw/1.25 "Source Sans 3",Arial,sans-serif}
.arrow{position:absolute;left:0;top:0;width:3.1cqw;height:auto;z-index:4;pointer-events:none;transform-origin:50% 58%;will-change:transform}
/* The trail: a few copies of the arrow lagging behind it, each fainter and
   smaller, so the mark reads as a small ship under way (Sam, 2026-09-26). */
.ghost{position:absolute;left:0;top:0;width:3.1cqw;height:auto;z-index:3;pointer-events:none;transform-origin:50% 58%;will-change:transform;filter:blur(.15cqw)}
/* The barriers: pixel invaders the arrow shoots down between scenes (Sam,
   2026-09-26: "fire at barriers to CPL we hope to bring down... like the old
   Space Invaders arcade game... have to be sly with it"). */
.inv{position:absolute;z-index:3;pointer-events:none;visibility:hidden}
.inv i{position:absolute;display:block;background:var(--stage-barrier)}
.inv .cap{position:absolute;left:50%;top:100%;margin-top:1cqw;transform:translateX(-50%);white-space:nowrap;font:700 1.9cqw/1 "Source Sans 3",Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--stage-muted)}
.inv .strike{position:absolute;left:0;right:0;top:50%;height:.3cqw;background:var(--map-red);transform-origin:left;transform:scaleX(0)}
.bolt{position:absolute;z-index:3;width:.4cqw;height:2.4cqw;border-radius:.2cqw;background:var(--map-red);pointer-events:none;visibility:hidden}
.bigplay{position:absolute;left:50%;top:88%;transform:translate(-50%,-50%);min-height:48px;padding:0 1.6em;border:0;border-radius:999px;background:var(--stage-ink);color:var(--stage-paper);font:700 clamp(15px,1.7cqw,22px)/1 "Source Sans 3",Arial,sans-serif;cursor:pointer;z-index:5}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line-strong);background:var(--btn);color:var(--btn-text);font:600 1rem/1 "Source Sans 3",Arial,sans-serif;text-decoration:none;cursor:pointer}
.btn.strong{min-width:96px;background:var(--btn-strong);color:var(--btn-strong-text);border-color:var(--btn-strong)}
.scrub{flex:1 1 200px;display:flex;min-width:0}.scrub input{width:100%;height:28px;margin:0;accent-color:var(--text)}
output{min-width:7.5ch;font-variant-numeric:tabular-nums;color:var(--text-muted)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.scenes{margin-top:clamp(28px,5vw,44px)}
.scenes h2{margin:0 0 12px;font:700 1.35rem/1.2 "Playfair Display",Georgia,serif}
.chapters{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.chap{width:100%;height:100%;display:grid;gap:4px;align-content:start;padding:12px 14px;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;cursor:pointer}
.chap[aria-current="true"]{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.chap .tc{font-size:.8rem;font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums;color:var(--accent-text)}
.chap .nm{font-weight:700}.chap .tx{font-size:.95rem;line-height:1.45;color:var(--text-body)}
@media (max-width:560px){.player{--ctl:112px}}
</style>

<div class="player" id="player">
  <div class="stage" id="stage" role="region" aria-label="The Ironworker pathway film">
    <p class="vh" id="said" aria-live="polite"></p>
    <img class="arrow" id="arrow" src="__ARROW__" alt="" aria-hidden="true">
    <div id="trail" aria-hidden="true"></div>
    <div id="fx" aria-hidden="true"></div>
    <button type="button" class="bigplay" id="bigplay">Play the film</button>
  </div>
  <div class="controls">
    <button type="button" class="btn strong" id="play">Play</button>
    <button type="button" class="btn" id="replay">Replay</button>
    <div class="scrub"><label for="pos" class="vh">Position in the film</label><input type="range" id="pos" min="0" max="100" step="0.05" value="0"></div>
    <output id="time" for="pos">0:00</output>
    <button type="button" class="btn" id="sound">Mute</button>
    <button type="button" class="btn" id="fs">Full screen</button>
    <a class="btn" id="dl" href="__MP4URL__" target="_blank" rel="noopener">Download MP4</a>
    <a class="btn" id="to-pathways" href="__LINK__">See it on CPL Pathways</a>
  </div>
</div>
<main class="wrap">
  <header>
    <p class="eyebrow">__EYEBROW__</p>
    <h1>From High School to the Job Site</h1>
    <p class="dek">__DEK__</p>
  </header>
  <p style="margin:14px 0 0">Every step, with its sources and the lines still to confirm: <a href="__LINK__" style="color:var(--focus);font-weight:600">__LINKLABEL__</a></p>
  <section class="scenes" aria-labelledby="sh"><h2 id="sh">Scenes</h2><ol class="chapters" id="chapters"></ol></section>
</main>

<script>
(function(){
'use strict';
var LOGO='__LOGO__',MAP='__MAP__',CFG=__CFG__;
var LINK=CFG.link,HOW=null,D=0,FILM=100,NARR=null,DUR=FILM;
/* The funding film's clock, without its targets slide or a narration: film
   time is player time. LS stays so the engine's helpers read the same. */
function LS(t){return t;}
var $=function(i){return document.getElementById(i);};
var stage=$('stage'),said=$('said'),arrow=$('arrow'),player=$('player');
var reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
/* ---- motion helpers: every value is a pure function of the clock ---- */
function cl(x){return x<0?0:x>1?1:x;}
function eo(x){x=cl(x);return 1-Math.pow(1-x,3);}
function eio(x){x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
function back(x){x=cl(x);var c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);}
function k(t,a,b){return cl((t-a)/(b-a));}
function E(tag,cls,html,par,css){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(css)e.style.cssText=css;if(par)par.appendChild(e);return e;}
function words(par,html,cls){var box=E('p',cls,null,par),tmp=document.createElement('div'),out=[];tmp.innerHTML=html;(function walk(src,dst){Array.prototype.slice.call(src.childNodes).forEach(function(n){if(n.nodeType===3){n.textContent.split(/(\s+)/).forEach(function(p){if(!p)return;if(/^\s+$/.test(p)){dst.appendChild(document.createTextNode(' '));return;}out.push(E('span','w',null,dst));out[out.length-1].textContent=p;});}else if(n.nodeType===1){var c=n.cloneNode(false);dst.appendChild(c);walk(n,c);}});})(tmp,box);box.ws=out;return box;}
function chars(par,text,cls){var box=E('p',cls,null,par);box.cs=[];text.split(' ').forEach(function(wd,i){if(i)box.appendChild(document.createTextNode(' '));var w=E('span',null,null,box,'display:inline-block;white-space:nowrap');wd.split('').forEach(function(c){box.cs.push(E('span','ch',c,w));});});return box;}
function reveal(arr,t,start,step,dur,style){arr.forEach(function(el,i){var p=eo(k(t,start+i*step,start+i*step+dur));if(reduced)p=t>=start+i*step?1:0;
  if(style==='drop'){el.style.opacity=p;el.style.transform='translateY('+((1-p)*-0.9)+'em) scale('+(1+(1-p)*0.6)+')';el.style.filter='blur('+((1-p)*8)+'px)';}
  else{el.style.opacity=p;el.style.transform='translateY('+((1-p)*0.55)+'em)';el.style.filter='blur('+((1-p)*5)+'px)';}});}
function fade(el,t,a,b){var p=eo(k(t,a,b));el.style.opacity=p;el.style.transform='translateY('+((1-p)*1.2)+'cqw)';}
function money(n){return '$'+Math.round(n).toLocaleString('en-US');}
function count(el,t,a,b,v,fmt){el.textContent=(fmt||money)(v*eio(k(t,a,b)));}
var PF="'Playfair Display',Georgia,serif";
/* ---- the logo lockup, shared by the first and last scene ---- */
function lockup(r){var d=E('div','lock',null,r);var c=E('img','cpl',null,d);c.src=LOGO;c.alt='California Community Colleges Credit for Prior Learning Initiative';E('div','rule',null,d);var m=E('img','map',null,d);m.src=MAP;m.alt='MAP';E('p','l1','Mapping Articulated Pathways',d);E('p','l2','With Credit for Prior Learning for Working Adults &amp; Veterans',d);d.map=m;return d;}
/* ---- the script ---- */
var S=[];
function scene(t0,t1,name,text,build,update,raw){if(!raw){t0=LS(t0);t1=t1>46?t1+D:t1;}var root=E('div','sc',null,stage);var o={t0:t0,t1:t1,name:name,text:text,root:root,u:update};build(root,o);S.push(o);return o;}

/* Every on-screen fact is a line the CPL Pathways ladder marks In our data
   (cpl_pathways_data.js, cerritos-ironworker-ladder) or the display build's
   figure for the A.S. (cpl_pathways_roep_data.js, cerritos_42158). build.py's
   CONFIG carries each figure with its source; nothing here is typed twice.
   Left out on purpose (S330, with Fable's critique): the noncredit step (the
   Pre-Apprenticeship certificate admits registered apprentices only, and none of
   the 26 mirror courses has a section this year), the B.S.'s 2024 proposed course
   list, and anything the ladder still marks To confirm. */
var F=CFG.facts;
function units(n){return (Math.round(n*10)/10).toFixed(n%1?1:0);}
function card(r,css,head,sub,tail){var d=E('div','abs',null,r,css+';padding:1.8cqw 2cqw;background:var(--surface);border-top:.6cqw solid var(--stage-blue);border-radius:.5cqw;box-shadow:0 1cqw 2.5cqw -1.5cqw var(--stage-shadow)');
  d.h=E('div',null,head,d,'font:900 4.2cqw/1 '+PF);d.s=E('div','ln',sub,d,'font-size:2.3cqw;line-height:1.25;margin-top:.8cqw');if(tail)d.t=E('div','kick',tail,d,'margin-top:1cqw;font-size:2cqw');return d;}

var S0=scene(0,6,'Title',CFG.titleText,function(r,o){
  o.lock=lockup(r);
  o.k=E('p','kick',CFG.kick,r,'position:absolute;left:55cqw;right:4cqw;top:11.2cqw;font-size:2.1cqw;line-height:1.25');
  o.t=chars(r,'From high school to the job site','hd');o.t.style.cssText='position:absolute;left:55cqw;right:4cqw;top:18.8cqw;font-size:6.2cqw;line-height:1.04';
  o.s=E('p','ln',CFG.sub,r,'position:absolute;left:55cqw;right:4cqw;top:41.5cqw;font-size:2.6cqw');
},function(o,t){o.lock.style.opacity=eo(k(t,0.2,1.4));fade(o.k,t,0.9,1.5);reveal(o.t.cs,t,1.3,0.035,0.7,'drop');fade(o.s,t,3.4,4.2);});

var S1=scene(6,17,'High school',F.start.text,function(r,o){
  o.k=E('p','kick','Start · High school',r,'position:absolute;left:4.5cqw;top:3.6cqw');
  o.h=words(r,F.start.head,'hd');o.h.style.cssText='margin-top:3.4cqw;font-size:5cqw';
  o.l=words(r,F.start.lead,'ln');o.l.style.cssText='margin-top:1cqw;font-size:2.9cqw';
  o.c=F.start.courses.map(function(c,i){return card(r,'left:'+(4.5+i*31)+'cqw;top:22.5cqw;width:29cqw',c[0],c[1],units(c[2])+(c[2]===1?' unit':' units'));});
  o.sum=E('div','abs',null,r,'left:68cqw;top:22.5cqw;width:27.5cqw;text-align:center');o.sv=E('div','big gold','0',o.sum,'font-size:11cqw');E('div','kick','units mapped',o.sum,'margin-top:.6cqw;color:var(--stage-gold-text)');
  o.b=words(r,F.start.route,'ln abs');o.b.style.cssText='left:4.5cqw;right:4.5cqw;bottom:2.6cqw;font-size:2.8cqw';
},function(o,t){fade(o.k,t,0.1,0.7);reveal(o.h.ws,t,0.2,0.08,0.6);reveal(o.l.ws,t,1.2,0.05,0.5);
  o.c.forEach(function(d,i){var a=2.4+i*1.6,p=back(k(t,a,a+0.8));d.style.opacity=k(t,a,a+0.3);d.style.transform='translateY('+((1-p)*5)+'cqw)';});
  fade(o.sum,t,5.6,6.2);count(o.sv,t,5.6,6.8,F.start.sum,function(v){return v.toFixed(1);});reveal(o.b.ws,t,7.4,0.05,0.5);});

var S2=scene(17,30,'Apprenticeship',F.app.text,function(r,o){
  o.k=E('p','kick','Apprenticeship · '+F.app.locals,r,'position:absolute;left:4.5cqw;top:3.6cqw');
  o.h=words(r,F.app.head,'hd');o.h.style.cssText='margin-top:3.4cqw;font-size:5cqw';
  o.n=F.app.hours.map(function(h,i){var d=E('div','abs',null,r,'left:'+(4.5+i*31)+'cqw;top:18.4cqw;width:29cqw');d.v=E('div','big blue','0',d,'font-size:11cqw');E('div','kick',h[1],d,'margin-top:.6cqw');return d;});
  o.sec=words(r,F.app.sections,'ln abs');o.sec.style.cssText='left:4.5cqw;right:4.5cqw;top:38cqw;font-size:3cqw';
  o.b=words(r,F.app.cpl,'ln abs');o.b.style.cssText='left:4.5cqw;right:4.5cqw;bottom:2.6cqw;font-size:3.4cqw';
},function(o,t){fade(o.k,t,0.1,0.7);reveal(o.h.ws,t,1.2,0.08,0.6);
  o.n.forEach(function(d,i){var a=2.2+i*1.8;fade(d,t,a,a+0.5);count(d.v,t,a,a+1.4,F.app.hours[i][0],function(v){return Math.round(v).toLocaleString('en-US');});});
  reveal(o.sec.ws,t,6.4,0.05,0.5);reveal(o.b.ws,t,8.6,0.06,0.5);});

var S3=scene(30,37,'Certificates',F.cert.text,function(r,o){
  o.h=words(r,F.cert.head,'hd');o.h.style.fontSize='5.4cqw';
