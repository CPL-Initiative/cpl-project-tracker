<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyView</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ══ First Light tokens (docs/kb-notes/reference-ui-design-system.md) ══ */
:root{
  --paper:#F4F2ED; --text-strong:#1C1C1A; --text-body:#3A3A36; --text-muted:#5C5C55;
  --text-faint:#87877F; --surface:rgba(255,255,255,.78); --surface-opaque:#FFFFFF;
  --surface-subtle:#F7F5F1; --surface-muted:#ECE9E2;
  --border:rgba(28,28,26,.14); --border-strong:rgba(28,28,26,.30);
  --cobalt:#0047AB; --crimson:#920000; --hunter:#2C601A; --violet:#6D28D9;
  --mustard-fill:#E3B341; --mustard-text:#8B6800;
  --seal-blue:#002F6D;
  --focus-ring:#0047AB;
  --cpl-measure:none;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--text-body);
     font-family:var(--sans);font-size:clamp(15px,.95rem + .1vw,16.5px);line-height:1.55;}
h1,h2,h3{font-family:var(--serif);color:var(--text-strong);line-height:1.2;margin:0 0 .35em}
h1{font-size:clamp(1.6rem,1.3rem + 1.4vw,2.3rem)}
h2{font-size:clamp(1.2rem,1.05rem + .7vw,1.6rem)}
h3{font-size:clamp(1rem,.95rem + .3vw,1.15rem)}
p{margin:0 0 .8em;max-width:var(--cpl-measure,none)}
a{color:var(--cobalt)}
:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px;border-radius:3px}
.skip{position:absolute;left:-9999px;top:0;background:var(--surface-opaque);
      color:var(--cobalt);padding:10px 16px;z-index:100;border:2px solid var(--cobalt);border-radius:0 0 6px 0}
.skip:focus{left:0}
.wrap{max-width:1180px;margin:0 auto;padding:clamp(16px,3vw,32px)}

/* ── masthead ── */
.mast{background:var(--surface);border-bottom:1px solid var(--border);
      backdrop-filter:blur(6px);position:sticky;top:0;z-index:20}
.mast .wrap{padding-top:14px;padding-bottom:14px;display:flex;flex-wrap:wrap;
            gap:12px;align-items:baseline;justify-content:space-between}
.mast .brand{font-family:var(--serif);font-weight:700;font-size:1.15rem;color:var(--text-strong)}
.mast .tag{color:var(--text-muted);font-size:.82rem}
.msearch{display:flex;gap:7px;align-items:center;flex:1 1 260px;max-width:560px;min-width:0}
/* Suggestions. The wrapper is the positioning context so the list hangs under
   the input rather than under the whole form (which includes the button). */
.sugwrap{position:relative;flex:1 1 auto;min-width:0;display:flex}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:60;margin:0;padding:4px 0;
  list-style:none;background:var(--surface-opaque,#fff);border-radius:9px;
  border:1px solid var(--border-strong,rgba(28,28,26,.30));box-shadow:0 12px 30px rgba(20,20,30,.17);
  max-height:min(58vh,420px);overflow-y:auto}
.sug li{display:flex;gap:.55em;align-items:baseline;padding:.42em .7em;cursor:pointer}
.sug li.on{background:var(--surface-subtle,#F7F5F1)}
/* The kind is a WORD. Two different destinations must not be told apart by a
   color or an icon alone. */
.sg-k{flex:none;font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;
  color:var(--text-muted,#5C5C55);min-width:4.4em}
.sg-l{flex:1 1 auto;min-width:0;font-size:.88rem;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg-r{flex:none;font-size:.76rem;color:var(--text-muted,#5C5C55);white-space:nowrap}
@media (max-width:560px){.sg-r{display:none}}
.msearch input{flex:1 1 auto;min-width:0;font:inherit;font-size:.88rem;padding:8px 11px;
  border:1px solid var(--border-strong);border-radius:7px;background:var(--surface-opaque);color:var(--text-body)}
.hits{list-style:none;margin:0 0 22px;padding:0;display:flex;flex-direction:column;gap:8px}
.hits li{background:var(--surface-opaque);border:1px solid var(--border);border-radius:9px}
.hits button{width:100%;text-align:left;background:none;border:0;font:inherit;color:inherit;
  cursor:pointer;padding:11px 13px;display:flex;flex-direction:column;gap:4px;border-radius:9px}
.hits button:hover{background:var(--surface-muted)}
.hits .why{font-size:.79rem;color:var(--text-muted)}
.hits mark{background:#FBEFC9;color:var(--text-strong);padding:0 2px;border-radius:2px;font-weight:600}
.hits .path{font-size:.76rem;color:var(--text-muted)}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.85rem;
        color:var(--text-muted);margin:0 0 14px;padding:0;list-style:none}
.crumbs li::after{content:"›";margin-left:6px;color:var(--text-faint)}
.crumbs li:last-child::after{content:""}
.crumbs button{background:none;border:0;color:var(--cobalt);cursor:pointer;
               font:inherit;padding:2px 3px;text-decoration:underline}

/* ── stat strip ── */
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:0 0 22px}
.stat{background:var(--surface-opaque);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.stat .n{font-family:var(--serif);font-size:clamp(1.35rem,1.1rem + .8vw,1.85rem);
         font-weight:700;color:var(--text-strong);display:block;line-height:1.1}
.stat .l{font-size:.76rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.stat .s{font-size:.8rem;color:var(--text-body);margin-top:4px}

.hero{background:var(--surface-opaque);border:1px solid var(--border);border-radius:12px;
      padding:14px;margin:0 0 22px;display:grid;gap:14px;
      grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:center}
.hero>*{min-width:0}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero .frame{background:var(--surface-subtle);border:1px solid var(--border);
             border-radius:9px;overflow:hidden}
.hero .frame svg{display:block;width:100%;height:auto}
.hero h2{margin:0 0 6px}
.hero p{margin:0 0 10px;font-size:.92rem}
.hero .row{display:flex;gap:8px;flex-wrap:wrap}
.hero .cap{font-size:.78rem;color:var(--text-muted);margin:8px 0 0}
.lede{background:var(--surface-opaque);border:1px solid var(--border);
      border-left:4px solid var(--cobalt);border-radius:8px;padding:14px 18px;margin:0 0 22px}
.lede p:last-child{margin-bottom:0}
.note{background:var(--surface-subtle);border:1px solid var(--border);
      border-left:4px solid var(--mustard-text);border-radius:8px;padding:12px 16px;margin:0 0 20px;font-size:.9rem}
.note p:last-child{margin-bottom:0}

/* ── toolbar ── */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 16px}
.tools input[type=search],.tools select{font:inherit;font-size:.88rem;padding:7px 10px;
  border:1px solid var(--border-strong);border-radius:7px;background:var(--surface-opaque);
  color:var(--text-body);min-width:0}
.tools label{font-size:.85rem;color:var(--text-muted);display:flex;gap:6px;align-items:center}
.btn{font:inherit;font-size:.85rem;font-weight:600;padding:7px 13px;border-radius:7px;
     border:1px solid var(--border-strong);background:var(--surface-opaque);
     color:var(--text-strong);cursor:pointer}
.btn:hover{background:var(--surface-muted)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:var(--on-accent,#fff)}
.btn.primary:hover{background:#003a8c}
.btn[aria-pressed=true]{background:var(--cobalt);border-color:var(--cobalt);color:var(--on-accent,#fff)}

/* ── forest grid ── */
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.cell{background:var(--surface-opaque);border:1px solid var(--border);border-radius:10px;
      padding:12px 13px;text-align:left;cursor:pointer;font:inherit;color:inherit;
      display:flex;flex-direction:column;gap:7px;min-height:104px}
.cell:hover{border-color:var(--cobalt);box-shadow:0 2px 10px rgba(28,28,26,.09)}
.cell .nm{font-weight:600;color:var(--text-strong);font-size:.92rem;line-height:1.25}
.cell .meta{font-size:.76rem;color:var(--text-muted)}
.cell .dec{font-family:var(--serif);font-size:1.5rem;font-weight:700;color:var(--text-strong)}
.cell.triage{border-left:4px solid var(--mustard-text);background:var(--surface-subtle)}
.cell.demo{border-left:4px solid var(--cobalt)}
.bar{height:7px;border-radius:4px;background:var(--surface-muted);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar i.f{background:var(--crimson)}
.bar i.o{background:var(--violet)}
.bar i.r{background:var(--hunter)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--text-muted);margin:10px 0 18px}
.legend span{display:flex;gap:5px;align-items:center}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}

/* ── decision cards ── */
.decks{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(255px,1fr))}
.deck{background:var(--surface-opaque);border:1px solid var(--border);border-radius:10px;
      padding:12px 13px;cursor:pointer;font:inherit;color:inherit;text-align:left;
      display:flex;flex-direction:column;gap:8px}
.deck:hover{border-color:var(--cobalt);box-shadow:0 2px 10px rgba(28,28,26,.09)}
.deck .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.deck .sz{font-family:var(--serif);font-weight:700;color:var(--text-strong)}
.deck ul{margin:0;padding-left:1.05em;font-size:.82rem;color:var(--text-body)}
.deck li{margin:1px 0}
.deck .more{font-size:.78rem;color:var(--text-muted)}

/* ── chips ── */
.chip{border-radius:10px;font-size:.7rem;font-weight:600;padding:2px 8px;
      display:inline-flex;gap:4px;align-items:center;white-space:nowrap;border:1px solid transparent}
.chip.flag{background:#FCEDED;color:var(--crimson);border-color:#E7BDBD}
.chip.gen{background:#F1EAFC;color:var(--violet);border-color:#D5C4F2}
.chip.ok{background:#EAF1E6;color:var(--hunter);border-color:#C2D6B9}
.chip.mut{background:var(--surface-muted);color:var(--text-muted);border-color:var(--border)}
.chip.cid{background:#E7EEF9;color:var(--cobalt);border-color:#BBD0EC}

/* ── graph ── */
.stage{display:grid;gap:14px;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}
.stage>*{min-width:0}
.side,.panel,.idlist>li{min-width:0}
@media (max-width:900px){.stage{grid-template-columns:1fr}}
.canvas{background:var(--surface-opaque);border:1px solid var(--border);border-radius:10px;
        position:relative;overflow:hidden}
.canvas svg{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
.canvas svg:active{cursor:grabbing}
.gbar{display:flex;gap:6px;align-items:center;padding:0 0 8px}
.gbar .sub{margin-left:auto;color:var(--text-muted);font-size:.82rem}
.hint{font-size:.8rem;color:var(--text-muted);padding:9px 13px;border-top:1px solid var(--border);
      background:var(--surface-subtle)}

.glegend{display:flex;flex-wrap:wrap;gap:12px;margin-top:7px;
         padding-top:7px;border-top:1px dashed var(--border);font-size:.76rem}
.glegend span{display:flex;gap:4px;align-items:center;white-space:nowrap}
.glegend b{font-size:.95rem;line-height:1}
.sdot{width:9px;height:9px;border-radius:50%;display:inline-block}
.side{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface-opaque);border:1px solid var(--border);border-radius:10px;padding:13px 14px}
/* The two panels below the map are h3 under the panes' h2, which sits under
   the row's h1 — `npm run a11y` reported the skip when they were h3 under an
   h1, and then a solo view with no heading at all. Their SIZE stays what the
   first h3 measured (18.4px/700): the fix is to the outline a screen reader
   walks, not to the page. */
.panel h3{font-size:18.4px;font-weight:700;margin:0 0 8px}
.panel h2{font-size:18.4px;font-weight:700;margin:0 0 8px}
.idlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.idlist>li{border:1px solid var(--border);border-radius:8px;padding:9px 10px;background:var(--surface-subtle)}
.idlist .ttl{font-weight:600;color:var(--text-strong);font-size:.9rem}
.idlist .sub{font-size:.76rem;color:var(--text-muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.mlist{list-style:none;margin:7px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.mlist li{display:flex;gap:7px;align-items:baseline;font-size:.8rem;flex-wrap:wrap;
          background:var(--surface-opaque);border:1px solid var(--border);
          border-radius:6px;padding:4px 7px;min-width:0}
.mlist .cd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:600;
           color:var(--text-strong);white-space:nowrap;min-width:0}
/* the college name is the one part that may be truncated — full value in title="" */
.mlist .co{color:var(--text-muted);font-size:.75rem;min-width:0;flex:1 1 auto;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlist .mv{margin-left:auto;font:inherit;font-size:.72rem;font-weight:600;
           background:none;border:1px solid var(--border-strong);border-radius:5px;
           padding:1px 6px;cursor:pointer;color:var(--cobalt);white-space:nowrap}
.mlist .mv:hover{background:var(--cobalt);color:#fff;border-color:var(--cobalt)}
.mlist li.moved{border-color:var(--hunter);background:#EAF1E6}
/* A card being dragged onto. Outline + tint, never tint alone: the cards
   already carry state colors and one more wash of color reads as noise. */
#ids > li.drop-to{outline:2px solid var(--brand,#6D28D9);outline-offset:2px;
  background:#F4F0FC}
/* A course whose control number names several courses cannot be re-homed —
   the CN: write key cannot say which. Dotted underline so the state survives
   greyscale; the chip beside it carries the words. */
.mlist li.shared .cd{text-decoration:underline dotted}
.mlist .chip.warn{background:#FBF1D8;color:#6B4E00;border:1px solid #8B6800}
.writes{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.75rem;
        background:var(--surface-subtle);border:1px solid var(--border);border-radius:7px;
        padding:9px 11px;overflow-x:auto;color:var(--text-body)}
.writes div{white-space:pre;padding:1px 0}
.empty{color:var(--text-muted);font-size:.85rem;font-style:italic}
.node-l{font-size:11px;font-family:var(--sans);pointer-events:none;
        paint-order:stroke fill;stroke:var(--surface-opaque);stroke-width:3.5px;
        stroke-linejoin:round}
.node-g{font-size:13px;font-family:var(--sans);pointer-events:none}
/* ── SkyView, full bleed (Sam, 2026-09-03: "open full screen so users have
   more work space and allow scroll down to see the other info") ── */
main.u-fullbleed{max-width:none;padding:0}
/* On the map the top row carries the Views menu, so the crumbs row would say
   the same thing twice and cost the map a line (Sam, 2026-09-03: "I want to
   maximize the SkyView window"). */
main.u-fullbleed .crumbrow{display:none}
/* ── the crumbs row carries the Views menu on every view that is NOT the map
   (Sam, item 9, 2026-09-04: every view reachable from every other). One
   builder (ccr_universe.js viewsMenuInto) renders it here and in the map's
   own top row, so a view added there is reachable everywhere at once. ── */
.crumbrow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin:0 0 14px}
.crumbrow .crumbs{margin:0}
.u-views-menu .u-views-here{display:flex;align-items:center;min-height:28px;padding:2px 8px;
                            font-size:.86rem;color:var(--text-muted)}
/* ── SkyView ALONE (Sam, 2026-09-05: "The full screen SkyView … I would like to
   henceforth refer to as SkyView"): the map section is the whole window. The
   masthead, the crumbs, the panes below and the footer are not painted — the
   same set browser full screen leaves out, which is what it looked like to him.
   The comprehensive view is the SAME render with this class off, so switching
   keeps the zoom, the selection and the moves. Narrow screens still scroll:
   the details panel docks under the canvas there and needs the room. ── */
body.u-solo .mast,body.u-solo .crumbrow,body.u-solo #u-below,body.u-solo main>footer{display:none}
body.u-solo .u-full{border-top:0;border-bottom:0}
@media (min-width:700px){body.u-solo{overflow:hidden}}
/* ── the workspace: disciplines, subjects and ESL packaging on ONE tab (Sam,
   items 6-9, 2026-09-04, restated 2026-09-05) ── */
.ws-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin:0 0 6px}
.ws-head h1{margin:0}
.ws-lede{max-width:var(--cpl-measure,none);margin:0 0 12px;font-size:.95rem}
.ws-bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 4px}
.ws-seg .btn.mode{font-size:.85rem;padding:7px 14px;min-height:28px}
.ws-tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:14px 0 8px}
.ws-tools label{font-size:.85rem;color:var(--text-muted)}
.ws-tools input[type=search]{flex:1 1 260px;min-width:0;max-width:520px;font:inherit;font-size:.88rem;
  padding:7px 10px;border:1px solid var(--border-strong);border-radius:7px;background:var(--surface-opaque);color:var(--text-body)}
table.ws-table{table-layout:fixed}
table.ws-table th.n,table.ws-table td.n{text-align:right;font-variant-numeric:tabular-nums}
table.ws-table td{overflow-wrap:anywhere}
table.ws-table .btn.small{white-space:nowrap;min-height:24px}
table.ws-table td .btn.small+.btn.small{margin-left:4px}
.ws-note{font-size:.8rem;color:var(--text-muted)}
p.ws-note{margin:.8em 0 0;max-width:var(--cpl-measure,none)}
.u-full{position:relative;width:100%;background:var(--surface-opaque);
        border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.u-top{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;
       padding:6px clamp(12px,2vw,24px);border-bottom:1px solid var(--border);background:var(--surface-subtle)}
.u-nav{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;font-size:.86rem}
/* ⚠️ min-height is WCAG 2.2 SC 2.5.8, not styling. `npm run a11y` measured
   these four at 21.3px — including the CCR link added the same session.
   The inline-target exception covers a link inside a SENTENCE; a nav row
   of view switchers is not one. display:inline-flex is what lets a
   min-height apply to an inline-level control at all. */
.u-nav .linkish{font-size:.86rem;display:inline-flex;align-items:center;min-height:24px}
/* .u-modes is specifically "what a drag does" (Pan / Move) and a harness check
   depends on that meaning, so the CR/NC filter takes .u-seg and they share only
   the segmented LOOK. */
.u-modes,.u-seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:999px;overflow:hidden;margin-right:4px}
.u-modes .btn.mode,.u-seg .btn.mode{border:0;border-radius:0;background:var(--surface-opaque);color:var(--text-body);backdrop-filter:none}
.u-modes .btn.mode[aria-pressed=true],.u-seg .btn.mode[aria-pressed=true]{background:var(--seal-blue,#002F6D);color:var(--on-accent,#fff)}
.u-stage{display:flex;align-items:stretch;min-width:0}
.u-foot{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:flex-start;
        padding:6px clamp(12px,2vw,24px);border-top:1px solid var(--border);background:var(--surface-subtle)}
.u-foot .u-legend,.u-foot .u-hint{background:none;border:0;backdrop-filter:none;padding:0;max-width:none;border-radius:0}
.u-foot .u-hint{flex:1 1 320px}
.u-foot .u-legend{flex:0 1 auto}
.u-sw.member{border-radius:1px;border-width:1.5px;border-color:var(--cobalt);background:var(--sky-hollow,#fff)}
/* Noncredit reads as a BROKEN ring on the map, so the legend swatch shows the
   same break rather than describing it. Stroke, not colour: colour is already
   spent on the identity system. */
.u-sw.nc{width:13px;height:13px;border:1.5px dashed var(--text-muted);
  background:radial-gradient(circle,var(--text-muted) 0 2.6px,transparent 3.2px)}
.u-crnc{margin-left:2px}
.u-wrap{position:relative;flex:1 1 auto;min-width:0;width:auto;height:78vh;overflow:hidden;background:var(--surface-opaque)}
.u-wrap canvas{display:block;width:100%;height:100%;touch-action:none;cursor:default}
.u-wrap canvas:focus-visible{outline:3px solid var(--focus-ring);outline-offset:-3px}
.u-ov{position:absolute;z-index:3;margin:0}
.u-ov-tl{top:10px;left:12px;max-width:calc(100% - 24px)}
.u-ov-bl{left:12px;bottom:58px}
.u-ov-b{left:12px;bottom:10px;max-width:min(640px,calc(100% - 24px))}
.u-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0}
/* ── item 8 (Sam, 2026-09-04): the controls ride the masthead's title row ──
   The bar is MOVED there by ccr_universe.js, not copied, and moved back
   inside #u-full for full screen (the browser paints only that element).
   min-width:0 so it can shrink beside the search rather than push it. */

/* ⚠️ THE MASTHEAD IS STICKY (z-index 20), so anything scrolled to the top of the
   viewport lands UNDERNEATH it. That was survivable while the controls sat on a
   second row well down the page; consolidating to one row and giving the map
   more height put them right at the boundary, and Chromium reported every link
   in this row unclickable — the masthead was intercepting the pointer. Reserve
   the header's height when scrolling anything in this row into view. */
.u-top,.u-top .linkish,.u-top .btn{scroll-margin-top:96px}
/* One row: title | links | controls, with the controls pushed right. The row
   only wraps when it genuinely cannot fit, and min-width:0 lets it try. */
.u-top{flex-wrap:nowrap;gap:6px 14px}
.u-top .u-nav{min-width:0;flex:0 1 auto}
.u-top .u-bar{margin-left:auto;min-width:0;flex:0 1 auto}
/* One chip size at every width since 2026-09-05 (item 7) — see the block
   further down; the row wraps below 1100px instead of shrinking. */
/* ── the 2026-09-04 top row: title · views · search · controls · close ──────
   Sam's items 1-5. The order IS the ask: "SkyView label top left most",
   the view links folded into "a single drop down", the search "to the left of
   the chips … wider", the controls, and "a X to close in top right". */
/* The title is the page's h1 (the solo view has no other heading), sized to
   the row rather than to a page heading. */
.u-title{font-family:var(--serif);font-weight:700;font-size:.95rem;line-height:1.2;margin:0;
         color:var(--text-strong);white-space:nowrap;flex:0 0 auto}
/* Views menu. <details> carries open/close, Enter and Escape with no script;
   the summary is styled as the same link the four buttons used to be, so the
   row reads as one vocabulary. list-style:none + ::-webkit-details-marker kills
   the disclosure triangle in every engine — the word carries it. */
.u-views{position:relative;flex:0 0 auto}
.u-views>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;
                 gap:4px;min-height:24px;font-size:.86rem}
.u-views>summary::-webkit-details-marker{display:none}
.u-views>summary::after{content:"\25BE";font-size:.7em;color:var(--text-muted)}
/* ⚠️ A closed <details> still LAYS OUT its contents in Chromium — it skips
   painting them, not sizing them. `npm run a11y` measured all four menu items
   escaping the viewport at 390px and reported them as focusables with no ring,
   because forcing focus on a node the engine merely declines to paint still
   works. display:none is what actually takes them out of the layout and the
   tab order, and it is the difference between a hidden menu and a hidden
   keyboard trap. */
details.u-views:not([open]) .u-views-menu{display:none}   /* the flat list in the More panel has no [open] and must show */
.u-views-menu{position:absolute;z-index:70;top:calc(100% + 6px);left:0;min-width:210px;
              display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:6px;
              background:var(--surface-opaque,#fff);border:1px solid var(--border-strong,rgba(28,28,26,.30));
              border-radius:9px;box-shadow:0 12px 30px rgba(20,20,30,.17)}
.u-views-menu .linkish{display:flex;align-items:center;min-height:28px;padding:2px 8px;
                       border-radius:6px;text-align:left;font-size:.86rem}
.u-views-menu .linkish:hover{background:var(--surface-subtle,#F7F5F1)}
/* The search is BORROWED from the masthead (ccr_universe.js moves the form
   here), so it needs no markup of its own — only room. It takes the row's slack
   so it is the thing that grows, which is item 3's "make it wider". */
.u-search-slot{flex:1 1 240px;min-width:0;display:flex}
.u-search-slot .msearch{flex:1 1 auto;max-width:none;gap:6px}
.u-search-slot .msearch input{padding:5px 9px;font-size:.82rem}
.u-search-slot .msearch label{font-size:.82rem;color:var(--text-muted);white-space:nowrap}
/* ⚠️ The submit button STAYS VISIBLE. Hiding it as "redundant beside a live
   suggestion list" was tried and reverted the same hour: the row has slack at
   every width that fits one row, Sam never asked for it gone, and a control
   present in the DOM but invisible at desktop widths is the kind of thing a
   harness clicks and a person cannot. It only shrinks. */
.u-search-slot .msearch .u-search-go{padding:5px 10px;font-size:.8rem}
.u-close{flex:0 0 auto;margin-left:2px;background:none;border:1px solid var(--border-strong,rgba(28,28,26,.30));
         border-radius:8px;min-width:28px;min-height:28px;line-height:1;cursor:pointer;
         color:var(--text-muted);font-size:.9rem}
.u-close:hover{color:var(--text-strong);background:var(--surface-subtle,#F7F5F1)}
/* Item 4: "keep it all on one row for a typical PC view — it's fine if it wraps
   for narrower views." Nine controls plus a title plus a menu plus a search is
   only one row if the controls are compact, so they tighten between 1100 and
   1500 rather than wrapping. */
@media (max-width:1500px){
  .u-top .u-bar{gap:4px}
  .u-search-slot{flex-basis:180px}
}
@media (max-width:1100px){
  .u-top{flex-wrap:wrap}
  .u-top .u-bar{margin-left:0}
  .u-search-slot{flex:1 1 100%;order:5}
}
/* ── item 6: the legend folds away and the canvas takes the space ── */
.u-foot.u-foot-hidden{display:none}
@media (max-width:900px){
  /* Below the masthead's own stacking breakpoint the lift would make a
     third cramped row, so let it wrap normally instead. */
  .u-bar.u-bar-mast{margin-left:0;flex-basis:100%}
}
.u-bar .btn{font-size:.8rem;padding:6px 10px;background:var(--surface);backdrop-filter:blur(4px)}
.u-bar input[type=search]{flex:1 1 260px;min-width:0;font:inherit;font-size:.88rem;
  padding:8px 11px;border:1px solid var(--border-strong);border-radius:7px;
  background:var(--surface-opaque);color:var(--text-body)}
/* The zoom group's own label carries what Out/In/Reset act on, so the
   buttons could shorten to one word each without becoming glyphs. */
.u-zgroup{display:inline-flex;align-items:center;gap:4px}
.u-zlbl{font-size:.74rem;color:var(--text-muted);letter-spacing:.04em;text-transform:uppercase}
.u-hint{font-size:.8rem;color:var(--text-muted);padding:8px 12px;line-height:1.4;
        border:1px solid var(--border);border-radius:8px;background:var(--surface);backdrop-filter:blur(4px)}
.u-legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.74rem;color:var(--text-muted);
          background:var(--surface);backdrop-filter:blur(4px);padding:6px 9px;border:1px solid var(--border);
          border-radius:8px;max-width:min(640px,calc(100% - 24px))}
.u-legend span{display:flex;gap:5px;align-items:center}
.u-sw{width:10px;height:10px;border-radius:50%;border:2px solid var(--text-muted);display:inline-block;flex:none}
/* the marks are dots now (2026-09-05): a solid dot per system, a smaller lighter dot for a stand-alone */
.u-sw.s0{background:var(--sky-sys0-stroke);border-color:var(--sky-sys0-stroke)}
.u-sw.s1{background:var(--sky-sys1-stroke);border-color:var(--sky-sys1-stroke)}
.u-sw.s2{background:var(--sky-sys2-stroke);border-color:var(--sky-sys2-stroke)}
.u-sw.s3{background:var(--sky-sys3-stroke);border-color:var(--sky-sys3-stroke)}
.u-sw.orphan{width:7px;height:7px;border:0;background:var(--sky-sys0-stroke);opacity:.6;margin:0 1.5px}
.u-tip{position:absolute;z-index:6;pointer-events:none;background:var(--text-strong);color:var(--surface-opaque,#fff);
       font-size:.78rem;line-height:1.35;padding:7px 9px;border-radius:7px;max-width:300px;
       box-shadow:0 6px 18px rgba(20,20,30,.22)}
.u-tip .sub{color:var(--tip-sub,#D6D6D0)}
/* ══ 2026-09-05 — Sam's second SkyView list: one chip vocabulary (item 7),
   the zoom stack (8), the Show menu (3), the window controls and menu (1),
   the token search (2.1), the legend's own corner (5), the explainer (6) and
   the dark canvas (2). ══ */
:root{
  --u-chip-h:30px; --u-chip-fs:.8rem; --u-chip-r:6px;
  --on-accent:#fff; --tip-sub:#D6D6D0;
  /* the map's palette — the canvas reads these at draw time (ccr_universe.js readPal) */
  --sky-ground:#FFFFFF; --sky-island:#F7F5F1; --sky-island-hover:#F3F1EC; --sky-island-sel:#EDE7F8;
  --sky-island-stroke:rgba(28,28,26,.18); --sky-tether:rgba(109,40,217,.28); --sky-hollow:#FFFFFF;
  --sky-halo:rgba(255,255,255,.94); --sky-halo-fill:rgba(255,255,255,.8);
  --sky-ink:#1C1C1A; --sky-ink-body:#3A3A36; --sky-ink-muted:#5C5C55; --sky-ink-force:#0047AB; --sky-ink-alert:#920000;
  --sky-ring-search:#920000; --sky-ring-sel:#0047AB; --sky-ring-token:#0047AB;
  --sky-leader:rgba(28,28,26,.55); --sky-leader-dot:rgba(28,28,26,.62);
  --sky-leader-force:rgba(146,0,0,.75); --sky-leader-dot-force:rgba(146,0,0,.85);
  --sky-ring-faint:rgba(28,28,26,.22); --sky-gone:#87877F; --sky-sq-moved:#EAF1E6; --sky-sq-carried:#E7EEF9;
  --sky-sq-moved-stroke:#2C601A; --sky-drag:#0047AB;
  --sky-sys0-fill:#F1EAFC; --sky-sys0-stroke:#6D28D9; --sky-sys1-fill:#E7EEF9; --sky-sys1-stroke:#0047AB;
  --sky-sys2-fill:#FBF1D8; --sky-sys2-stroke:#8B6800; --sky-sys3-fill:#EFEFEC; --sky-sys3-stroke:#5C5C55;
}
/* The dark canvas (Sam, 2026-09-05: "Dark mode selector"). Opt-in and remembered
   per browser; First Light stays a light identity, and this is the one
   workspace that earns a dark ground — a map you stare at for an hour. Every
   text pair on #1E1E1C is measured: ink 13.9:1, body 11.0, muted 6.9, the
   on-dark cobalt 6.5, the on-dark mustard 7.7 (prototype/check_contrast.py). */
body.u-dark{
  --paper:#151514; --surface-opaque:#1E1E1C; --surface-subtle:#262624; --surface-muted:#30302E;
  --surface:rgba(30,30,28,.86); --text-strong:#ECE9E2; --text-body:#D6D6D0; --text-muted:#ABABA3; --text-faint:#7A7A74;
  --border:rgba(255,255,255,.14); --border-strong:rgba(255,255,255,.32);
  --cobalt:#7DA1D4; --seal-blue:#7DA1D4; --focus-ring:#7DA1D4; --violet:#B28DEB; --hunter:#89A67F;
  --crimson:#CF8F8F; --mustard-text:#E3B341; --on-accent:#141413; --tip-sub:#5C5C55;
  --sky-ground:#1E1E1C; --sky-island:#2A2A28; --sky-island-hover:#313130; --sky-island-sel:#34294A;
  --sky-island-stroke:rgba(255,255,255,.14); --sky-tether:rgba(178,141,235,.42); --sky-hollow:#1E1E1C;
  --sky-halo:rgba(30,30,28,.94); --sky-halo-fill:rgba(30,30,28,.8);
  --sky-ink:#ECE9E2; --sky-ink-body:#D6D6D0; --sky-ink-muted:#ABABA3; --sky-ink-force:#7DA1D4; --sky-ink-alert:#CF8F8F;
  --sky-ring-search:#CF8F8F; --sky-ring-sel:#7DA1D4; --sky-ring-token:#7DA1D4;
  --sky-leader:rgba(236,233,226,.55); --sky-leader-dot:rgba(236,233,226,.62);
  --sky-leader-force:rgba(207,143,143,.8); --sky-leader-dot-force:rgba(207,143,143,.9);
  --sky-ring-faint:rgba(255,255,255,.22); --sky-gone:#6B6B66; --sky-sq-moved:#1F3320; --sky-sq-carried:#1C2A44;
  --sky-sq-moved-stroke:#89A67F; --sky-drag:#7DA1D4;
  --sky-sys0-fill:#2B2140; --sky-sys0-stroke:#B28DEB; --sky-sys1-fill:#1C2A44; --sky-sys1-stroke:#7DA1D4;
  --sky-sys2-fill:#3A2E10; --sky-sys2-stroke:#E3B341; --sky-sys3-fill:#2A2A28; --sky-sys3-stroke:#ABABA3;
  color-scheme:dark;
}
body.u-dark .chip.cid{background:#1C2A44;border-color:#3A527A}
body.u-dark .chip.gen{background:#2B2140;border-color:#4C3A72}
body.u-dark .chip.ok{background:#1F3320;border-color:#3A5A38}
body.u-dark .chip.flag{background:#3A1A1A;border-color:#6A3030}
body.u-dark table.uc-like th{background:#30302E;color:var(--mustard-text)}
body.u-dark .u-views-menu,body.u-dark .u-show-menu,body.u-dark .sug{box-shadow:0 12px 30px rgba(0,0,0,.5)}
/* one chip vocabulary: the same height, size and corner on every control in the row */
.u-top .btn,.u-top .u-bar .btn,.u-top .u-views>summary,.u-top .u-show>summary,.u-top .u-win,
.u-search-slot .msearch input,.u-search-slot .msearch .u-search-go{
  box-sizing:border-box;height:var(--u-chip-h);min-height:var(--u-chip-h);padding:0 10px;margin:0;
  font-size:var(--u-chip-fs);font-weight:600;line-height:1;border-radius:var(--u-chip-r);
  display:inline-flex;align-items:center;gap:4px;backdrop-filter:none}
.u-top .btn,.u-top .u-bar .btn,.u-top .u-views>summary,.u-top .u-show>summary{
  background:var(--surface-opaque);border:1px solid var(--border-strong);color:var(--text-body);
  text-decoration:none;cursor:pointer}
.u-top .btn:hover,.u-top .u-views>summary:hover,.u-top .u-show>summary:hover{background:var(--surface-subtle)}
.u-top .btn[aria-pressed=true]{background:var(--seal-blue);border-color:var(--seal-blue);color:var(--on-accent)}
.u-top .u-modes,.u-top .u-seg{border-radius:var(--u-chip-r);height:var(--u-chip-h);align-items:stretch;margin:0}
.u-top .u-modes .btn.mode{height:calc(var(--u-chip-h) - 2px);min-height:0;border-radius:0;border:0}
.u-top .u-bar{gap:6px}
.u-top .u-win{width:var(--u-chip-h);padding:0;justify-content:center;background:var(--surface-opaque);
  border:1px solid var(--border-strong);color:var(--text-muted);font-size:.9rem;font-weight:400;cursor:pointer}
.u-top .u-win:hover{color:var(--text-strong);background:var(--surface-subtle)}
.u-top .u-win[hidden]{display:none}
.u-wins{display:inline-flex;gap:4px;flex:0 0 auto;margin-left:2px}
.u-top .u-menu{font-size:1rem;margin-right:2px}
/* the zoom label and its figure stack inside one chip height (item 8) */
.u-zgroup{gap:4px}
.u-zstack{display:inline-flex;flex-direction:column;justify-content:center;align-items:center;
  height:var(--u-chip-h);line-height:1;padding:0 4px 0 2px;gap:2px}
.u-zstack .u-zlbl{font-size:.58rem;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.u-zstack b{font-size:.7rem;color:var(--text-strong);font-variant-numeric:tabular-nums}
/* the Show menu (item 3) */
.u-show{position:relative;flex:0 0 auto}
.u-show>summary{list-style:none}
.u-show>summary::-webkit-details-marker{display:none}
.u-show>summary::after{content:"\25BE";font-size:.7em;color:var(--text-muted)}
.u-show>summary b{font-weight:700;color:var(--text-strong)}
.u-show:not([open]) .u-show-menu{display:none}
.u-show-menu{position:absolute;z-index:70;top:calc(100% + 6px);right:0;min-width:260px;
  display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:var(--surface-opaque);
  border:1px solid var(--border-strong);border-radius:9px;box-shadow:0 12px 30px rgba(20,20,30,.17)}
.u-show-menu fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:0;min-width:0}
.u-show-menu legend{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);
  padding:0;margin:0 0 2px;font-weight:700}
.u-show-menu label{display:flex;align-items:center;gap:7px;font-size:.84rem;min-height:26px;cursor:pointer;color:var(--text-body)}
.u-show-menu input{width:16px;height:16px;margin:0;accent-color:var(--cobalt);flex:none}
.u-show-all .linkish{font-size:.84rem;min-height:24px;display:inline-flex;align-items:center}
/* the token search (2.1): chips before the box, a wider dropdown whose rows wrap (2.2, 2.4) */
.u-search-slot .sugwrap{flex-wrap:wrap;gap:6px;align-items:center}
.u-tokens{display:contents}
.u-tok{display:inline-flex;align-items:center;gap:5px;height:var(--u-chip-h);padding:0 3px 0 8px;
  border:1px solid var(--border-strong);border-radius:var(--u-chip-r);background:var(--surface-subtle);
  font-size:.78rem;max-width:150px;color:var(--text-body)}
.u-tok-k{font-size:.6rem;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);white-space:nowrap}
.u-tok-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.u-tok-x{border:0;background:none;color:var(--text-muted);cursor:pointer;font-size:1rem;line-height:1;
  width:24px;height:24px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.u-tok-x:hover{background:var(--surface-muted);color:var(--text-strong)}
.u-tokens .u-tok-act{font:inherit;font-size:.78rem;font-weight:600;height:var(--u-chip-h);display:inline-flex;align-items:center;
  padding:0 9px;margin-right:2px;text-decoration:none;color:var(--text-body);border:1px solid var(--border-strong);
  border-radius:var(--u-chip-r);background:var(--surface-opaque);cursor:pointer;line-height:1}
.u-tokens .u-tok-act:hover{color:var(--text-strong);background:var(--surface-subtle)}
.u-search-slot .msearch input{flex:1 1 100px;min-width:72px;font-weight:400;background:var(--surface-opaque);
  color:var(--text-body);border:1px solid var(--border-strong)}
.sug{right:auto;min-width:100%;width:min(760px,calc(100vw - 24px))}
.sug li{align-items:flex-start;white-space:normal}
.sg-k,.sg-l,.sg-r{font-size:.84rem}
.sg-k{min-width:7.4em;padding-top:.05em;letter-spacing:.04em}
.sg-l{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
/* every row carries a checkbox, so the list reads as the multi-select it is (item 3, 2026-09-05) */
.sg-cb{flex:none;width:15px;height:15px;margin-top:.12em;border:1.5px solid var(--border-strong);border-radius:3px;
  background:var(--surface-opaque);position:relative;box-sizing:border-box}
.sug li.picked .sg-cb{background:var(--cobalt);border-color:var(--cobalt)}
.sug li.picked .sg-cb::after{content:"";position:absolute;left:4px;top:0px;width:4px;height:8px;
  border:solid var(--on-accent,#fff);border-width:0 2px 2px 0;transform:rotate(45deg)}
.sug li.picked .sg-l{color:var(--text-strong)}
.sg-r{white-space:normal;flex:0 1 auto;text-align:right;max-width:44%;overflow-wrap:anywhere}
/* the legend folds from the map's own corner (item 5) */
.u-legend-toggle{position:absolute;z-index:4;right:10px;bottom:8px;display:inline-flex;align-items:center;gap:6px;
  min-height:26px;padding:2px 9px;font:inherit;font-size:.76rem;font-weight:400;color:var(--text-muted);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--u-chip-r);cursor:pointer;backdrop-filter:blur(4px)}
.u-legend-toggle:hover{color:var(--text-strong);background:var(--surface-opaque)}
.u-legend-toggle .u-fold{font-size:.7em;color:var(--text-muted)}
/* How SkyView works (item 6) */
.how{max-width:var(--cpl-measure,none)}
.how-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 8px}
.how-head h1{margin:0}
.how-lede{font-size:1.05rem}
.how h2{margin:22px 0 8px}
.how-fig{margin:10px 0 14px;max-width:560px;background:var(--surface-opaque);border:1px solid var(--border);border-radius:9px;padding:10px 12px}
.how-fig svg{width:100%;height:auto;display:block}
.how-list{margin:0 0 .8em;padding-left:20px}
.how-list li{margin:0 0 6px}
.how-steps{margin:0;padding-left:22px}
.how-steps li{margin:0 0 6px}
.how kbd{font-family:inherit;font-size:.9em;border:1px solid var(--border-strong);border-radius:4px;padding:0 5px;background:var(--surface-subtle)}
@media (max-width:1100px){ .u-wins{margin-left:auto} }
/* ── the header's own vocabulary (Sam, 2026-09-05, from a screenshot of Claude's
   header): ghosted icon actions, a title field, one More menu, expand + close ── */
.u-top .u-ico{box-sizing:border-box;width:var(--u-chip-h);height:var(--u-chip-h);min-height:var(--u-chip-h);padding:0;margin:0;
  display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:var(--u-chip-r);
  background:transparent;color:var(--text-muted);font:inherit;font-size:1rem;line-height:1;cursor:pointer;list-style:none}
.u-top .u-ico:hover{background:var(--surface-subtle);color:var(--text-strong);border-color:var(--border)}
.u-top .u-ico[hidden]{display:none}
.u-top .u-ico::-webkit-details-marker{display:none}
.u-top .u-title{border:0;background:transparent;height:var(--u-chip-h);padding:0 6px;
  display:inline-flex;align-items:center;font-size:.92rem;color:var(--text-strong)}
.u-top .u-zgroup{gap:0;border:1px solid var(--border-strong);border-radius:var(--u-chip-r);background:var(--surface-opaque);height:var(--u-chip-h);align-items:center;padding:0 2px}
.u-top .u-zgroup .u-ico{border-color:transparent;height:calc(var(--u-chip-h) - 4px);width:26px}
.u-zread{font-size:.74rem;color:var(--text-strong);font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center;padding:0 2px}

</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header class="mast"><div class="wrap">
  <span class="brand">SkyView <span class="tag" id="prov" tabindex="0">— prototype v1</span></span>
  <form class="msearch" id="msearch" role="search">
    <label for="gq" class="sr">Search courses, colleges and disciplines</label>
    <div class="sugwrap">
      <input type="search" id="gq" autocomplete="off" role="combobox" aria-expanded="false"
             aria-autocomplete="list" aria-controls="sug" aria-haspopup="listbox"
             placeholder="Search a course, code or discipline">
      <ul class="sug" id="sug" role="listbox" aria-multiselectable="true" aria-label="Search suggestions" hidden></ul>
    </div>
  </form>
</div>
</header>

<main class="wrap" id="main">
  <div class="crumbrow" id="crumbrow"><ol class="crumbs" id="crumbs"></ol><div class="crumbs-views" id="crumbs-views"></div></div>
  <div id="view"></div>
  <footer>
    <p><strong>Prototype.</strong> Nothing here writes to Supabase. A move records the exact
    <code>kb_curation</code> row the live tab would write, so the write path can be reviewed before
    it is wired. Built from the published CCR artifacts — no live reads.</p>
  </footer>
</main>

<script id="atlas-data" type="application/json">__DATA__</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById("atlas-data").textContent);
var view = document.getElementById("view");
var crumbs = document.getElementById("crumbs");
var BLANK = "(no discipline yet)";
var state = {v:"forest", disc:null, dec:null, q:""};

// The provenance line is a hover on the title, not a line of its own (Sam,
// 2026-09-03: "remove prototype intro text and add it as a hover over on the
// Prototype V1 title. I want to maximize the SkyView window").
var provText = "Prototype — no writes. CCR artifacts generated " + (DATA._generated_from || "—") +
  " · " + DATA.totals.decision_components.toLocaleString("en-US") + " decisions over " +
  DATA.totals.identities_inbrowser.toLocaleString("en-US") + " identities.";
var provEl = document.getElementById("prov");
if (provEl){ provEl.title = provText; provEl.setAttribute("aria-label", "prototype v1 — " + provText); }
document.getElementById("msearch").addEventListener("submit", function(ev){
  ev.preventDefault();
  // A highlighted suggestion IS the answer: pressing Enter on it must go where
  // the reader is looking, not re-run a ranking rule that may pick differently.
  if (takeHighlighted()) return;
  closeSug();
  var term = document.getElementById("gq").value;
  // One search box, two behaviors, chosen by what is on screen: with the map
  // open it flies and rings; anywhere else it lists results. The canvas being
  // in the DOM is the test rather than a flag we keep in step by hand — every
  // other view replaces #view wholesale, so it cannot go stale.
  if (document.getElementById("u-cvs") && typeof window.__ccrUniverseSearch === "function")
    window.__ccrUniverseSearch(term);
  else
    search(term);
});

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

/* ══ search suggestions ══════════════════════════════════════════════════
 * Sam, 2026-08-25: "The keyword search should start to show likely matches
 * based on key entries — like a Google search does."
 *
 * The corpus lives in ccr_universe.js, which owns __ccrSuggest and knows how to
 * fly; this owns the dropdown, because the box is in the MASTHEAD and every
 * view below replaces #view wholesale. Splitting it the other way would put a
 * DOM the views can destroy inside the module that must keep it.
 *
 * WHY THIS MATTERS BEYOND CONVENIENCE: a term can name several subjects
 * ("art" → Art, Culinary Arts, Theater Arts), and on Enter something has to
 * choose. Choosing for the curator is a guess however it is ranked. Here they
 * choose first, and the guess never happens.
 */
var sugEl = document.getElementById("sug");
var gqEl = document.getElementById("gq");
var sugItems = [], sugAt = -1;

function closeSug(){
  sugItems = []; sugAt = -1;
  if (!sugEl) return;
  sugEl.hidden = true; sugEl.innerHTML = "";
  if (gqEl){ gqEl.setAttribute("aria-expanded","false"); gqEl.removeAttribute("aria-activedescendant"); }
}
/* ⚠️ CLOSE ON A CLICK OUTSIDE THE SEARCH. Nothing did this before: the
 * suggestion list stayed open until you picked an item or submitted, and it is
 * absolutely positioned over whatever the page put beneath the masthead. That
 * was survivable while SkyView's controls sat on a SECOND row, far enough down
 * to clear it. Consolidating the top to one row (Sam, 2026-09-04: "I want all
 * the real estate for the universe view") moved the view links up under the open
 * list, and Chromium reported them unclickable — the dropdown was intercepting
 * every pointer event aimed at them.
 *
 * Containment at the boundary, not a handler per control: the pane grows new
 * controls and every one of them would otherwise have to remember. pointerdown
 * rather than click, for the reason the item handler below already documents. */
document.addEventListener("pointerdown", function(e){
  if (!sugEl || sugEl.hidden) return;
  var t = e.target;
  if (t && typeof t.closest === "function" && t.closest(".msearch")) return;
  closeSug();
}, true);

function markSug(){
  if (!sugEl) return;
  // The cursor is a class and aria-activedescendant; aria-selected is the PICK
  // (the listbox is multi-select, and the checkbox on each row shows it).
  Array.prototype.forEach.call(sugEl.children, function(li,i){
    li.classList.toggle("on", i === sugAt);
  });
  if (gqEl){
    if (sugAt >= 0) gqEl.setAttribute("aria-activedescendant","sug-"+sugAt);
    else gqEl.removeAttribute("aria-activedescendant");
  }
}
function takeHighlighted(){
  if (sugAt < 0 || !sugItems[sugAt]) return false;
  var it = sugItems[sugAt], at = sugAt;
  var go = window.__ccrToggleSuggestion || window.__ccrGoSuggestion;
  var ok = (typeof go === "function") ? !!go(it) : false;
  // The list stays open with the pick ticked, so a second pick is one more click
  // (Sam, 2026-09-05: the rows "should have checkboxes to clarify" multi-select).
  if (gqEl && gqEl.value.trim().length >= 2){ openSug(gqEl.value); sugAt = Math.min(at, sugItems.length - 1); markSug(); }
  else closeSug();
  return ok;
}
function openSug(term){
  if (!sugEl || typeof window.__ccrSuggest !== "function") return;
  sugItems = window.__ccrSuggest(term, 8) || [];
  sugAt = -1;
  if (!sugItems.length){ closeSug(); return; }
  var picked = (typeof window.__ccrTokenKeys === "function") ? window.__ccrTokenKeys() : [];
  sugEl.innerHTML = sugItems.map(function(it,i){
    // The KIND is a word, not a color or an icon: "subject" and "course" are
    // different destinations and the reader has to be able to tell which one
    // they are about to be sent to.
    var right = it.kind === "subject"
      ? num(it.n) + " identit" + (it.n === 1 ? "y" : "ies")
      : esc(it.sub || "");
    var key = (typeof window.__ccrTokenKey === "function") ? window.__ccrTokenKey(it) : "";
    var on = !!key && picked.indexOf(key) >= 0;
    return '<li id="sug-'+i+'" role="option" aria-selected="'+(on ? "true" : "false")+'" data-i="'+i+'"'+(on ? ' class="picked"' : '')+'>'+
      '<span class="sg-cb" aria-hidden="true"></span>'+
      '<span class="sg-k">'+esc(it.kindShort || it.kindWord || (it.kind === "subject" ? "DISC" : "CRSE"))+'</span>'+
      '<span class="sg-l">'+esc(it.label)+'</span>'+
      '<span class="sg-r">'+right+'</span></li>';
  }).join("");
  sugEl.hidden = false;
  if (gqEl) gqEl.setAttribute("aria-expanded","true");
  Array.prototype.forEach.call(sugEl.children, function(li){
    // mousedown, not click: the input's blur fires first on a click and would
    // close the list out from under the pointer.
    li.addEventListener("mousedown", function(ev){
      ev.preventDefault(); sugAt = +li.dataset.i; takeHighlighted();
    });
    li.addEventListener("mouseenter", function(){ sugAt = +li.dataset.i; markSug(); });
  });
}
if (gqEl){
  gqEl.addEventListener("input", function(){ openSug(gqEl.value); });
  gqEl.addEventListener("keydown", function(ev){
    if (ev.key === "Escape"){ closeSug(); return; }
    // An empty box and Backspace drops the last chip of the selection (2026-09-05).
    if (ev.key === "Backspace" && !gqEl.value && typeof window.__ccrTokenBack === "function"){
      if (window.__ccrTokenBack()) ev.preventDefault();
      return;
    }
    if (!sugItems.length) return;
    if (ev.key === "ArrowDown"){ ev.preventDefault(); sugAt = (sugAt+1) % sugItems.length; markSug(); }
    else if (ev.key === "ArrowUp"){ ev.preventDefault(); sugAt = (sugAt<=0?sugItems.length:sugAt)-1; markSug(); }
  });
  gqEl.addEventListener("blur", function(){ setTimeout(closeSug, 120); });
}
function num(n){return (n==null?0:n).toLocaleString("en-US");}

/* ══ breadcrumbs ══ */
window.__crumbs = setCrumbs;
function setCrumbs(items, opts){
  // Every view passes through here, so this is where the map's full-bleed
  // frame is taken down: the universe view puts it back after calling us.
  // Same for SkyView-alone (body.u-solo), which hides the masthead — every
  // other view needs the masthead back, and the map re-applies the class.
  //
  // ⚠️ And it is where the borrowed search box goes HOME. The map moves the
  // page's one search form into its own top row; every other view replaces
  // #view wholesale, which would take the form down with it. The wrapper in
  // ccr_universe.js covered the window.__ccr* entry points, but this file's
  // own forest cells call discipline() directly — and under the comprehensive
  // map one click on a cell destroyed the search box (found by the harness on
  // 2026-09-05, latent since the box moved on 2026-09-04). Every view calls
  // this before it renders, so this is the one place that cannot be missed.
  // opts.view names the view being entered, for the Views menu's "you are
  // here"; a view that names none gets every item offered.
  if (typeof window.__ccrLeaveView === "function") window.__ccrLeaveView(opts && opts.view);
  var main = document.getElementById("main");
  if (main) main.classList.remove("u-fullbleed");
  document.body.classList.remove("u-solo");
  crumbs.innerHTML = items.map(function(it,i){
    return "<li>" + (it.go
      ? '<button type="button" data-c="'+i+'">'+esc(it.label)+"</button>"
      : "<span aria-current=\"page\">"+esc(it.label)+"</span>") + "</li>";
  }).join("");
  Array.prototype.forEach.call(crumbs.querySelectorAll("button"), function(b){
    b.addEventListener("click", function(){ items[+b.dataset.c].go(); });
  });
  // The Views menu rides the crumbs row on every view but the map, whose own
  // top row carries it (Sam, item 9, 2026-09-04). The map passes {menu:false}
  // so the page never holds two menus with one set of ids.
  var mh = document.getElementById("crumbs-views");
  if (mh){
    mh.innerHTML = "";
    if (!(opts && opts.menu === false) && typeof window.__ccrViewsMenu === "function")
      window.__ccrViewsMenu(mh);
  }
}

/* ══ VIEW 1 — the forest ══════════════════════════════════════════════ */
/* Renders into `host`. Stand-alone (the "All disciplines" view) it owns #view;
 * EMBEDDED it paints below the SkyView map, so the "other info" Sam scrolls down
 * for is the same forest, not a copy — and the crumbs and state stay the map's. */
function forest(host, opts){
  opts = opts || {};
  var embedded = !!opts.embedded;
  /* Stand-alone, "All disciplines" is the workspace's By discipline view since
   * 2026-09-05 (Sam's items 6-9: disciplines, subjects and ESL packaging on ONE
   * tab, with toggles and a link back to SkyView). This grid still renders
   * EMBEDDED under the comprehensive map, and stands in as a landing view only
   * when the universe payload is missing — a blank page is worse. */
  if (!embedded && window.CPL_CCR_UNIVERSE && typeof window.__ccrWorkspace === "function")
    return window.__ccrWorkspace("discipline", opts);
  host = host || view;
  if (!embedded) {
    state.v="forest"; state.disc=null; state.dec=null;
    setCrumbs([{label:"All disciplines"}]);
  }
  var t = DATA.totals, ds = DATA.disciplines;
  var named = ds.filter(function(d){return d.name!==BLANK;});
  var withWork = named.filter(function(d){return d.decisions>0;});
  var small = withWork.filter(function(d){return d.decisions<=40;});
  var triage = ds.filter(function(d){return d.name===BLANK;})[0];

  var h = [];
  h.push(embedded
    ? '<h2 style="margin-top:.4em">The work, by discipline</h2>'
    : '<h1>The Common Course Reference, by the job in front of you</h1>');
  h.push('<div class="lede"><p>The CCR presents as <strong>'+num(t.identities_inbrowser)+
    ' course identities</strong> and <strong>'+num(t.suggestion_groups)+' pending suggestions</strong> — a number nobody can '+
    'hold, let alone finish. Grouped the way the work actually decomposes, it is <strong>'+
    num(t.decision_components)+' decisions</strong>, and <strong>97% of them involve 12 identities or fewer</strong>. '+
    'The most common decision in the whole corpus is a <strong>pair</strong>: same course, or not?</p>'+
    '<p>Sorted by discipline, <strong>'+small.length+' of '+withWork.length+
    ' disciplines carry 40 decisions or fewer</strong> — a sitting each, with a finish line you can see.</p></div>');

  h.push('<div class="banner"><p><strong>ESL packaging proposal</strong> \u2014 '+
    '1,846 identities folding into three courses, drawn against today\u2019s data. Nothing written.</p>'+
    '<button class="btn primary" type="button" id="go-esl">See the proposal</button></div>');
  if (!embedded)   // under the map itself this door would open onto where you already are
    h.push('<div class="banner" style="border-left-color:var(--cobalt)"><p><strong>Back to the map</strong> \u2014 '+
      'every course identity on one canvas, with keyword zoom. Drag a subject next to another to move a '+
      'course that was filed under the wrong one.</p>'+
      '<button class="btn primary" type="button" id="go-universe">Open the map</button></div>');
  h.push('<div class="hero">'+
    '<div class="frame" id="hero-gfx"></div>'+
    '<div>'+
      '<'+(embedded?"h3":"h2")+' id="hero-h">One decision, drawn</'+(embedded?"h3":"h2")+'>'+
      '<p id="hero-p"></p>'+
      '<div class="row">'+
        '<button class="btn primary" type="button" id="hero-open">Open this one</button>'+
        '<button class="btn" type="button" id="hero-next">Show me another</button>'+
      '</div>'+
      '<p class="cap">Every circle is one course identity; its size is how many colleges teach it. '+
      'Lines mean an evidence lane thinks they are the same course. This is what you work in — '+
      'the grid below is just how you get here.</p>'+
    '</div></div>');
  h.push('<div class="stats">');
  h.push(stat(num(t.decision_components),"decisions","not "+num(t.identities_inbrowser)+" rows"));
  h.push(stat("97%","are ≤12 identities","modal size is 2"));
  h.push(stat(String(withWork.length),"disciplines with work","median 12 decisions"));
  h.push(stat(num(triage?triage.decisions:0),"in the triage pile","no discipline yet — a different job"));
  h.push("</div>");

  // Under the map the header's search box is the one keyword field on screen
  // (Sam, 2026-08-25: two search fields that behave differently is a question
  // about which to use), so the embedded grid carries only its toggle.
  h.push('<div class="tools">'+
    (embedded ? '' :
    '<label for="q">Find a discipline</label>'+
    '<input type="search" id="q" placeholder="e.g. welding, fire, nursing" value="'+esc(state.q)+'">')+
    '<button class="btn" type="button" id="only-demo" aria-pressed="false">Only disciplines with sample data</button>'+
    '</div>');
  h.push('<div class="legend">'+
    '<span><i class="sw" style="background:var(--violet)"></i> ✨ open decisions</span>'+
    '<span><i class="sw" style="background:var(--crimson)"></i> ⚠ flagged identities</span>'+
    '<span><i class="sw" style="background:var(--hunter)"></i> ✓ curator-reviewed</span>'+
    '<span><i class="sw" style="background:var(--cobalt)"></i> sample data loaded in this prototype</span>'+
    '</div>');
  h.push('<div class="grid" id="grid"></div>');
  host.innerHTML = h.join("");

  var q = document.getElementById("q"), only=document.getElementById("only-demo");
  var onlyDemo = false;
  function paint(){
    var term = state.q.trim().toLowerCase();
    var list = ds.filter(function(d){
      if(onlyDemo && !DATA.detail[d.name]) return false;
      return !term || d.name.toLowerCase().indexOf(term)>=0;
    });
    // Disciplines this prototype can actually OPEN come first. Sorted purely by
    // decision count, the top three cells are dead ends — the first thing a
    // reader clicks tells them nothing works.
    list = list.slice().sort(function(a,b){
      var da = DATA.detail[a.name] ? 0 : 1, db = DATA.detail[b.name] ? 0 : 1;
      return (da-db) || (b.decisions-a.decisions) || (b.ids-a.ids);
    });
    document.getElementById("grid").innerHTML = list.length
      ? list.map(cell).join("")
      : '<p class="empty">No discipline matches that.</p>';
    Array.prototype.forEach.call(host.querySelectorAll(".cell"), function(b){
      b.addEventListener("click", function(){ discipline(b.dataset.d); });
    });
  }
  // Featured decisions: big enough to show structure, small enough to read.
  var featured=[];
  Object.keys(DATA.detail).forEach(function(dn){
    DATA.detail[dn].forEach(function(p,pi){
      if(p.nodes.length>=6 && p.nodes.length<=13) featured.push({d:dn,i:pi,p:p});
    });
  });
  featured.sort(function(a,b){ return b.p.members-a.p.members; });
  featured = featured.slice(0,12);
  var fi = 0;
  function paintHero(){
    if(!featured.length || typeof window.__ccrPreview !== "function"){
      var hero = host.querySelector(".hero"); if(hero) hero.remove();
      return;
    }
    var f = featured[fi % featured.length];
    window.__ccrPreview(document.getElementById("hero-gfx"), f.p);
    document.getElementById("hero-h").textContent =
      f.p.nodes.length + " identities that may be the same course";
    document.getElementById("hero-p").innerHTML =
      "<strong>"+esc(f.d)+"</strong> \u00b7 "+num(f.p.members)+
      " local courses sit underneath these. Open it and you can move any one of them "+
      "onto the identity it belongs to.";
    document.getElementById("hero-open").onclick = function(){ window.__ccrDecision(f.d, f.i); };
  }
  var goU=document.getElementById("go-universe");
  if(goU){
    if(window.CPL_CCR_UNIVERSE && typeof window.__ccrUniverse==="function")
      goU.addEventListener("click", function(){ window.__ccrUniverse(); });
    else goU.closest(".banner").remove();
  }
  var goEsl=document.getElementById("go-esl");
  if(goEsl){
    if(window.CPL_ATLAS_ESL && typeof window.__ccrEsl==="function")
      goEsl.addEventListener("click", function(){ window.__ccrEsl(); });
    else goEsl.closest(".banner").remove();   // never offer a door that opens on nothing
  }
  document.getElementById("hero-next").addEventListener("click", function(){
    fi++; paintHero();
  });
  paintHero();

  if (q) q.addEventListener("input", function(){ state.q=q.value; paint(); });
  only.addEventListener("click", function(){
    onlyDemo=!onlyDemo; only.setAttribute("aria-pressed",String(onlyDemo)); paint();
  });
  paint();
}
function stat(n,l,s){
  return '<div class="stat"><span class="n">'+esc(n)+'</span>'+
         '<span class="l">'+esc(l)+'</span><div class="s">'+esc(s)+"</div></div>";
}
function cell(d){
  var has = !!DATA.detail[d.name], tri = d.name===BLANK;
  var tot = Math.max(d.ids,1);
  var fw = Math.round(100*d.flagged/tot), rw = Math.round(100*d.reviewed/tot);
  var ow = Math.max(0, Math.min(100-fw-rw, Math.round(100*d.decisions/tot)));
  return '<button class="cell'+(tri?" triage":"")+(has?" demo":"")+'" type="button" data-d="'+esc(d.name)+'">'+
    '<span class="nm">'+esc(d.name)+(has?' <span class="chip cid">sample</span>':"")+"</span>"+
    '<span class="dec">'+num(d.decisions)+' <span class="meta">'+(d.decisions===1?"decision":"decisions")+"</span></span>"+
    '<span class="meta">'+num(d.ids)+" identities · "+num(d.members)+" local courses</span>"+
    '<span class="bar" role="img" aria-label="'+d.flagged+' flagged, '+d.reviewed+' reviewed of '+d.ids+' identities">'+
      '<i class="o" style="width:'+ow+'%"></i><i class="f" style="width:'+fw+'%"></i><i class="r" style="width:'+rw+'%"></i>'+
    "</span>"+
    (tri?'<span class="meta">⚠ needs a discipline before it can be merged</span>':"")+
    "</button>";
}

/* ══ SEARCH — jump straight to a course, a code or a discipline ══════ */
function hl(text, term){
  var t=String(text||""), i=t.toLowerCase().indexOf(term);
  if(i<0) return esc(t);
  return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+term.length))+"</mark>"+esc(t.slice(i+term.length));
}
function search(term){
  term=String(term||"").trim().toLowerCase();
  state.v="search"; state.q=term;
  setCrumbs([{label:"Disciplines and subjects",go:forest},{label:'Search: "'+term+'"'}]);
  if(term.length<2){
    view.innerHTML='<h1>Search</h1><p class="empty">Type at least two characters.</p>';
    return;
  }
  var hits=[], CAP=60;
  // disciplines (all 158)
  DATA.disciplines.forEach(function(d){
    if(d.name.toLowerCase().indexOf(term)>=0)
      hits.push({kind:"discipline", label:d.name, why:num(d.decisions)+" decisions · "+num(d.ids)+" identities",
                 path:"Discipline", go:function(){ discipline(d.name); }});
  });
  // identities + local courses, inside the disciplines this prototype embeds
  Object.keys(DATA.detail).forEach(function(dn){
    DATA.detail[dn].forEach(function(p,pi){
      p.nodes.forEach(function(nd){
        if((nd.t||"").toLowerCase().indexOf(term)>=0 || nd.id.toLowerCase().indexOf(term)>=0){
          hits.push({kind:"identity", label:nd.t||nd.id,
                     why:nd.id+" · "+nd.n+" college"+(nd.n===1?"":"s")+
                         (nd.flags.length?" · ⚠ flagged":""),
                     path:dn+" › decision with "+p.nodes.length+" identit"+(p.nodes.length===1?"y":"ies"),
                     go:function(){ window.__ccrDecision(dn,pi); }});
        }
        nd.m.forEach(function(m){
          var inCode=(m.n||"").toLowerCase().indexOf(term)>=0;
          var inTtl=(m.t||"").toLowerCase().indexOf(term)>=0;
          var inCol=(m.c||"").toLowerCase().indexOf(term)>=0;
          if(inCode||inTtl||inCol)
            hits.push({kind:"course", label:(m.n||"")+" — "+(m.t||""),
                       why:m.c+" · sits under "+(nd.t||nd.id),
                       path:dn+" › decision with "+p.nodes.length+" identit"+(p.nodes.length===1?"y":"ies"),
                       go:function(){ window.__ccrDecision(dn,pi); }});
        });
      });
    });
  });
  var order={discipline:0, identity:1, course:2};
  hits.sort(function(a,b){ return (order[a.kind]-order[b.kind]) || a.label.localeCompare(b.label); });
  var shown=hits.slice(0,CAP);
  var h=["<h1>"+esc(term)+"</h1>"];
  h.push("<p>"+(hits.length?num(hits.length)+" match"+(hits.length===1?"":"es"):"No match")+
         (hits.length>CAP?" — showing the first "+CAP:"")+
         ". Disciplines first, then course identities, then the colleges' own courses.</p>");
  h.push('<div class="note"><p><strong>Prototype scope.</strong> All '+
         num(DATA.disciplines.length)+' disciplines are searchable. Individual courses are searchable inside the '+
         Object.keys(DATA.detail).length+' disciplines this file embeds — the real tab would index all '+
         num(DATA.totals.member_rows)+'.</p></div>');
  if(shown.length){
    h.push('<ul class="hits">'+shown.map(function(x,i){
      return '<li><button type="button" data-h="'+i+'">'+
        '<span class="path">'+esc(x.path)+"</span>"+
        "<span><strong>"+hl(x.label,term)+"</strong></span>"+
        '<span class="why">'+esc(x.why)+"</span></button></li>";
    }).join("")+"</ul>");
  }
  view.innerHTML=h.join("");
  Array.prototype.forEach.call(view.querySelectorAll(".hits button"), function(b){
    b.addEventListener("click", function(){ shown[+b.dataset.h].go(); });
  });
}

/* ══ VIEW 2 — one discipline ══════════════════════════════════════════ */
function discipline(name){
  state.v="disc"; state.disc=name; state.dec=null;
  setCrumbs([{label:"Disciplines and subjects",go:forest},{label:name}]);
  var meta = DATA.disciplines.filter(function(d){return d.name===name;})[0]||{};
  var packs = DATA.detail[name];
  var h=[];
  h.push("<h1>"+esc(name)+"</h1>");
  h.push('<div class="stats">');
  h.push(stat(num(meta.decisions||0),"decisions here","the unit of work"));
  h.push(stat(num(meta.ids||0),"course identities",num(meta.members||0)+" local courses under them"));
  h.push(stat(num(meta.flagged||0),"⚠ carry a data flag","mixed TOP, mixed credit type…"));
  h.push(stat(num(meta.reviewed||0),"✓ curator-reviewed","of "+num(meta.ids||0)));
  h.push("</div>");
  if(!packs){
    h.push('<div class="note"><p><strong>No sample data for this discipline in the prototype.</strong> '+
      'The extract embeds five disciplines so the file stays small enough to open instantly. '+
      'The real tab would load this on demand. Try <strong>Welding</strong>, <strong>Automotive Technology</strong>, '+
      '<strong>Fire Technology</strong>, <strong>Administration of Justice</strong> or '+
      '<strong>Child Development/Early Childhood Education</strong>.</p></div>');
    view.innerHTML=h.join("");
    return;
  }
  h.push('<p>Each card is one decision — a small group of identities that some evidence lane thinks '+
    'may be the same course. Open one to see the courses underneath and move any of them.</p>');
  h.push('<div class="decks" id="decks"></div>');
  view.innerHTML=h.join("");
  document.getElementById("decks").innerHTML = packs.map(function(p,i){
    var names = p.nodes.slice(0,4).map(function(n){
      return "<li>"+esc(n.t||n.id)+' <span class="sub">'+esc(n.id)+"</span></li>";}).join("");
    return '<button class="deck" type="button" data-i="'+i+'">'+
      '<span class="hd"><span class="sz">'+p.nodes.length+' identit'+(p.nodes.length===1?"y":"ies")+"</span>"+
      (p.flagged?'<span class="chip flag">⚠ '+p.flagged+"</span>":'<span class="chip mut">no flags</span>')+"</span>"+
      "<ul>"+names+"</ul>"+
      (p.nodes.length>4?'<span class="more">+'+(p.nodes.length-4)+" more</span>":"")+
      '<span class="more">'+num(p.members)+" local courses</span>"+
      "</button>";
  }).join("");
  Array.prototype.forEach.call(view.querySelectorAll(".deck"), function(b){
    b.addEventListener("click", function(){ window.__ccrDecision(name, +b.dataset.i); });
  });
}
window.__ccrForest = function(){ forest(view); };
window.__ccrForestInto = function(el){ if (el) forest(el, {embedded:true}); };
window.__ccrDiscipline = discipline;
window.__ccrSearch = search;
// Boot after EVERY script in the document has run — the graph module defines
// __ccrPreview/__ccrDecision below this one, and forest() uses both.
//
// SkyView leads (Sam, 2026-08-25: "SkyView should be the initial CCR tab … I
// think SkyView is more manageable and less intimidating"), and since
// 2026-09-05 it leads ALONE — the map filling the window, the comprehensive
// view and the workspace one menu click away. __ccrRoute reads the hash
// (#skyview · #comprehensive · #disciplines · #subjects · #esl) so a view can be
// linked to. It falls back to the forest when the universe payload is missing,
// because a blank landing view is worse than a less friendly one.
function boot(){
  // The served page fetches its payloads first and routes when they arrive
  // (build_ccr_atlas.py's loader sets this flag); painting the forest under a
  // "Loading" message it is about to replace helps nobody.
  if (window.CPL_SKYVIEW_LOADING) return;
  if (typeof window.__ccrRoute === "function") window.__ccrRoute();
  else if (window.CPL_CCR_UNIVERSE && typeof window.__ccrUniverse === "function") window.__ccrUniverse();
  else forest();
}
if (document.readyState === "loading")
  document.addEventListener("DOMContentLoaded", boot);
else boot();
})();
</script>
